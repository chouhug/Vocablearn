"陰性複數":"feminine plural",
"「（某物）被需要」時用 essere：mi è servito":"Use essere when it means “(something) is needed”: mi è servito",
"天氣動詞用 essere 或 avere 都可以：è piovuto／ha piovuto":"Weather verbs take either essere or avere: è piovuto / ha piovuto",
"天氣動詞用 essere 或 avere 都可以":"Weather verbs take either essere or avere",
"「開始做某事」用 avere；「（事情）開始」用 essere":"“Start doing something” takes avere; “(something) starts” takes essere",
"「做完某事」用 avere；「（事情）結束」用 essere":"“Finish doing something” takes avere; “(something) ends” takes essere",
"「度過（時間）」用 avere；「經過」用 essere":"“Spend (time)” takes avere; “pass by” takes essere",
"冠詞":"Articles",
"定冠詞 il, lo, la, l', i, gli, le":"Definite articles il, lo, la, l', i, gli, le",
"<p>義大利文的名詞前面幾乎都要加冠詞。定冠詞（＝英文 the）要看<b>性別</b>、<b>單複數</b>和<b>下一個字的開頭</b>來選。</p><table><tr><th></th><th>單數</th><th>複數</th></tr><tr><td>陽性（一般）</td><td>il libro</td><td>i libri</td></tr><tr><td>陽性（s+子音、z、gn、ps、y）</td><td>lo studente</td><td>gli studenti</td></tr><tr><td>陽性（母音）</td><td>l'amico</td><td>gli amici</td></tr><tr><td>陰性（子音）</td><td>la casa</td><td>le case</td></tr><tr><td>陰性（母音）</td><td>l'amica</td><td>le amiche</td></tr></table><p>重點：冠詞是看<b>緊接在後面的字</b>，所以 lo studente 但是 il bravo studente。</p>":"<p>Italian nouns almost always need an article. Which definite article (= English “the”) you use depends on <b>gender</b>, <b>number</b> and <b>how the next word begins</b>.</p><table><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>Masculine (usual)</td><td>il libro</td><td>i libri</td></tr><tr><td>Masculine (s+consonant, z, gn, ps, y)</td><td>lo studente</td><td>gli studenti</td></tr><tr><td>Masculine (vowel)</td><td>l'amico</td><td>gli amici</td></tr><tr><td>Feminine (consonant)</td><td>la casa</td><td>le case</td></tr><tr><td>Feminine (vowel)</td><td>l'amica</td><td>le amiche</td></tr></table><p>Key point: the article depends on the <b>word right after it</b>, so it’s lo studente but il bravo studente.</p>",
"不定冠詞 un, uno, una, un'":"Indefinite articles un, uno, una, un'",
"<p>不定冠詞＝英文 a／an，表示「一個」。</p><table><tr><th>陽性</th><th>陰性</th></tr><tr><td>un libro、un amico</td><td>una casa</td></tr><tr><td>uno studente、uno zaino</td><td>un'amica（母音前加撇號）</td></tr></table><p>注意：陽性母音前是 <b>un</b>（不加撇號），陰性才是 <b>un'</b>。</p>":"<p>The indefinite article = English “a / an”, meaning “one”.</p><table><tr><th>Masculine</th><th>Feminine</th></tr><tr><td>un libro, un amico</td><td>una casa</td></tr><tr><td>uno studente, uno zaino</td><td>un'amica (apostrophe before a vowel)</td></tr></table><p>Careful: masculine before a vowel is <b>un</b> (no apostrophe); only the feminine is <b>un'</b>.</p>",
"名詞":"Nouns",
"名詞的性別":"Noun gender",
"<p>每個名詞都有性別：陽性（m）或陰性（f）。大部分可以從字尾猜：</p><ul><li><b>-o</b> 通常是陽性：il libro、il ragazzo</li><li><b>-a</b> 通常是陰性：la casa、la ragazza</li><li><b>-e</b> 兩種都有，要一起背：il pane、la notte、il fiore、la chiave</li><li><b>-zione、-tà、-tù</b> 是陰性：la lezione、la città</li></ul><p>常見例外：<b>la mano</b>、<b>la foto</b>、<b>la radio</b>、<b>la moto</b>、<b>l'auto</b>（陰性）；<b>il problema</b>、<b>il cinema</b>、<b>il panorama</b>（陽性）。</p>":"<p>Every noun has a gender: masculine (m) or feminine (f). You can usually guess from the ending:</p><ul><li><b>-o</b> is usually masculine: il libro, il ragazzo</li><li><b>-a</b> is usually feminine: la casa, la ragazza</li><li><b>-e</b> can be either — learn it with the noun: il pane, la notte, il fiore, la chiave</li><li><b>-zione, -tà, -tù</b> are feminine: la lezione, la città</li></ul><p>Common exceptions: <b>la mano</b>, <b>la foto</b>, <b>la radio</b>, <b>la moto</b>, <b>l'auto</b> (feminine); <b>il problema</b>, <b>il cinema</b>, <b>il panorama</b> (masculine).</p>",
"名詞的複數":"Noun plurals",
"<table><tr><th>單數</th><th>複數</th><th>例子</th></tr><tr><td>-o</td><td>-i</td><td>libro → libri</td></tr><tr><td>-a（陰性）</td><td>-e</td><td>casa → case</td></tr><tr><td>-e</td><td>-i</td><td>chiave → chiavi、fiore → fiori</td></tr><tr><td>-ca／-ga</td><td>-che／-ghe</td><td>banca → banche</td></tr><tr><td>-co／-go</td><td>-chi／-ghi 或 -ci／-gi</td><td>parco → parchi、amico → amici</td></tr></table><p><b>不變化</b>：重音結尾（città、caffè）、子音結尾的外來語（bar、film、sport）、縮寫字（foto、moto、cinema）。</p><p><b>不規則</b>：l'uomo → gli uomini；il braccio → le braccia；l'uovo → le uova；il dito → le dita。</p>":"<table><tr><th>Singular</th><th>Plural</th><th>Example</th></tr><tr><td>-o</td><td>-i</td><td>libro → libri</td></tr><tr><td>-a (feminine)</td><td>-e</td><td>casa → case</td></tr><tr><td>-e</td><td>-i</td><td>chiave → chiavi, fiore → fiori</td></tr><tr><td>-ca / -ga</td><td>-che / -ghe</td><td>banca → banche</td></tr><tr><td>-co / -go</td><td>-chi / -ghi or -ci / -gi</td><td>parco → parchi, amico → amici</td></tr></table><p><b>No change</b>: words stressed on the last vowel (città, caffè), loanwords ending in a consonant (bar, film, sport), shortened words (foto, moto, cinema).</p><p><b>Irregular</b>: l'uomo → gli uomini; il braccio → le braccia; l'uovo → le uova; il dito → le dita.</p>",
"形容詞":"Adjectives",
"形容詞的位置與配合":"Adjective position and agreement",
"<p>形容詞要跟名詞的<b>性別和單複數一致</b>，通常放在名詞<b>後面</b>。</p><table><tr><th></th><th>-o 型</th><th>-e 型</th></tr><tr><td>陽性單數</td><td>un ragazzo alto</td><td>un libro interessante</td></tr><tr><td>陰性單數</td><td>una ragazza alta</td><td>una città interessante</td></tr><tr><td>陽性複數</td><td>ragazzi alti</td><td>libri interessanti</td></tr><tr><td>陰性複數</td><td>ragazze alte</td><td>città interessanti</td></tr></table><p>常放在名詞前面的：bello、buono、grande、piccolo、nuovo、vecchio（un bel vestito、una buona idea）。顏色 blu、rosa、viola 不變化。</p>":"<p>Adjectives must <b>agree in gender and number</b> with the noun, and usually go <b>after</b> it.</p><table><tr><th></th><th>-o type</th><th>-e type</th></tr><tr><td>Masculine singular</td><td>un ragazzo alto</td><td>un libro interessante</td></tr><tr><td>Feminine singular</td><td>una ragazza alta</td><td>una città interessante</td></tr><tr><td>Masculine plural</td><td>ragazzi alti</td><td>libri interessanti</td></tr><tr><td>Feminine plural</td><td>ragazze alte</td><td>città interessanti</td></tr></table><p>Often placed before the noun: bello, buono, grande, piccolo, nuovo, vecchio (un bel vestito, una buona idea). The colours blu, rosa, viola never change.</p>",
"動詞":"Verbs",
"動詞 essere（是、在）":"The verb essere (to be)",
"<table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">sono</span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">siamo</span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">sei</span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">siete</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">è</span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">sono</span></td></tr></table><p>用來說身分、國籍、個性、位置：<i>Sono taiwanese.</i>（我是台灣人）<i>Il bagno è lì.</i>（廁所在那裡）</p><p>注意 <b>è</b>（是）有重音，<b>e</b>（和）沒有。</p>":"<table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">sono</span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">siamo</span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">sei</span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">siete</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">è</span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">sono</span></td></tr></table><p>Used for identity, nationality, personality and location: <i>Sono taiwanese.</i> (I’m Taiwanese.) <i>Il bagno è lì.</i> (The bathroom is there.)</p><p>Note: <b>è</b> (is) has an accent; <b>e</b> (and) doesn’t.</p>",
"動詞 avere（有）":"The verb avere (to have)",
"<table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">ho</span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">abbiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">hai</span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">avete</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">ha</span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">hanno</span></td></tr></table><p>h 不發音：ho 唸 [o]。<i>Ho un cane.</i>（我有一隻狗）</p>":"<table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">ho</span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">abbiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">hai</span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">avete</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">ha</span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">hanno</span></td></tr></table><p>The h is silent: ho is pronounced [o]. <i>Ho un cane.</i> (I have a dog.)</p>",
"avere 的慣用說法（ho fame、ho 20 anni）":"Expressions with avere (ho fame, ho 20 anni)",
"<p>中文說「我餓了」，義大利文說「我<b>有</b>飢餓」：</p><ul><li>ho fame 我餓了／ho sete 我渴了</li><li>ho freddo 我冷／ho caldo 我熱</li><li>ho sonno 我想睡／ho paura 我怕</li><li>ho fretta 我趕時間／ho ragione 我是對的</li><li>ho bisogno di… 我需要／ho voglia di… 我想要</li><li>ho venti anni 我二十歲（年齡用 avere！）</li></ul>":"<p>Where English says “I’m hungry”, Italian says “I <b>have</b> hunger”:</p><ul><li>ho fame I’m hungry / ho sete I’m thirsty</li><li>ho freddo I’m cold / ho caldo I’m hot</li><li>ho sonno I’m sleepy / ho paura I’m scared</li><li>ho fretta I’m in a hurry / ho ragione I’m right</li><li>ho bisogno di… I need / ho voglia di… I feel like</li><li>ho venti anni I’m twenty (age uses avere!)</li></ul>",
"句型":"Sentence patterns",
"c'è／ci sono（有……）":"c'è / ci sono (there is / there are)",
"<p>表示「某處有某物」：</p><ul><li><b>c'è</b> ＋ 單數：<i>C'è una farmacia qui vicino?</i></li><li><b>ci sono</b> ＋ 複數：<i>Ci sono molti turisti.</i></li></ul><p>否定：<i>Non c'è problema.</i>（沒問題）</p>":"<p>To say “there is something somewhere”:</p><ul><li><b>c'è</b> + singular: <i>C'è una farmacia qui vicino?</i></li><li><b>ci sono</b> + plural: <i>Ci sono molti turisti.</i></li></ul><p>Negative: <i>Non c'è problema.</i> (No problem.)</p>",
"現在式：-are 規則動詞":"Present tense: regular -are verbs",
"<p>去掉 -are，加上詞尾（以 parlare 為例）：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">parl<b>o</b></span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">parl<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">parl<b>i</b></span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">parl<b>ate</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">parl<b>a</b></span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">p<u>a</u>rl<b>ano</b><small>（重音在前面）</small></span></td></tr></table><p>拼字小規則：-care／-gare 在 i 前面加 h（cerchi、paghiamo）；-iare 不要兩個 i（mangi、studiamo）。</p>":"<p>Drop -are and add the endings (using parlare):</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">parl<b>o</b></span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">parl<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">parl<b>i</b></span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">parl<b>ate</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">parl<b>a</b></span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">p<u>a</u>rl<b>ano</b><small> (stress further back)</small></span></td></tr></table><p>Spelling tip: -care / -gare add h before i (cerchi, paghiamo); -iare doesn’t double the i (mangi, studiamo).</p>",
"現在式：-ere 規則動詞":"Present tense: regular -ere verbs",
"<p>以 prendere 為例：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">prend<b>o</b></span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">prend<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">prend<b>i</b></span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">prend<b>ete</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">prend<b>e</b></span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">prend<b>ono</b></span></td></tr></table><p>發音注意：leggo 的 gg 是硬音 [g]，leggi 的 gg 是軟音 [dʒ]，拼字不變。</p>":"<p>Using prendere:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">prend<b>o</b></span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">prend<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">prend<b>i</b></span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">prend<b>ete</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">prend<b>e</b></span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">prend<b>ono</b></span></td></tr></table><p>Pronunciation: the gg in leggo is hard [g], the gg in leggi is soft [dʒ] — the spelling stays the same.</p>",
"現在式：-ire 規則動詞":"Present tense: regular -ire verbs",
"<p>以 dormire 為例：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">dorm<b>o</b></span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">dorm<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">dorm<b>i</b></span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">dorm<b>ite</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">dorm<b>e</b></span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">dorm<b>ono</b></span></td></tr></table><p>和 -ere 只差 voi 的形（-ite）。</p>":"<p>Using dormire:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">dorm<b>o</b></span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">dorm<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">dorm<b>i</b></span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">dorm<b>ite</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">dorm<b>e</b></span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">dorm<b>ono</b></span></td></tr></table><p>The only difference from -ere is the voi form (-ite).</p>",
"現在式：-ire 加 -isc- 的動詞":"Present tense: -ire verbs with -isc-",
"<p>capire、finire、preferire、pulire、spedire 在 io、tu、lui/lei、loro 加 <b>-isc-</b>：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">cap<b>isco</b></span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">capiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">cap<b>isci</b></span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">capite</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">cap<b>isce</b></span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">cap<b>iscono</b></span></td></tr></table><p>發音：isco [isko]、isci [iʃi]。哪些動詞加 isc 要一個一個記。</p>":"<p>capire, finire, preferire, pulire, spedire add <b>-isc-</b> in the io, tu, lui/lei and loro forms:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">cap<b>isco</b></span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">capiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">cap<b>isci</b></span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">capite</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">cap<b>isce</b></span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">cap<b>iscono</b></span></td></tr></table><p>Pronunciation: isco [isko], isci [iʃi]. Which verbs take -isc- has to be learned one by one.</p>",
"常見不規則動詞（andare、fare、venire…）":"Common irregular verbs (andare, fare, venire…)",
"<table><tr><th></th><th>andare 去</th><th>fare 做</th><th>venire 來</th><th>uscire 出門</th></tr><tr><td>io<span class=\"zg\">我</span></td><td>vado</td><td>faccio</td><td>vengo</td><td>esco</td></tr><tr><td>tu<span class=\"zg\">你</span></td><td>vai</td><td>fai</td><td>vieni</td><td>esci</td></tr><tr><td>lui/lei<span class=\"zg\">他／她</span></td><td>va</td><td>fa</td><td>viene</td><td>esce</td></tr><tr><td>noi<span class=\"zg\">我們</span></td><td>andiamo</td><td>facciamo</td><td>veniamo</td><td>usciamo</td></tr><tr><td>voi<span class=\"zg\">你們</span></td><td>andate</td><td>fate</td><td>venite</td><td>uscite</td></tr><tr><td>loro<span class=\"zg\">他們</span></td><td>vanno</td><td>fanno</td><td>vengono</td><td>escono</td></tr></table><p>其他：bere（bevo）、dire（dico）、stare（sto）、dare（do）、rimanere（rimango）。完整表請看「詞性變化規則」。</p>":"<table><tr><th></th><th>andare go</th><th>fare do</th><th>venire come</th><th>uscire go out</th></tr><tr><td>io<span class=\"zg\">I</span></td><td>vado</td><td>faccio</td><td>vengo</td><td>esco</td></tr><tr><td>tu<span class=\"zg\">you</span></td><td>vai</td><td>fai</td><td>vieni</td><td>esci</td></tr><tr><td>lui/lei<span class=\"zg\">he / she</span></td><td>va</td><td>fa</td><td>viene</td><td>esce</td></tr><tr><td>noi<span class=\"zg\">we</span></td><td>andiamo</td><td>facciamo</td><td>veniamo</td><td>usciamo</td></tr><tr><td>voi<span class=\"zg\">you (pl.)</span></td><td>andate</td><td>fate</td><td>venite</td><td>uscite</td></tr><tr><td>loro<span class=\"zg\">they</span></td><td>vanno</td><td>fanno</td><td>vengono</td><td>escono</td></tr></table><p>Others: bere (bevo), dire (dico), stare (sto), dare (do), rimanere (rimango). See “Word-form rules” for the full tables.</p>",
"情態動詞 potere、volere、dovere＋原形":"Modal verbs potere, volere, dovere + infinitive",
"<table><tr><th></th><th>potere 能</th><th>volere 想要</th><th>dovere 必須</th></tr><tr><td>io<span class=\"zg\">我</span></td><td>posso</td><td>voglio</td><td>devo</td></tr><tr><td>tu<span class=\"zg\">你</span></td><td>puoi</td><td>vuoi</td><td>devi</td></tr><tr><td>lui/lei<span class=\"zg\">他／她</span></td><td>può</td><td>vuole</td><td>deve</td></tr><tr><td>noi<span class=\"zg\">我們</span></td><td>possiamo</td><td>vogliamo</td><td>dobbiamo</td></tr><tr><td>voi<span class=\"zg\">你們</span></td><td>potete</td><td>volete</td><td>dovete</td></tr><tr><td>loro<span class=\"zg\">他們</span></td><td>possono</td><td>vogliono</td><td>devono</td></tr></table><p>後面直接接<b>原形動詞</b>：<i>Posso entrare?</i> <i>Devo studiare.</i></p>":"<table><tr><th></th><th>potere can</th><th>volere want</th><th>dovere must</th></tr><tr><td>io<span class=\"zg\">I</span></td><td>posso</td><td>voglio</td><td>devo</td></tr><tr><td>tu<span class=\"zg\">you</span></td><td>puoi</td><td>vuoi</td><td>devi</td></tr><tr><td>lui/lei<span class=\"zg\">he / she</span></td><td>può</td><td>vuole</td><td>deve</td></tr><tr><td>noi<span class=\"zg\">we</span></td><td>possiamo</td><td>vogliamo</td><td>dobbiamo</td></tr><tr><td>voi<span class=\"zg\">you (pl.)</span></td><td>potete</td><td>volete</td><td>dovete</td></tr><tr><td>loro<span class=\"zg\">they</span></td><td>possono</td><td>vogliono</td><td>devono</td></tr></table><p>Followed directly by an <b>infinitive</b>: <i>Posso entrare?</i> <i>Devo studiare.</i></p>",
"sapere 和 conoscere 的差別":"sapere vs. conoscere",
"<ul><li><b>sapere</b>：知道（一件事）、會（技能＋原形）：<i>Sai nuotare?</i> <i>Non so.</i></li><li><b>conoscere</b>：認識（人、地方）：<i>Conosci Marco?</i> <i>Conosco un buon ristorante.</i></li></ul><p>sapere 現在式：so, sai, sa, sappiamo, sapete, sanno。</p>":"<ul><li><b>sapere</b>: to know (a fact), to know how to (a skill + infinitive): <i>Sai nuotare?</i> <i>Non so.</i></li><li><b>conoscere</b>: to know (a person or place): <i>Conosci Marco?</i> <i>Conosco un buon ristorante.</i></li></ul><p>sapere in the present: so, sai, sa, sappiamo, sapete, sanno.</p>",
"mi piace／mi piacciono（我喜歡）":"mi piace / mi piacciono (I like)",
"<p>義大利文說「某物<b>讓我喜歡</b>」：喜歡的東西是主詞。</p><ul><li>單數或動詞原形 → <b>piace</b>：<i>Mi piace la pizza.</i> <i>Mi piace viaggiare.</i></li><li>複數 → <b>piacciono</b>：<i>Mi piacciono le patate.</i></li></ul><table><tr><td>mi 我</td><td>ti 你</td><td>gli 他</td><td>le 她／您</td><td>ci 我們</td><td>vi 你們</td></tr></table><p>否定：<i>Non mi piace la cipolla.</i></p>":"<p>Italian says “something <b>pleases me</b>”: the thing you like is the subject.</p><ul><li>Singular or an infinitive → <b>piace</b>: <i>Mi piace la pizza.</i> <i>Mi piace viaggiare.</i></li><li>Plural → <b>piacciono</b>: <i>Mi piacciono le patate.</i></li></ul><table><tr><td>mi me</td><td>ti you</td><td>gli him</td><td>le her / you (formal)</td><td>ci us</td><td>vi you (pl.)</td></tr></table><p>Negative: <i>Non mi piace la cipolla.</i></p>",
"反身動詞（mi chiamo、mi alzo）":"Reflexive verbs (mi chiamo, mi alzo)",
"<p>原形以 <b>-si</b> 結尾的動詞（chiamarsi、alzarsi、lavarsi），動詞前要加反身代名詞：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\"><b>mi</b> alzo</span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\"><b>ci</b> alziamo</span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\"><b>ti</b> alzi</span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\"><b>vi</b> alzate</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\"><b>si</b> alza</span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\"><b>si</b> alzano</span></td></tr></table><p>過去式一律用 essere：<i>Mi sono alzato alle sette.</i> 命令式黏在後面：<i>Alzati!</i> <i>Lavati le mani!</i></p>":"<p>Verbs whose infinitive ends in <b>-si</b> (chiamarsi, alzarsi, lavarsi) need a reflexive pronoun before the verb:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\"><b>mi</b> alzo</span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\"><b>ci</b> alziamo</span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\"><b>ti</b> alzi</span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\"><b>vi</b> alzate</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\"><b>si</b> alza</span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\"><b>si</b> alzano</span></td></tr></table><p>The past always uses essere: <i>Mi sono alzato alle sette.</i> In the imperative the pronoun attaches to the end: <i>Alzati!</i> <i>Lavati le mani!</i></p>",
"否定句 non、non…mai、non…niente":"Negation non, non…mai, non…niente",
"<p><b>non</b> 放在動詞前面：<i>Non parlo tedesco.</i></p><p>雙重否定在義大利文是正常的：</p><ul><li>non … mai 從不：<i>Non bevo mai il caffè.</i></li><li>non … niente 什麼都不：<i>Non mangio niente.</i></li><li>non … ancora 還沒：<i>Non ho ancora mangiato.</i></li></ul>":"<p><b>non</b> goes before the verb: <i>Non parlo tedesco.</i></p><p>Double negatives are normal in Italian:</p><ul><li>non … mai never: <i>Non bevo mai il caffè.</i></li><li>non … niente nothing: <i>Non mangio niente.</i></li><li>non … ancora not yet: <i>Non ho ancora mangiato.</i></li></ul>",
"疑問詞 chi、cosa、dove、come、quando、quanto、quale、perché":"Question words chi, cosa, dove, come, quando, quanto, quale, perché",
"<table><tr><td>chi 誰</td><td>cosa／che cosa 什麼</td></tr><tr><td>dove 哪裡（dov'è）</td><td>come 怎麼</td></tr><tr><td>quando 什麼時候</td><td>quanto 多少（要配合：quanti anni）</td></tr><tr><td>quale 哪一個（qual è）</td><td>perché 為什麼</td></tr></table><p>是非疑問句不用改語序，只要語調上揚：<i>Parli inglese?</i></p>":"<table><tr><td>chi who</td><td>cosa / che cosa what</td></tr><tr><td>dove where (dov'è)</td><td>come how</td></tr><tr><td>quando when</td><td>quanto how much (agrees: quanti anni)</td></tr><tr><td>quale which (qual è)</td><td>perché why</td></tr></table><p>Yes/no questions keep the normal word order — just raise your voice at the end: <i>Parli inglese?</i></p>",
"介係詞":"Prepositions",
"簡單介係詞 di、a、da、in、con、su、per、tra":"Simple prepositions di, a, da, in, con, su, per, tra",
"<table><tr><td><b>di</b></td><td>…的；來自（城市）</td><td>il libro di Marco、sono di Roma</td></tr><tr><td><b>a</b></td><td>到／在（城市）、幾點</td><td>vado a Milano、alle otto</td></tr><tr><td><b>da</b></td><td>從；到某人家；自從</td><td>vengo da Napoli、vado dal medico</td></tr><tr><td><b>in</b></td><td>在／到（國家、區域）、交通工具</td><td>in Italia、in centro、in treno</td></tr><tr><td><b>con</b></td><td>和…一起</td><td>con gli amici</td></tr><tr><td><b>su</b></td><td>在…上；關於</td><td>sul tavolo</td></tr><tr><td><b>per</b></td><td>為了；給</td><td>per te</td></tr><tr><td><b>tra／fra</b></td><td>之間；…之後</td><td>tra due giorni</td></tr></table>":"<table><tr><td><b>di</b></td><td>of; from (a city)</td><td>il libro di Marco, sono di Roma</td></tr><tr><td><b>a</b></td><td>to / in (a city), at (a time)</td><td>vado a Milano, alle otto</td></tr><tr><td><b>da</b></td><td>from; to someone’s place; since</td><td>vengo da Napoli, vado dal medico</td></tr><tr><td><b>in</b></td><td>in / to (a country, region), by (transport)</td><td>in Italia, in centro, in treno</td></tr><tr><td><b>con</b></td><td>with</td><td>con gli amici</td></tr><tr><td><b>su</b></td><td>on; about</td><td>sul tavolo</td></tr><tr><td><b>per</b></td><td>for</td><td>per te</td></tr><tr><td><b>tra / fra</b></td><td>between; in (… time)</td><td>tra due giorni</td></tr></table>",
"介係詞＋冠詞合併（del、al、nella…）":"Preposition + article contractions (del, al, nella…)",
"<p>di、a、da、in、su 後面接定冠詞時要合成一個字：</p><table class=\"wide\"><tr><th></th><th>il</th><th>lo</th><th>l'</th><th>la</th><th>i</th><th>gli</th><th>le</th></tr><tr><td>di</td><td>del</td><td>dello</td><td>dell'</td><td>della</td><td>dei</td><td>degli</td><td>delle</td></tr><tr><td>a</td><td>al</td><td>allo</td><td>all'</td><td>alla</td><td>ai</td><td>agli</td><td>alle</td></tr><tr><td>da</td><td>dal</td><td>dallo</td><td>dall'</td><td>dalla</td><td>dai</td><td>dagli</td><td>dalle</td></tr><tr><td>in</td><td>nel</td><td>nello</td><td>nell'</td><td>nella</td><td>nei</td><td>negli</td><td>nelle</td></tr><tr><td>su</td><td>sul</td><td>sullo</td><td>sull'</td><td>sulla</td><td>sui</td><td>sugli</td><td>sulle</td></tr></table><p>con、per 不合併：con il、per la。</p>":"<p>di, a, da, in, su merge with a following definite article into one word:</p><table class=\"wide\"><tr><th></th><th>il</th><th>lo</th><th>l'</th><th>la</th><th>i</th><th>gli</th><th>le</th></tr><tr><td>di</td><td>del</td><td>dello</td><td>dell'</td><td>della</td><td>dei</td><td>degli</td><td>delle</td></tr><tr><td>a</td><td>al</td><td>allo</td><td>all'</td><td>alla</td><td>ai</td><td>agli</td><td>alle</td></tr><tr><td>da</td><td>dal</td><td>dallo</td><td>dall'</td><td>dalla</td><td>dai</td><td>dagli</td><td>dalle</td></tr><tr><td>in</td><td>nel</td><td>nello</td><td>nell'</td><td>nella</td><td>nei</td><td>negli</td><td>nelle</td></tr><tr><td>su</td><td>sul</td><td>sullo</td><td>sull'</td><td>sulla</td><td>sui</td><td>sugli</td><td>sulle</td></tr></table><p>con and per don’t merge: con il, per la.</p>",
"地點：a 和 in 的用法":"Places: a vs. in",
"<ul><li><b>a</b> ＋ 城市：a Roma、a Taipei；也用在 a casa、a scuola、a letto</li><li><b>in</b> ＋ 國家、大區、島：in Italia、in Toscana、in Sardegna</li><li><b>in</b> ＋ 很多場所：in centro、in banca、in ufficio、in montagna、in biblioteca、in vacanza</li><li>有冠詞時用合併形：al mare、al cinema、alla stazione、nel parco</li></ul>":"<ul><li><b>a</b> + city: a Roma, a Taipei; also a casa, a scuola, a letto</li><li><b>in</b> + country, region, island: in Italia, in Toscana, in Sardegna</li><li><b>in</b> + many places: in centro, in banca, in ufficio, in montagna, in biblioteca, in vacanza</li><li>With an article, use the merged form: al mare, al cinema, alla stazione, nel parco</li></ul>",
"交通方式：in treno、a piedi":"Transport: in treno, a piedi",
"<p>搭交通工具用 <b>in</b>（不加冠詞）：in treno、in macchina、in aereo、in bicicletta、in autobus、in metro。</p><p>走路是 <b>a piedi</b>。</p><p>「搭」也可以用 prendere：<i>Prendo l'autobus.</i></p>":"<p>For means of transport use <b>in</b> (no article): in treno, in macchina, in aereo, in bicicletta, in autobus, in metro.</p><p>On foot is <b>a piedi</b>.</p><p>You can also use prendere for “take”: <i>Prendo l'autobus.</i></p>",
"限定詞":"Determiners",
"所有格 mio、tuo、suo…":"Possessives mio, tuo, suo…",
"<table><tr><th></th><th>陽單</th><th>陰單</th><th>陽複</th><th>陰複</th></tr><tr><td>我的</td><td>il mio</td><td>la mia</td><td>i miei</td><td>le mie</td></tr><tr><td>你的</td><td>il tuo</td><td>la tua</td><td>i tuoi</td><td>le tue</td></tr><tr><td>他／她／您的</td><td>il suo</td><td>la sua</td><td>i suoi</td><td>le sue</td></tr><tr><td>我們的</td><td>il nostro</td><td>la nostra</td><td>i nostri</td><td>le nostre</td></tr><tr><td>你們的</td><td>il vostro</td><td>la vostra</td><td>i vostri</td><td>le vostre</td></tr><tr><td>他們的</td><td>il loro</td><td>la loro</td><td>i loro</td><td>le loro</td></tr></table><p>所有格要配合<b>被擁有的東西</b>，不是擁有者：<i>Marco ama sua moglie.</i></p><p>單數家人<b>不加冠詞</b>：mio padre、mia sorella（但 la mia famiglia、i miei fratelli、il mio ragazzo 要加）。</p>":"<table><tr><th></th><th>m. sg.</th><th>f. sg.</th><th>m. pl.</th><th>f. pl.</th></tr><tr><td>my</td><td>il mio</td><td>la mia</td><td>i miei</td><td>le mie</td></tr><tr><td>your</td><td>il tuo</td><td>la tua</td><td>i tuoi</td><td>le tue</td></tr><tr><td>his / her / your (formal)</td><td>il suo</td><td>la sua</td><td>i suoi</td><td>le sue</td></tr><tr><td>our</td><td>il nostro</td><td>la nostra</td><td>i nostri</td><td>le nostre</td></tr><tr><td>your (pl.)</td><td>il vostro</td><td>la vostra</td><td>i vostri</td><td>le vostre</td></tr><tr><td>their</td><td>il loro</td><td>la loro</td><td>i loro</td><td>le loro</td></tr></table><p>The possessive agrees with <b>the thing owned</b>, not the owner: <i>Marco ama sua moglie.</i></p><p>Single family members take <b>no article</b>: mio padre, mia sorella (but la mia famiglia, i miei fratelli, il mio ragazzo do).</p>",
"指示詞 questo、quello":"Demonstratives questo, quello",
"<p><b>questo</b>（這個）像一般 -o 形容詞：questo, questa, questi, queste（母音前可寫 quest'）。</p><p><b>quello</b>（那個）在名詞前像定冠詞一樣變化：</p><table><tr><td>il → quel libro</td><td>i → quei libri</td></tr><tr><td>lo → quello studente</td><td>gli → quegli studenti</td></tr><tr><td>l' → quell'uomo</td><td>la → quella ragazza、le → quelle ragazze</td></tr></table>":"<p><b>questo</b> (this) works like a normal -o adjective: questo, questa, questi, queste (quest' before a vowel).</p><p><b>quello</b> (that) changes like the definite article when it comes before a noun:</p><table><tr><td>il → quel libro</td><td>i → quei libri</td></tr><tr><td>lo → quello studente</td><td>gli → quegli studenti</td></tr><tr><td>l' → quell'uomo</td><td>la → quella ragazza, le → quelle ragazze</td></tr></table>",
"數字時間":"Numbers & time",
"數字 0–1000":"Numbers 0–1000",
"<p>1–10：uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci</p><p>11–20：undici, dodici, tredici, quattordici, quindici, sedici, diciassette, diciotto, diciannove, venti</p><p>十位：trenta, quaranta, cinquanta, sessanta, settanta, ottanta, novanta, cento, mille（兩千 duemila）</p><p>21、28 去掉母音：ventuno、ventotto；23 寫 ventitré（有重音）。</p>":"<p>1–10: uno, due, tre, quattro, cinque, sei, sette, otto, nove, dieci</p><p>11–20: undici, dodici, tredici, quattordici, quindici, sedici, diciassette, diciotto, diciannove, venti</p><p>Tens: trenta, quaranta, cinquanta, sessanta, settanta, ottanta, novanta, cento, mille (two thousand: duemila)</p><p>21 and 28 drop a vowel: ventuno, ventotto; 23 is written ventitré (with an accent).</p>",
"幾點了？Che ore sono?":"What time is it? Che ore sono?",
"<ul><li><i>Che ore sono?</i> 現在幾點？</li><li><i>Sono le tre.</i>（複數 le，因為是 le ore）</li><li><i>È l'una.</i> 一點；<i>È mezzogiorno.</i> 中午</li><li>3:30 <i>le tre e mezza</i>；2:15 <i>le due e un quarto</i></li><li>在幾點：<b>alle</b> otto、<b>all'</b>una、<b>a</b> mezzogiorno</li></ul>":"<ul><li><i>Che ore sono?</i> What time is it?</li><li><i>Sono le tre.</i> (plural le, because it’s le ore)</li><li><i>È l'una.</i> one o’clock; <i>È mezzogiorno.</i> noon</li><li>3:30 <i>le tre e mezza</i>; 2:15 <i>le due e un quarto</i></li><li>At a time: <b>alle</b> otto, <b>all'</b>una, <b>a</b> mezzogiorno</li></ul>",
"星期、月份、季節":"Days, months, seasons",
"<p>星期、月份都<b>小寫</b>。星期除了 la domenica 都是陽性。</p><ul><li>加冠詞表示「每個」：<i>il sabato</i> 每個星期六；不加是「這個」：<i>sabato</i> 這個星期六</li><li>月份用 <b>a</b>：a maggio、ad agosto</li><li>季節用 <b>in</b>：in estate、in inverno（也說 d'estate）</li></ul>":"<p>Days and months are <b>lowercase</b>. All days are masculine except la domenica.</p><ul><li>With an article it means “every”: <i>il sabato</i> every Saturday; without, it means “this”: <i>sabato</i> this Saturday</li><li>Months use <b>a</b>: a maggio, ad agosto</li><li>Seasons use <b>in</b>: in estate, in inverno (also d'estate)</li></ul>",
"天氣怎麼說":"Talking about the weather",
"<ul><li><i>Che tempo fa?</i> 天氣怎麼樣？</li><li>用 <b>fare</b>：fa caldo、fa freddo、fa bel tempo、fa brutto tempo</li><li>動詞本身：piove（下雨）、nevica（下雪）</li><li>用 c'è：c'è il sole、c'è vento、c'è la nebbia</li></ul><p>人覺得冷熱用 avere：<i>Ho freddo.</i></p>":"<ul><li><i>Che tempo fa?</i> What’s the weather like?</li><li>With <b>fare</b>: fa caldo, fa freddo, fa bel tempo, fa brutto tempo</li><li>Verbs on their own: piove (it’s raining), nevica (it’s snowing)</li><li>With c'è: c'è il sole, c'è vento, c'è la nebbia</li></ul><p>For a person feeling hot or cold use avere: <i>Ho freddo.</i></p>",
"過去式":"Past tense",
"passato prossimo（一）：avere＋過去分詞":"passato prossimo (1): avere + past participle",
"<p>表示「做過、已經做了」：<b>avere 現在式＋過去分詞</b>。</p><p>過去分詞：-are → <b>-ato</b>、-ere → <b>-uto</b>、-ire → <b>-ito</b>（mangiato、avuto、dormito）。</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">ho mangiato</span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">abbiamo mangiato</span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">hai mangiato</span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">avete mangiato</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">ha mangiato</span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">hanno mangiato</span></td></tr></table><p>常見不規則分詞：fatto、detto、letto、scritto、preso、visto、messo、aperto、chiuso、bevuto、perso。</p>":"<p>To say “did / have done”: <b>present of avere + past participle</b>.</p><p>Past participles: -are → <b>-ato</b>, -ere → <b>-uto</b>, -ire → <b>-ito</b> (mangiato, avuto, dormito).</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">ho mangiato</span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">abbiamo mangiato</span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">hai mangiato</span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">avete mangiato</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">ha mangiato</span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">hanno mangiato</span></td></tr></table><p>Common irregular participles: fatto, detto, letto, scritto, preso, visto, messo, aperto, chiuso, bevuto, perso.</p>",
"passato prossimo（二）：essere＋過去分詞":"passato prossimo (2): essere + past participle",
"<p>移動、狀態改變的動詞（andare、venire、arrivare、partire、uscire、tornare、nascere、restare、stare…）和所有反身動詞用 <b>essere</b>。</p><p>這時分詞要跟主詞<b>配合性別和單複數</b>：</p><ul><li>Marco è andat<b>o</b>／Anna è andat<b>a</b></li><li>Siamo partit<b>i</b>／Le ragazze sono uscit<b>e</b></li></ul><p>App 裡每個動詞的變化表都有標出用 essere 還是 avere。</p>":"<p>Verbs of movement or change of state (andare, venire, arrivare, partire, uscire, tornare, nascere, restare, stare…) and all reflexive verbs use <b>essere</b>.</p><p>Then the participle <b>agrees in gender and number</b> with the subject:</p><ul><li>Marco è andat<b>o</b> / Anna è andat<b>a</b></li><li>Siamo partit<b>i</b> / Le ragazze sono uscit<b>e</b></li></ul><p>Every verb’s forms table in the app shows whether it uses essere or avere.</p>",
"命令式（Apri la finestra!）":"Imperative (Apri la finestra!)",
"<table><tr><th></th><th>-are（parlare）</th><th>-ere（prendere）</th><th>-ire（aprire）</th></tr><tr><td>tu<span class=\"zg\">你</span></td><td>parla</td><td>prendi</td><td>apri</td></tr><tr><td>Lei（您）</td><td>parli</td><td>prenda</td><td>apra</td></tr><tr><td>noi<span class=\"zg\">我們</span></td><td>parliamo</td><td>prendiamo</td><td>apriamo</td></tr><tr><td>voi<span class=\"zg\">你們</span></td><td>parlate</td><td>prendete</td><td>aprite</td></tr></table><p>注意 -are 和 -ere/-ire 的 tu、Lei 剛好相反。對 tu 的否定用 non＋原形：<i>Non cadere!</i></p><p>不規則：va'（andare）、fa'（fare）、vieni、sii、abbi、di'（dire）。</p>":"<table><tr><th></th><th>-are (parlare)</th><th>-ere (prendere)</th><th>-ire (aprire)</th></tr><tr><td>tu<span class=\"zg\">you</span></td><td>parla</td><td>prendi</td><td>apri</td></tr><tr><td>Lei (formal you)</td><td>parli</td><td>prenda</td><td>apra</td></tr><tr><td>noi<span class=\"zg\">we</span></td><td>parliamo</td><td>prendiamo</td><td>apriamo</td></tr><tr><td>voi<span class=\"zg\">you (pl.)</span></td><td>parlate</td><td>prendete</td><td>aprite</td></tr></table><p>Note that the tu and Lei forms of -are are the reverse of -ere/-ire. The negative for tu is non + infinitive: <i>Non cadere!</i></p><p>Irregular: va' (andare), fa' (fare), vieni, sii, abbi, di' (dire).</p>",
"敬稱 Lei（您）":"Formal Lei (you)",
"<p>對陌生人、店員、長輩用 <b>Lei</b>（您），動詞用<b>第三人稱單數</b>：</p><ul><li><i>Come sta?</i>（您好嗎）↔ <i>Come stai?</i>（你好嗎）</li><li><i>Scusi</i>（對您）↔ <i>Scusa</i>（對你）</li><li><i>Può ripetere?</i> 您可以再說一次嗎？</li></ul><p>寫的時候 Lei 常大寫，跟 lei（她）區分。</p>":"<p>With strangers, shop staff and older people use <b>Lei</b> (formal “you”), with the verb in the <b>third person singular</b>:</p><ul><li><i>Come sta?</i> (How are you? – formal) ↔ <i>Come stai?</i> (How are you? – informal)</li><li><i>Scusi</i> (to Lei) ↔ <i>Scusa</i> (to tu)</li><li><i>Può ripetere?</i> Could you say that again?</li></ul><p>In writing Lei is often capitalised to tell it apart from lei (she).</p>",
"比較 più／meno … di":"Comparisons più / meno … di",
"<ul><li>A è <b>più</b> + 形容詞 + <b>di</b> B：<i>Lui è più alto di me.</i>（他比我高）</li><li>A è <b>meno</b> + 形容詞 + <b>di</b> B：<i>Il treno è meno caro dell'aereo.</i></li><li>di 後面接冠詞要合併：dell'aereo、della pizza</li></ul><p>特別形：buono → <b>migliore</b>（更好的）。</p>":"<ul><li>A è <b>più</b> + adjective + <b>di</b> B: <i>Lui è più alto di me.</i> (He’s taller than me.)</li><li>A è <b>meno</b> + adjective + <b>di</b> B: <i>Il treno è meno caro dell'aereo.</i></li><li>di merges with a following article: dell'aereo, della pizza</li></ul><p>Special form: buono → <b>migliore</b> (better).</p>",
"<ul><li>當<b>副詞</b>（修飾形容詞、動詞）不變化：<i>È molto buona.</i> <i>Lavoro troppo.</i></li><li>當<b>形容詞</b>（修飾名詞）要配合：<i>molta gente</i>、<i>molti turisti</i>、<i>molte nuvole</i></li><li><i>un po' (di)</i> 一點點：<i>Parlo un po' di italiano.</i></li></ul>":"<ul><li>As an <b>adverb</b> (modifying an adjective or verb) it doesn’t change: <i>È molto buona.</i> <i>Lavoro troppo.</i></li><li>As an <b>adjective</b> (modifying a noun) it agrees: <i>molta gente</i>, <i>molti turisti</i>, <i>molte nuvole</i></li><li><i>un po' (di)</i> a little: <i>Parlo un po' di italiano.</i></li></ul>",
"禮貌請求 vorrei、potrei":"Polite requests vorrei, potrei",
"<p>點餐、購物時用 <b>vorrei</b>（我想要，比 voglio 客氣）：</p><ul><li><i>Vorrei un caffè, per favore.</i></li><li><i>Vorrei prenotare un tavolo.</i></li><li><i>Potrebbe ripetere?</i> 您可以再說一次嗎？</li></ul><p>vorrei 是 volere 的條件式，A1 先當成固定說法記住。</p>":"<p>When ordering or shopping use <b>vorrei</b> (I’d like — more polite than voglio):</p><ul><li><i>Vorrei un caffè, per favore.</i></li><li><i>Vorrei prenotare un tavolo.</i></li><li><i>Potrebbe ripetere?</i> Could you say that again?</li></ul><p>vorrei is the conditional of volere; at A1 just learn it as a set phrase.</p>",
"<p>問候身體狀況用 <b>stare</b>：</p><ul><li><i>Come stai?</i>（你好嗎）<i>Come sta?</i>（您好嗎）</li><li><i>Sto bene, grazie.</i> <i>Sto male.</i> <i>Così così.</i></li></ul><p>stare 現在式：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">sto</span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">stiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">stai</span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">state</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">sta</span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">stanno</span></td></tr></table>":"<p>To ask how someone is, use <b>stare</b>:</p><ul><li><i>Come stai?</i> (How are you?) <i>Come sta?</i> (How are you? – formal)</li><li><i>Sto bene, grazie.</i> <i>Sto male.</i> <i>Così così.</i></li></ul><p>stare in the present:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">sto</span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">stiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">stai</span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">state</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">sta</span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">stanno</span></td></tr></table>",
"<ul><li>andare <b>a</b> ＋ 城市／原形動詞：<i>Vado a Roma.</i> <i>Vado a mangiare.</i></li><li>andare <b>in</b> ＋ 國家、場所：<i>Vado in Italia.</i> <i>Vado in banca.</i></li><li>andare <b>da</b> ＋ 人：<i>Vado dal medico.</i>（去看醫生）</li><li>venire <b>da</b> ＋ 來自的地方：<i>Vengo da Taipei.</i></li></ul>":"<ul><li>andare <b>a</b> + city / infinitive: <i>Vado a Roma.</i> <i>Vado a mangiare.</i></li><li>andare <b>in</b> + country, place: <i>Vado in Italia.</i> <i>Vado in banca.</i></li><li>andare <b>da</b> + person: <i>Vado dal medico.</i> (go to the doctor)</li><li>venire <b>da</b> + where you’re from: <i>Vengo da Taipei.</i></li></ul>",
"連接詞 e、ma、o、perché、quando、se":"Conjunctions e, ma, o, perché, quando, se",
"<table><tr><td>e 和</td><td>ma 但是</td><td>o 或</td></tr><tr><td>perché 因為</td><td>quando 當…的時候</td><td>se 如果</td></tr><tr><td>quindi 所以</td><td>allora 那麼</td><td>anche 也</td></tr></table><p>perché 同時是「為什麼」和「因為」，quando 也是「什麼時候」。</p>":"<table><tr><td>e and</td><td>ma but</td><td>o or</td></tr><tr><td>perché because</td><td>quando when</td><td>se if</td></tr><tr><td>quindi so</td><td>allora then</td><td>anche also</td></tr></table><p>perché means both “why” and “because”, and quando is also “when?”.</p>",
"頻率：sempre、spesso、qualche volta、mai":"Frequency: sempre, spesso, qualche volta, mai",
"<p>從多到少：<b>sempre</b>（總是）→ <b>spesso</b>（常常）→ <b>qualche volta</b>（有時）→ <b>non … mai</b>（從不）</p><p>每天：<i>ogni giorno</i>／<i>tutti i giorni</i>；一週兩次：<i>due volte alla settimana</i></p>":"<p>From most to least: <b>sempre</b> (always) → <b>spesso</b> (often) → <b>qualche volta</b> (sometimes) → <b>non … mai</b> (never)</p><p>Every day: <i>ogni giorno</i> / <i>tutti i giorni</i>; twice a week: <i>due volte alla settimana</i></p>",
"「一般人」的 si：Come si dice?":"Impersonal si: Come si dice?",
"<p><b>si</b> ＋ 第三人稱動詞，表示「一般人、大家」：</p><ul><li><i>Come si dice “grazie” in italiano?</i> 「謝謝」用義大利文怎麼說？</li><li><i>Qui non si può fumare.</i> 這裡不能抽菸。</li><li><i>In Italia si mangia bene.</i> 在義大利吃得很好。</li></ul>":"<p><b>si</b> + third-person verb means “people, one, you (in general)”:</p><ul><li><i>Come si dice “grazie” in italiano?</i> How do you say “thank you” in Italian?</li><li><i>Qui non si può fumare.</i> You can’t smoke here.</li><li><i>In Italia si mangia bene.</i> You eat well in Italy.</li></ul>",
"代名詞":"Pronouns",
"受詞代名詞 mi、ti、ci、vi（Ti chiamo.）":"Object pronouns mi, ti, ci, vi (Ti chiamo.)",
"<p>代名詞放在<b>動詞前面</b>：</p><ul><li><i>Ti chiamo stasera.</i> 我今晚打給你。</li><li><i>Mi aiuti?</i> 你可以幫我嗎？</li><li><i>Ci vediamo domani.</i> 我們明天見。</li></ul><p>「他／她／它」：lo（陽）、la（陰）：<i>Lo compro.</i> 我買它。</p>":"<p>The pronoun goes <b>before the verb</b>:</p><ul><li><i>Ti chiamo stasera.</i> I’ll call you tonight.</li><li><i>Mi aiuti?</i> Can you help me?</li><li><i>Ci vediamo domani.</i> See you tomorrow.</li></ul><p>“him / her / it”: lo (m.), la (f.): <i>Lo compro.</i> I’ll buy it.</p>",

"<h3 class=\"gb-h\">名詞的性別</h3><p>每個名詞都有性別：陽性（m）或陰性（f）。大部分可以從字尾猜：</p><ul><li><b>-o</b> 通常是陽性：il libro、il ragazzo</li><li><b>-a</b> 通常是陰性：la casa、la ragazza</li><li><b>-e</b> 兩種都有，要一起背：il pane、la notte、il fiore、la chiave</li><li><b>-zione、-tà、-tù</b> 是陰性：la lezione、la città</li></ul><p>常見例外：<b>la mano</b>、<b>la foto</b>、<b>la radio</b>、<b>la moto</b>、<b>l'auto</b>（陰性）；<b>il problema</b>、<b>il cinema</b>、<b>il panorama</b>（陽性）。</p><h3 class=\"gb-h\">名詞的複數</h3><table><tr><th>單數</th><th>複數</th><th>例子</th></tr><tr><td>-o</td><td>-i</td><td>libro → libri</td></tr><tr><td>-a（陰性）</td><td>-e</td><td>casa → case</td></tr><tr><td>-e</td><td>-i</td><td>chiave → chiavi、fiore → fiori</td></tr><tr><td>-ca／-ga</td><td>-che／-ghe</td><td>banca → banche</td></tr><tr><td>-co／-go</td><td>-chi／-ghi 或 -ci／-gi</td><td>parco → parchi、amico → amici</td></tr></table><p><b>不變化</b>：重音結尾（città、caffè）、子音結尾的外來語（bar、film、sport）、縮寫字（foto、moto、cinema）。</p><p><b>不規則</b>：l'uomo → gli uomini；il braccio → le braccia；l'uovo → le uova；il dito → le dita。</p>":"<h3 class=\"gb-h\">Noun gender</h3><p>Every noun has a gender: masculine (m) or feminine (f). You can usually guess from the ending:</p><ul><li><b>-o</b> is usually masculine: il libro, il ragazzo</li><li><b>-a</b> is usually feminine: la casa, la ragazza</li><li><b>-e</b> can be either — learn it with the noun: il pane, la notte, il fiore, la chiave</li><li><b>-zione, -tà, -tù</b> are feminine: la lezione, la città</li></ul><p>Common exceptions: <b>la mano</b>, <b>la foto</b>, <b>la radio</b>, <b>la moto</b>, <b>l'auto</b> (feminine); <b>il problema</b>, <b>il cinema</b>, <b>il panorama</b> (masculine).</p><h3 class=\"gb-h\">Noun plurals</h3><table><tr><th>Singular</th><th>Plural</th><th>Example</th></tr><tr><td>-o</td><td>-i</td><td>libro → libri</td></tr><tr><td>-a (feminine)</td><td>-e</td><td>casa → case</td></tr><tr><td>-e</td><td>-i</td><td>chiave → chiavi, fiore → fiori</td></tr><tr><td>-ca / -ga</td><td>-che / -ghe</td><td>banca → banche</td></tr><tr><td>-co / -go</td><td>-chi / -ghi or -ci / -gi</td><td>parco → parchi, amico → amici</td></tr></table><p><b>No change</b>: words stressed on the last vowel (città, caffè), loanwords ending in a consonant (bar, film, sport), shortened words (foto, moto, cinema).</p><p><b>Irregular</b>: l'uomo → gli uomini; il braccio → le braccia; l'uovo → le uova; il dito → le dita.</p>",
"<h3 class=\"gb-h\">定冠詞 il, lo, la, l', i, gli, le</h3><p>義大利文的名詞前面幾乎都要加冠詞。定冠詞（＝英文 the）要看<b>性別</b>、<b>單複數</b>和<b>下一個字的開頭</b>來選。</p><table><tr><th></th><th>單數</th><th>複數</th></tr><tr><td>陽性（一般）</td><td>il libro</td><td>i libri</td></tr><tr><td>陽性（s+子音、z、gn、ps、y）</td><td>lo studente</td><td>gli studenti</td></tr><tr><td>陽性（母音）</td><td>l'amico</td><td>gli amici</td></tr><tr><td>陰性（子音）</td><td>la casa</td><td>le case</td></tr><tr><td>陰性（母音）</td><td>l'amica</td><td>le amiche</td></tr></table><p>重點：冠詞是看<b>緊接在後面的字</b>，所以 lo studente 但是 il bravo studente。</p><h3 class=\"gb-h\">不定冠詞 un, uno, una, un'</h3><p>不定冠詞＝英文 a／an，表示「一個」。</p><table><tr><th>陽性</th><th>陰性</th></tr><tr><td>un libro、un amico</td><td>una casa</td></tr><tr><td>uno studente、uno zaino</td><td>un'amica（母音前加撇號）</td></tr></table><p>注意：陽性母音前是 <b>un</b>（不加撇號），陰性才是 <b>un'</b>。</p>":"<h3 class=\"gb-h\">Definite articles il, lo, la, l', i, gli, le</h3><p>Italian nouns almost always need an article. Which definite article (= English “the”) you use depends on <b>gender</b>, <b>number</b> and <b>how the next word begins</b>.</p><table><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>Masculine (usual)</td><td>il libro</td><td>i libri</td></tr><tr><td>Masculine (s+consonant, z, gn, ps, y)</td><td>lo studente</td><td>gli studenti</td></tr><tr><td>Masculine (vowel)</td><td>l'amico</td><td>gli amici</td></tr><tr><td>Feminine (consonant)</td><td>la casa</td><td>le case</td></tr><tr><td>Feminine (vowel)</td><td>l'amica</td><td>le amiche</td></tr></table><p>Key point: the article depends on the <b>word right after it</b>, so it’s lo studente but il bravo studente.</p><h3 class=\"gb-h\">Indefinite articles un, uno, una, un'</h3><p>The indefinite article = English “a / an”, meaning “one”.</p><table><tr><th>Masculine</th><th>Feminine</th></tr><tr><td>un libro, un amico</td><td>una casa</td></tr><tr><td>uno studente, uno zaino</td><td>un'amica (apostrophe before a vowel)</td></tr></table><p>Careful: masculine before a vowel is <b>un</b> (no apostrophe); only the feminine is <b>un'</b>.</p>",
"<h3 class=\"gb-h\">形容詞的位置與配合</h3><p>形容詞要跟名詞的<b>性別和單複數一致</b>，通常放在名詞<b>後面</b>。</p><table><tr><th></th><th>-o 型</th><th>-e 型</th></tr><tr><td>陽性單數</td><td>un ragazzo alto</td><td>un libro interessante</td></tr><tr><td>陰性單數</td><td>una ragazza alta</td><td>una città interessante</td></tr><tr><td>陽性複數</td><td>ragazzi alti</td><td>libri interessanti</td></tr><tr><td>陰性複數</td><td>ragazze alte</td><td>città interessanti</td></tr></table><p>常放在名詞前面的：bello、buono、grande、piccolo、nuovo、vecchio（un bel vestito、una buona idea）。顏色 blu、rosa、viola 不變化。</p><p>-co 結尾：bianco → bianchi（多數加 h）；simpatico → simpatici（重音在前面的不加 h）。-go 結尾一律加 h：lungo → lunghi。</p>":"<h3 class=\"gb-h\">Adjective position and agreement</h3><p>Adjectives must <b>agree in gender and number</b> with the noun, and usually go <b>after</b> it.</p><table><tr><th></th><th>-o type</th><th>-e type</th></tr><tr><td>Masculine singular</td><td>un ragazzo alto</td><td>un libro interessante</td></tr><tr><td>Feminine singular</td><td>una ragazza alta</td><td>una città interessante</td></tr><tr><td>Masculine plural</td><td>ragazzi alti</td><td>libri interessanti</td></tr><tr><td>Feminine plural</td><td>ragazze alte</td><td>città interessanti</td></tr></table><p>Often placed before the noun: bello, buono, grande, piccolo, nuovo, vecchio (un bel vestito, una buona idea). The colours blu, rosa, viola never change.</p><p>Ending in -co: bianco → bianchi (most add h); simpatico → simpatici (no h when the stress is further back). Ending in -go: always add h: lungo → lunghi.</p>",
"<h3 class=\"gb-h\">現在式：-are 規則動詞</h3><p>去掉 -are，加上詞尾（以 parlare 為例）：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">parl<b>o</b></span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">parl<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">parl<b>i</b></span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">parl<b>ate</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">parl<b>a</b></span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">p<u>a</u>rl<b>ano</b><small>（重音在前面）</small></span></td></tr></table><p>拼字小規則：-care／-gare 在 i 前面加 h（cerchi、paghiamo）；-iare 不要兩個 i（mangi、studiamo）。</p>":"<h3 class=\"gb-h\">Present tense: regular -are verbs</h3><p>Drop -are and add the endings (using parlare):</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">parl<b>o</b></span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">parl<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">parl<b>i</b></span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">parl<b>ate</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">parl<b>a</b></span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">p<u>a</u>rl<b>ano</b><small> (stress further back)</small></span></td></tr></table><p>Spelling tip: -care / -gare add h before i (cerchi, paghiamo); -iare doesn’t double the i (mangi, studiamo).</p>",
"<h3 class=\"gb-h\">現在式：-ere 規則動詞</h3><p>以 prendere 為例：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">prend<b>o</b></span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">prend<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">prend<b>i</b></span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">prend<b>ete</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">prend<b>e</b></span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">prend<b>ono</b></span></td></tr></table><p>發音注意：leggo 的 gg 是硬音 [g]，leggi 的 gg 是軟音 [dʒ]，拼字不變。</p><p>很多 -ere 動詞的過去分詞不規則：preso、letto、scritto、visto、messo、chiuso…（見各字變化表）。</p>":"<h3 class=\"gb-h\">Present tense: regular -ere verbs</h3><p>Using prendere:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">prend<b>o</b></span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">prend<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">prend<b>i</b></span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">prend<b>ete</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">prend<b>e</b></span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">prend<b>ono</b></span></td></tr></table><p>Pronunciation: the gg in leggo is hard [g], the gg in leggi is soft [dʒ] — the spelling stays the same.</p><p>Many -ere verbs have irregular past participles: preso, letto, scritto, visto, messo, chiuso… (see each word’s forms table).</p>",
"<h3 class=\"gb-h\">現在式：-ire 規則動詞</h3><p>以 dormire 為例：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">dorm<b>o</b></span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">dorm<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">dorm<b>i</b></span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">dorm<b>ite</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">dorm<b>e</b></span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">dorm<b>ono</b></span></td></tr></table><p>和 -ere 只差 voi 的形（-ite）。</p><h3 class=\"gb-h\">現在式：-ire 加 -isc- 的動詞</h3><p>capire、finire、preferire、pulire、spedire 在 io、tu、lui/lei、loro 加 <b>-isc-</b>：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">cap<b>isco</b></span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">capiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">cap<b>isci</b></span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">capite</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">cap<b>isce</b></span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">cap<b>iscono</b></span></td></tr></table><p>發音：isco [isko]、isci [iʃi]。哪些動詞加 isc 要一個一個記。</p>":"<h3 class=\"gb-h\">Present tense: regular -ire verbs</h3><p>Using dormire:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">dorm<b>o</b></span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">dorm<b>iamo</b></span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">dorm<b>i</b></span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">dorm<b>ite</b></span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">dorm<b>e</b></span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">dorm<b>ono</b></span></td></tr></table><p>The only difference from -ere is the voi form (-ite).</p><h3 class=\"gb-h\">Present tense: -ire verbs with -isc-</h3><p>capire, finire, preferire, pulire, spedire add <b>-isc-</b> in the io, tu, lui/lei and loro forms:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">cap<b>isco</b></span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">capiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">cap<b>isci</b></span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">capite</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">cap<b>isce</b></span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">cap<b>iscono</b></span></td></tr></table><p>Pronunciation: isco [isko], isci [iʃi]. Which verbs take -isc- has to be learned one by one.</p>",
"<h3 class=\"gb-h\">動詞 essere（是、在）</h3><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">sono</span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">siamo</span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">sei</span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">siete</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">è</span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">sono</span></td></tr></table><p>用來說身分、國籍、個性、位置：<i>Sono taiwanese.</i>（我是台灣人）<i>Il bagno è lì.</i>（廁所在那裡）</p><p>注意 <b>è</b>（是）有重音，<b>e</b>（和）沒有。</p><h3 class=\"gb-h\">動詞 avere（有）</h3><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">io<i>我</i></span><span class=\"vf\">ho</span></td><td><span class=\"pn\">noi<i>我們</i></span><span class=\"vf\">abbiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>你</i></span><span class=\"vf\">hai</span></td><td><span class=\"pn\">voi<i>你們</i></span><span class=\"vf\">avete</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>他／她</i></span><span class=\"vf\">ha</span></td><td><span class=\"pn\">loro<i>他們</i></span><span class=\"vf\">hanno</span></td></tr></table><p>h 不發音：ho 唸 [o]。<i>Ho un cane.</i>（我有一隻狗）</p><p>兩個動詞也是過去式的助動詞：<i>ho mangiato</i>、<i>sono andato</i>。</p>":"<h3 class=\"gb-h\">The verb essere (to be)</h3><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">sono</span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">siamo</span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">sei</span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">siete</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">è</span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">sono</span></td></tr></table><p>Used for identity, nationality, personality and location: <i>Sono taiwanese.</i> (I’m Taiwanese.) <i>Il bagno è lì.</i> (The bathroom is there.)</p><p>Note: <b>è</b> (is) has an accent; <b>e</b> (and) doesn’t.</p><h3 class=\"gb-h\">The verb avere (to have)</h3><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">io<i>I</i></span><span class=\"vf\">ho</span></td><td><span class=\"pn\">noi<i>we</i></span><span class=\"vf\">abbiamo</span></td></tr><tr><td><span class=\"pn\">tu<i>you</i></span><span class=\"vf\">hai</span></td><td><span class=\"pn\">voi<i>you (pl.)</i></span><span class=\"vf\">avete</span></td></tr><tr><td><span class=\"pn\">lui/lei<i>he / she</i></span><span class=\"vf\">ha</span></td><td><span class=\"pn\">loro<i>they</i></span><span class=\"vf\">hanno</span></td></tr></table><p>The h is silent: ho is pronounced [o]. <i>Ho un cane.</i> (I have a dog.)</p><p>Both verbs are also the helper verbs for the past tense: <i>ho mangiato</i>, <i>sono andato</i>.</p>",

// ================= 語音（日文頁和語言頁共用：n5src/shared/voice.js） =================
// build.js 會把這個檔複製進兩邊的頁面（見 lib-tab.js 開頭的說明）。
// 用瀏覽器內建的語音（speechSynthesis）念單字和句子。各語言怎麼挑聲音由 PAGE.voice 提供：
//   GOOD 比較自然的語音名稱、match(v) 這個語言的語音、score(v) 越高越好、robotic(v) 聽起來很機械（可省略）、
//   saved()／save(uri) 使用者選的語音、text(t) 念之前整理文字（可省略）、uLang(v) 要念的語言代碼、
//   label 設定裡的標題、none 沒有語音時的說明、help(opts) 語音不好時的建議、note 設定說明、sample 試聽的句子
const Voice = {
  list: [], ok: 'speechSynthesis' in window,
  get GOOD() { return PAGE.voice.GOOD; },
  score(v) { return PAGE.voice.score(v); },
  refresh() { if (!this.ok) return; try { this.list = speechSynthesis.getVoices().filter(v => PAGE.voice.match(v)); } catch (e) { this.list = []; } },
  init() {
    if (!this.ok) return;
    const load = () => { this.refresh(); if (UI.tab === 'lib') renderVoiceBox(); };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  best() {
    if (!this.list.length) this.refresh();
    const saved = PAGE.voice.saved();
    if (saved) { const v = this.list.find(x => x.voiceURI === saved || x.name === saved); if (v) return v; }
    return this.list.slice().sort((a, b) => this.score(b) - this.score(a))[0] || null;
  },
  allRobotic() { const R = PAGE.voice.robotic; return !!R && this.list.length > 0 && this.list.every(R); },
  // voiceOverride：指定用哪個聲音；rate：指定速度（例如慢速播放），沒給就用設定
  speak(text, voiceOverride, rate) {
    if (!this.ok || !text) { if (!this.ok) toast('這個瀏覽器不支援語音播放'); return; }
    const P = PAGE.voice;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(P.text ? P.text(text) : text);
      const v = voiceOverride || this.best();
      if (v) u.voice = v;
      u.lang = P.uLang(v);
      u.rate = rate || Number(SET.rate) || 0.9;
      speechSynthesis.speak(u);
    } catch (e) { toast('無法播放聲音'); }
  }
};
// 設定裡的「發音」區：選語音、速度、試聽

  Voice.refresh();
  const best = Voice.best();
  const opts = Voice.list.slice().sort((a, b) => Voice.score(b) - Voice.score(a));

    <label class="label" for="vsel">${P.label}</label>
    ${opts.length ? `<select id="vsel">${opts.map(v => `<option value="${esc(v.voiceURI)}"${best && v.voiceURI === best.voiceURI ? ' selected' : ''}>${esc(v.name)}${Voice.GOOD.test(v.name) ? '（較自然）' : ''}</option>`).join('')}</select>` : `<div class="meta">${P.none}</div>`}

function answerSpan(w) {
  const toks = []; let p = 0;
  for (const t of IT.tokenize(w.sent)) { toks.push({ t: t.t, w: t.w, s: p }); p += t.t.length; }
  const aw = IT.tokenize(w.ans).filter(t => t.w).map(t => IT.norm(t.t).toLowerCase());
  const ws = toks.filter(t => t.w);
  for (let i = 0; i + aw.length <= ws.length; i++) {
    if (aw.every((x, j) => IT.norm(ws[i + j].t).toLowerCase() === x)) { const last = ws[i + aw.length - 1]; return [ws[i].s, last.s + last.t.length]; }

  const cands = [];
  WORDS.forEach(x => { if (x.id !== w.id && IT.checkAnswer(input, IT.plain ? IT.plain(x.word) : x.word, x) !== 'wrong') cands.push(x); });

      ${nt ? `<button class="btn solid block" data-gram="${nx}">繼續學：${esc(nt)}</button>` : '<p class="gp-all">全部過關了！</p>'}</div>` +
    sts.map(x => `<section class="gp-stage ${x.st}">
      <div class="gp-sh"><span class="gp-no">${x.st === 'done' ? ICON.ok : x.st === 'locked' ? ICON_LOCK : x.i + 1}</span><div class="gp-st"><b>第 ${x.i + 1} 關・${esc(x.title)}</b><span>${esc(x.desc)}</span></div><span class="gp-cnt">${x.done}/${x.ids.length}</span></div>
      ${x.st === 'locked' ? `<details class="gp-peek"><summary>完成上一關就會打開・先偷看這關的 ${x.ids.length} 個文法</summary>` : ''}

}
function gxWhere(id) {
  const x = gxStageOf(id); if (!x) return '';
  const need = x.st === 'locked' ? gxStages().find(y => y.st !== 'done') : null;
  return `<div class="gp-where ${x.st}"><span>第 ${x.i + 1} 關・${esc(x.title)}</span>${gxPassed(id) ? `<b class="gp-pass">${ICON.ok}已過關</b>` : `<span class="gp-need">練習題答對 ${gxNeed(gxTotal(id))} 題就過關</span>`}${need ? `<p>這關還沒打開，建議先完成第 ${need.i + 1} 關「${esc(need.title)}」，內容一樣可以先看。</p>` : ''}</div>`;
}
// 練習題：四選一，答完一定顯示整句和「為什麼」，不自動跳下一題；算進今日題數，不進錯題和複習
function startGxQuiz(box, gx, id) {
  if (!box) return;
  const P = PAGE.gram;
  const qs = shuffle(gx.q); let i = 0, right = 0;
  const next = () => {
    if (!box.isConnected) return;
    if (i >= qs.length) {
      const all = right >= gxNeed(qs.length), perfect = right === qs.length;
      let nx = '', nt = '';
      if (id && P.path) {
        const before = gxStageOf(id);
        gxRecord(id, right, qs.length);
        const after = gxStageOf(id);
        if (before && after && before.st !== 'done' && after.st === 'done') toast(`第 ${after.i + 1} 關完成！${P.path[after.i + 1] ? `第 ${after.i + 2} 關打開了` : '全部關卡都過了'}`, true);
        nx = gxNext(id); nt = nx ? P.title(nx) : '';
      }
      const msg = all ? (perfect ? '全對，' : '') + (P.path ? '過關！' : '這個文法你會了。') : (P.path ? `答對 ${gxNeed(qs.length)} 題才算過關。` : '') + (right ? '差一點，看一下範例再練一次。' : '先看範例拆解，再回來試試。');
      box.innerHTML = `<div class="gx-done"><div class="gx-score">${right} / ${qs.length}</div><p>${msg}</p><div class="btnrow">${all && nx ? `<button class="btn solid" data-gram="${nx}">下一個：${esc(nt)}</button><button class="btn quiet" id="gxAgain">再練一次</button>` : `<button class="btn solid" id="gxAgain">再練一次</button><button class="btn quiet" data-gpane="ex">看範例</button>`}</div></div>`;
      $('#gxAgain', box).onclick = () => startGxQuiz(box, gx, id);
      $$('[data-gpane]', box).forEach(b => b.onclick = () => { gramPane = b.dataset.gpane; renderGram(); });
      const wh = $('.gp-where', box.closest('.card')); if (wh) wh.outerHTML = gxWhere(id);
      return;
    }
    const q = P.quizQ(qs[i++], id);
    renderChoice(box, {
      head: `<div class="qhead"><span class="meta">文法練習 ${i} / ${qs.length}</span></div>${q.head || ''}`,
      promptHTML: q.prompt,
      options: q.options,
      onAnswer: ok => { if (ok) right++; bumpDay(); const b = $('#blank', box); if (b) { b.textContent = q.ans; b.classList.add(ok ? 'ok' : 'ng'); } },
      explain: q.explain,
      noAuto: true
    }, next);
    if (P.quizBound) P.quizBound(box);
  };
  next();
}
// 文法點頁：說明／看範例／練習題三個分頁，說明下面是 App 裡用到這個文法的例句
function renderGramPoint(host, p, exs) {
  const P = PAGE.gram;
  const gx = P.gx(p.id);
  if (gramPaneId !== p.id) { gramPane = 'body'; gramPaneId = p.id; }
  if (!gx) gramPane = 'body';
  const seg = gx ? `<div class="seg gx-seg" role="group" aria-label="文法分頁">${[['body', '說明'], ['ex', '看範例'], ['q', '練習題']].map(([k, l]) => `<button data-gpane="${k}" aria-pressed="${gramPane === k}">${l}</button>`).join('')}</div>` : '';
  const pane = gramPane === 'ex' ? gxExamplesHTML(gx) : gramPane === 'q' ? '<div id="gxQuiz" class="gx-quiz"></div>' : `${P.body(p)}${gx ? `<div class="btnrow gx-cta"><button class="btn quiet" data-gpane="ex">看範例拆解</button><button class="btn solid" data-gpane="q">練習題（${gx.q.length} 題）</button></div>` : ''}`;
  const [title, lv] = P.head(p);
  host.innerHTML = `<button class="gr-back" id="grBack">‹ 文法列表</button>
    <div class="card">
      <div class="gr-head"><h2>${esc(title)}</h2><span class="lv">${lv}</span></div>
      ${gxWhere(p.id)}${seg}${pane}
    </div>
    ${gramPane !== 'body' ? '' : P.exCard(p, exs)}`;
  $('#grBack', host).onclick = () => { UI.gramSel = ''; saveUI(); renderGram(); window.scrollTo(0, 0); };
  const m = $('#grMore', host); if (m) m.onclick = () => { gramShow += 8; renderGram(); };
  $$('[data-gpane]', host).forEach(b => b.onclick = () => { gramPane = b.dataset.gpane; renderGram(); const c = $('.gr-head', host); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: 'start' }); });
  if (gramPane === 'q') startGxQuiz($('#gxQuiz', host), gx, p.id);
}

async function dictLookup(word, lang) {
  word = String(word).trim().replace(/\s+/g, ' ');
  // Wiktionary 的條目分大小寫（德文名詞大寫、句首的字小寫），照打的、全小寫、首字大寫各試一次
  const forms = [...new Set([word, word.toLowerCase(), word.charAt(0).toUpperCase() + word.slice(1)])];
  const wik = (async () => {
    for (const f of forms) {
      const j = await dictFetch('https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(f.replace(/ /g, '_')));
      if (j === undefined) return undefined;
      if (j && Array.isArray(j[lang]) && j[lang].length) return j[lang];
    }
    return [];
  })();
  const mm = dictFetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=' + lang + '|zh-TW');
  const [w, m] = await Promise.all([wik, mm]);
  const defs = [];
  for (const e of w || []) {
    const ds = (e.definitions || []).map(d => dictText(d.definition)).filter(Boolean).slice(0, 3);
    const info = DICT_POS[e.partOfSpeech] || [e.partOfSpeech || '', 'o'];
    if (ds.length) defs.push({ pos: e.partOfSpeech || '', zh: info[0], p: info[1], defs: ds });
  }
  // 中文：只留真的有中文字、不太長的；同一個字的翻譯記憶先看品質分數，最後才是整句的機器翻譯
  const zh = [], han = s => /[一-鿿]/.test(s) && s.length <= 20;
  const add = s => { s = String(s || '').trim().replace(/\s+/g, ''); if (han(s) && !zh.includes(s)) zh.push(s); };
  if (m && Array.isArray(m.matches)) {
    m.matches.filter(x => String(x.segment || '').trim().toLowerCase() === word.toLowerCase())
      .sort((a, b) => (Number(b.quality) || 0) - (Number(a.quality) || 0) || (b.match || 0) - (a.match || 0))
      .forEach(x => add(x.translation));
  }
  if (m && m.responseData) add(m.responseData.translatedText);
  return { defs: defs.slice(0, 4), zh: zh.slice(0, 3), offline: w === undefined && m === undefined };
}
// 日文的讀音：從 Wiktionary 條目原始碼的 {{ja-pos|noun|ひげ}}、{{ja-noun|ひげ}}、{{ja-verb|type=1|そる}} 這類標籤找假名。
// 回傳候選讀音（可能是空陣列）；連不上回傳 undefined。這裡不檢查對不對得上，由頁面用 align() 確認後才填。
async function dictReading(word) {
  const j = await dictFetch('https://en.wiktionary.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&format=json&formatversion=2&redirects=1&origin=*&titles=' + encodeURIComponent(String(word).trim()));
  if (j === undefined) return undefined;
  const pg = j && j.query && j.query.pages && j.query.pages[0];
  const txt = pg && pg.revisions && pg.revisions[0] && pg.revisions[0].slots && pg.revisions[0].slots.main;
  const src = txt ? String(txt.content != null ? txt.content : txt['*'] || '') : '';
  const at = src.indexOf('==Japanese==');
  if (at < 0) return [];
  const rest = src.slice(at + 12), end = rest.search(/\n==[^=]/);
  const ja = end < 0 ? rest : rest.slice(0, end);
  const out = [], kana = /^[ぁ-ゖァ-ヺー]+$/;
  for (const m of ja.matchAll(/\{\{ja-(?:pos|noun|verb|verb-suru|adj|phrase|adv|see)\|([^{}]*)\}\}/g)) {
    for (const a of m[1].split('|')) {
      if (a.includes('=')) continue;
      const k = a.replace(/[\s.\-^%']/g, '');
      if (kana.test(k) && !out.includes(k)) out.push(k);
    }
  }
  return out;
}

    const notes = [];
    if (rd && rIn && !val('r')) { rIn.value = rd; showR(); notes.push('讀音'); }
    if (r.offline) { dbox.innerHTML = '<p class="meta" style="margin:0">連不上字典，意思請自己填。</p><button type="button" class="linkbtn" id="myRe" style="align-self:flex-start">再查一次</button>'; }

      // 點一下：換成這個意思；按住已經填好的再點別的，會接在後面

  wIn.addEventListener('change', () => runLook());
  wIn.addEventListener('keydown', e => { if (e.key === 'Enter' && dbox) { e.preventDefault(); runLook(); $('#my-zh', el).focus(); } });

function doSearch(qs) {
  const box = $('#results');
  const q = qs.trim().toLowerCase();
  if (!q) { box.innerHTML = ''; return; }
  const qa = IT.stripAccents(q);
  let hits = WORDS.filter(w => IT.stripAccents((w.word + ' ' + w.title + ' ' + w.e[3]).toLowerCase()).includes(qa) || w.zh.includes(qs.trim()) || (q.length > 1 && /^[a-z ]+$/.test(q) && w.en.toLowerCase().includes(q)));
  hits.sort((a, b) => (IT.stripAccents(a.word.toLowerCase()).startsWith(qa) ? 0 : 1) - (IT.stripAccents(b.word.toLowerCase()).startsWith(qa) ? 0 : 1));
  hits = hits.slice(0, 30);
  if (!hits.length) { box.innerHTML = `<div class="meta">找不到符合的字。</div><button class="btn quiet" data-addmine="${esc(qs.trim())}" style="align-self:flex-start">查字典並把「${esc(qs.trim())}」加到我的單字</button>`; return; }
  box.innerHTML = hits.map(w => {
    const r = getRec(w.id);
    const canQ = r.s === 'new' || r.s === 'excluded';
    return `<div class="res">
      <div class="hd"><span class="w" lang="${LC.id}" style="font-family:var(--font-ui);font-weight:700">${esc(w.title)}</span><span>${meanW(w)}</span>${posBadge(w)}</div>
      <div class="row"><span class="st ${r.s}">${STATUS_TXT[r.s] || '未學'}</span><span class="meta">作答 ${r.n || 0} 次</span></div>
      <div class="sent sm" lang="${LC.id}">${sentHTML(w.sent)}</div>
      <div class="meta" style="color:var(--fg)">${esc(w.sentZh)}</div>
      <div class="row">${playBtn(w.title, '單字')}${playBtn(w.sent, '例句')}${canQ ? `<button class="btn" data-q="${esc(w.id)}" style="min-height:44px">列入考題</button>` : ''}</div>
    </div>`;
  }).join('');
  $$('[data-q]', box).forEach(b => b.onclick = () => { touch(b.dataset.q, { s: 'queued' }); toast('已列入考題'); doSearch($('#q').value); });
}

    const g = esc(LC.glyph), fs = [...LC.glyph].length > 1 ? 22 : 28;
    return `<svg class="tour-art" viewBox="0 0 320 110" aria-hidden="true"><rect width="320" height="110" rx="12" fill="var(--surface2)"/><circle cx="252" cy="34" r="16" fill="var(--c2)"/><path d="M0 110 L70 46 L120 82 L170 30 L240 110Z" fill="var(--c1)"/><path d="M150 50 L170 30 L190 50 L180 46 L170 54 L160 46Z" fill="var(--surface)"/><path d="M120 110 L210 62 L320 104 L320 110Z" fill="var(--c3)"/><path d="M0 98 C60 88 110 104 170 96 S280 86 320 96 L320 110 L0 110Z" fill="var(--pri-soft)"/><rect x="26" y="20" width="44" height="44" rx="10" fill="var(--fill)"/><text x="48" y="51" text-anchor="middle" font-size="${fs}" font-weight="700" fill="var(--fill-ink)" font-family="var(--font-ui)">${g}</text></svg>`;
  },
  steps: () => [
    { t: `歡迎使用${LC.name} ${LC.level}`, d: LC.tourIntro || `從字母和發音開始，學${LC.name} ${LC.level} 的單字和文法。用 30 秒認識每個分頁。` },
    { el: '.brand', t: '切換語言', d: '點左上角的語言名稱可以換到別的語言；也可以鎖定只學其中幾個語言，避免一次學太多。' },
    { el: '[data-tab="pron"]', tab: 'pron', t: '發音', d: LC.tourPron || '字母表點一下可以聽發音、看例字；「規則」整理拼字怎麼唸，「練習」有聽音選拼字、看拼字選讀法。' },
    { el: '[data-tab="card"]', tab: 'card', t: '字卡：挑要學的字', d: '新字一張一張看：已經會的按「已經會了」，想練的按「列入考題」，之後單選和填空就會出這些字。' },
    { el: '[data-tab="mc"]', tab: 'mc', t: '單選', d: `${MC_MODES.map(m => m[1]).join('、')}，左上角可以換題型和題目來源。` },
    { el: '[data-tab="fill"]', tab: 'fill', t: '填空', d: '看例句打出空格裡的字，答對才算「已學會」，之後照時間排到期複習。' + (LC.tourFill || '') },
    { el: '[data-tab="gram"]', tab: 'gram', t: '文法', d: '文法分成好幾關，照順序學：每個文法點有說明、拆開的範例和練習題，答對八成就過關。下面還有詞性變化規則。' },
    { el: '[data-tab="lib"]', tab: 'lib', t: '單字庫・設定', d: '看進度、搜尋單字、進入錯題和到期複習。下面的「設定」可以調音效、選語音、用 Google 登入同步進度。' },
    { el: ['#genBtn', '#themeBtn'], t: '上方的小按鈕', d: $('#genBtn') ? '「名」切換名詞上方的性別標示，最右邊切換淺色／深色。' : '最右邊的按鈕切換淺色／深色。' },
    { t: '小提示', d: '例句裡的單字都可以點，會跳出意思和詳細資料。準備好就開始吧！', last: true }
  ],
  fresh: () => !Object.keys(S.items).some(id => id.startsWith(LP))
};
// ================= 首次使用導覽（日文頁和語言頁共用） =================
// 各頁不同的地方放在 PAGE.tour：
//   key      記錄「看過導覽」的 localStorage 鍵（日文 n5:toured、語言頁 it:toured…）
//   steps()  步驟陣列 [{ t 標題, d 說明, el 要框起來的元素（選擇器或陣列）, tab 要切到的分頁, last 最後一步 }]
//            el 找不到的步驟會自動跳過（例如英文頁沒有「名」按鈕）
//   art      第一步上方的插畫（HTML）
//   extra(st)、bind(card, Tour)  步驟裡額外的內容和按鈕（日文頁用來選介面語言）
//   fresh()  還沒有這個語言的學習紀錄（有紀錄的人不會自動跳出導覽）
const Tour = {
  i: 0, ring: null, card: null, back: null, list: [],
  start(i) {
    const T = PAGE.tour;
    this.list = T.steps().filter(st => !st.el || [].concat(st.el).some(s => $(s)));
    this.i = Math.max(0, Math.min(this.list.length - 1, i || 0));
    if (!this.ring) {
      this.ring = document.createElement('div'); this.ring.className = 'tour-ring';
      this.card = document.createElement('div'); this.card.className = 'tour-card'; this.card.setAttribute('role', 'dialog'); this.card.setAttribute('aria-modal', 'true');
      this.back = document.createElement('div'); this.back.style.cssText = 'position:fixed;inset:0;z-index:69';
      document.body.append(this.back, this.ring, this.card);
      window.addEventListener('resize', () => this.place());
    }
    this.back.hidden = this.ring.hidden = this.card.hidden = false;
    this.show();
  },
  show() {
    const T = PAGE.tour, st = this.list[this.i];
    if (st.tab && UI.tab !== st.tab) showTab(st.tab);
    const dots = this.list.map((_, j) => `<i class="${j === this.i ? 'on' : ''}"></i>`).join('');
    this.card.setAttribute('aria-label', st.t);
    this.card.innerHTML = `${this.i === 0 && T.art ? T.art : ''}<h3>${esc(st.t)}</h3><p>${esc(st.d)}</p>
      ${T.extra ? T.extra(st) : ''}
      <div class="tour-dots" aria-hidden="true">${dots}</div>
      <div class="row">${st.last ? '' : '<button class="btn quiet" data-tour="skip">略過</button>'}${this.i > 0 && !st.last ? '<button class="btn quiet" data-tour="prev">上一步</button>' : ''}<button class="btn solid" data-tour="${st.last ? 'end' : 'next'}">${st.last ? '開始學習' : '下一步'}</button></div>`;
    if (T.bind) T.bind(this.card, this);
    $$('[data-tour]', this.card).forEach(b => b.onclick = () => { const a = b.dataset.tour; if (a === 'next') this.go(this.i + 1); else if (a === 'prev') this.go(this.i - 1); else this.end(); });
    this.place();
    requestAnimationFrame(() => { const f = $('[data-tour="next"],[data-tour="end"]', this.card); if (f) f.focus({ preventScroll: true }); });
  },
  go(i) { this.i = Math.max(0, Math.min(this.list.length - 1, i)); this.show(); },
  place() {
    if (!this.card || this.card.hidden) return;
    const st = this.list[this.i], vh = window.innerHeight;
    const els = st.el ? [].concat(st.el).map(s => $(s)).filter(Boolean) : [];
    this.card.style.top = this.card.style.bottom = '';
    if (!els.length) {
      this.ring.classList.add('none');
      this.card.style.top = Math.max(16, (vh - this.card.offsetHeight) / 2) + 'px';
      return;
    }
    this.ring.classList.remove('none');
    const rs = els.map(e => e.getBoundingClientRect());
    const r = { l: Math.min(...rs.map(x => x.left)), t: Math.min(...rs.map(x => x.top)), r: Math.max(...rs.map(x => x.right)), b: Math.max(...rs.map(x => x.bottom)) };
    const pad = 4;
    Object.assign(this.ring.style, { left: (r.l - pad) + 'px', top: (r.t - pad) + 'px', width: (r.r - r.l + pad * 2) + 'px', height: (r.b - r.t + pad * 2) + 'px' });
    if (r.t > vh / 2) this.card.style.bottom = (vh - r.t + 14) + 'px';
    else this.card.style.top = (r.b + 14) + 'px';
  },
  end() {
    store.set(PAGE.tour.key, 1);
    this.back.hidden = this.ring.hidden = this.card.hidden = true;
    showTab('card');
  },
  // 啟動時呼叫：沒看過導覽、也還沒有這個語言的紀錄才自動開始。
  // 第一次使用要先選語言（lang.js 的「你想學哪個語言？」），選完留在這一頁才開始
  auto() {
    if (window.AppLangs && AppLangs.welcome) return AppLangs.afterWelcome(() => this.auto());
    if (!store.get(PAGE.tour.key, 0) && PAGE.tour.fresh()) this.start(0);
  }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Tour.card && !Tour.card.hidden) Tour.end(); });

// ================= 啟動 =================
syncMine();
applyTheme();
renderGoal();
Voice.init();
showTab(UI.tab);
Cloud.init();
Tour.auto();
window.ITApp = { showTab, Tour, openWord, openToken, getRec, record, touch, S: () => S, UI, SET, WORDS };
})();

</script>
