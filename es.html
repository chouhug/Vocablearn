"<p>每個名詞都有性別：陽性（m）或陰性（f）。大部分可以從字尾猜：</p><ul><li><b>-o</b> 通常是陽性：el libro、el niño</li><li><b>-a</b> 通常是陰性：la casa、la niña</li><li><b>-ción、-sión、-dad、-tad、-tud</b> 是陰性：la canción、la ciudad</li><li><b>-e</b> 和子音結尾兩種都有，要一起背：el coche、la noche、el sol、la flor</li></ul><p>常見例外：<b>la mano</b>、<b>la foto</b>、<b>la moto</b>、<b>la radio</b>（陰性）；<b>el día</b>、<b>el mapa</b>、<b>el problema</b>、<b>el idioma</b>、<b>el programa</b>（陽性，很多 -ma 結尾的字來自希臘文）。</p>":"<p>Every noun has a gender: masculine (m) or feminine (f). You can usually guess from the ending:</p><ul><li><b>-o</b> is usually masculine: el libro, el niño</li><li><b>-a</b> is usually feminine: la casa, la niña</li><li><b>-ción, -sión, -dad, -tad, -tud</b> are feminine: la canción, la ciudad</li><li><b>-e</b> and consonant endings can be either — learn them with the noun: el coche, la noche, el sol, la flor</li></ul><p>Common exceptions: <b>la mano</b>, <b>la foto</b>, <b>la moto</b>, <b>la radio</b> (feminine); <b>el día</b>, <b>el mapa</b>, <b>el problema</b>, <b>el idioma</b>, <b>el programa</b> (masculine — many -ma words come from Greek).</p>",
"名詞的複數":"Noun plurals",
"<table><tr><th>單數</th><th>複數</th><th>例子</th></tr><tr><td>母音結尾</td><td>加 -s</td><td>libro → libros、café → cafés</td></tr><tr><td>子音結尾</td><td>加 -es</td><td>ciudad → ciudades、flor → flores</td></tr><tr><td>-z</td><td>-ces</td><td>lápiz → lápices、vez → veces</td></tr><tr><td>-s（重音不在最後）</td><td>不變</td><td>el lunes → los lunes</td></tr></table><p><b>重音符號會跑掉或冒出來</b>，因為重音位置不能變：canción → canc<b>io</b>nes（拿掉）、examen → ex<b>á</b>menes（加上）、joven → j<b>ó</b>venes。</p><p>陽性複數可以包含男女：<i>los padres</i>＝父母、<i>los hermanos</i>＝兄弟姊妹。</p>":"<table><tr><th>Singular</th><th>Plural</th><th>Example</th></tr><tr><td>Ends in a vowel</td><td>add -s</td><td>libro → libros, café → cafés</td></tr><tr><td>Ends in a consonant</td><td>add -es</td><td>ciudad → ciudades, flor → flores</td></tr><tr><td>-z</td><td>-ces</td><td>lápiz → lápices, vez → veces</td></tr><tr><td>-s (stress not on the last syllable)</td><td>no change</td><td>el lunes → los lunes</td></tr></table><p><b>Accent marks can disappear or appear</b>, because the stress has to stay in the same place: canción → canc<b>io</b>nes (dropped), examen → ex<b>á</b>menes (added), joven → j<b>ó</b>venes.</p><p>A masculine plural can include both sexes: <i>los padres</i> = parents, <i>los hermanos</i> = brothers and sisters.</p>",
"形容詞":"Adjectives",
"形容詞的位置與配合":"Adjective position and agreement",
"<p>形容詞要跟名詞的<b>性別和單複數一致</b>，通常放在名詞<b>後面</b>。</p><table><tr><th></th><th>-o 型</th><th>-e／子音型</th></tr><tr><td>陽性單數</td><td>un chico alto</td><td>un libro interesante</td></tr><tr><td>陰性單數</td><td>una chica alta</td><td>una ciudad interesante</td></tr><tr><td>陽性複數</td><td>chicos altos</td><td>libros fáciles</td></tr><tr><td>陰性複數</td><td>chicas altas</td><td>ciudades fáciles</td></tr></table><p>國籍形容詞子音結尾也有陰性：español → española、alemán → alemana。</p><p>bueno、malo 在陽性單數名詞前變 <b>buen</b>、<b>mal</b>：<i>un buen día</i>；grande 在單數名詞前變 <b>gran</b>：<i>una gran ciudad</i>（＝很棒的城市）。</p>":"<p>Adjectives must <b>agree in gender and number</b> with the noun, and usually go <b>after</b> it.</p><table><tr><th></th><th>-o type</th><th>-e / consonant type</th></tr><tr><td>Masculine singular</td><td>un chico alto</td><td>un libro interesante</td></tr><tr><td>Feminine singular</td><td>una chica alta</td><td>una ciudad interesante</td></tr><tr><td>Masculine plural</td><td>chicos altos</td><td>libros fáciles</td></tr><tr><td>Feminine plural</td><td>chicas altas</td><td>ciudades fáciles</td></tr></table><p>Nationality adjectives ending in a consonant also have a feminine form: español → española, alemán → alemana.</p><p>bueno and malo become <b>buen</b> and <b>mal</b> before a masculine singular noun: <i>un buen día</i>; grande becomes <b>gran</b> before any singular noun: <i>una gran ciudad</i> (= a great city).</p>",
"動詞":"Verbs",
"動詞 ser（是）":"The verb ser (to be)",
"<table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">soy</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">somos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">eres</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">sois</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">es</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">son</span></td></tr></table><p>用來說<b>本質、不太會變的事</b>：身分、職業、國籍、來源、個性、外表、時間、價錢總額。</p><p><i>Soy taiwanés.</i>（我是台灣人）<i>Es profesora.</i>（她是老師）<i>Son las tres.</i>（三點了）</p>":"<table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">soy</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">somos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">eres</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">sois</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">es</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">son</span></td></tr></table><p>Used for <b>what something is, things that don’t really change</b>: identity, job, nationality, origin, personality, looks, time, total price.</p><p><i>Soy taiwanés.</i> (I’m Taiwanese.) <i>Es profesora.</i> (She’s a teacher.) <i>Son las tres.</i> (It’s three o’clock.)</p>",
"動詞 estar（在、處於…狀態）":"The verb estar (to be — location, state)",
"<table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">estoy</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">estamos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">estás</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">estáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">está</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">están</span></td></tr></table><p>用來說<b>位置</b>和<b>暫時的狀態、心情</b>：</p><p><i>¿Dónde está el baño?</i>（廁所在哪）<i>Estoy cansado.</i>（我累了）<i>¿Cómo estás?</i>（你好嗎）</p>":"<table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">estoy</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">estamos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">estás</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">estáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">está</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">están</span></td></tr></table><p>Used for <b>location</b> and <b>temporary states and moods</b>:</p><p><i>¿Dónde está el baño?</i> (Where’s the bathroom?) <i>Estoy cansado.</i> (I’m tired.) <i>¿Cómo estás?</i> (How are you?)</p>",
"ser 和 estar 怎麼分":"ser vs. estar",
"<table><tr><th>ser</th><th>estar</th></tr><tr><td>是什麼、什麼樣的人／東西</td><td>在哪裡、現在怎麼樣</td></tr><tr><td><i>Es alto.</i> 他個子高</td><td><i>Está cansado.</i> 他累了</td></tr><tr><td><i>Es aburrido.</i> 他很無聊（個性）</td><td><i>Está aburrido.</i> 他覺得無聊</td></tr><tr><td><i>La sopa es rica.</i>（少用）</td><td><i>La sopa está rica.</i> 湯（現在吃起來）很好喝</td></tr></table><p>位置一律用 estar：<i>Madrid está en España.</i> 但「活動在哪裡舉行」用 ser：<i>La fiesta es en mi casa.</i></p><p>bien／mal 配 estar：<i>Estoy bien.</i></p>":"<table><tr><th>ser</th><th>estar</th></tr><tr><td>What it is, what kind of person / thing</td><td>Where it is, how it is right now</td></tr><tr><td><i>Es alto.</i> He’s tall</td><td><i>Está cansado.</i> He’s tired</td></tr><tr><td><i>Es aburrido.</i> He’s boring (personality)</td><td><i>Está aburrido.</i> He’s bored</td></tr><tr><td><i>La sopa es rica.</i> (less common)</td><td><i>La sopa está rica.</i> The soup tastes good (right now)</td></tr></table><p>Location always uses estar: <i>Madrid está en España.</i> But “where an event takes place” uses ser: <i>La fiesta es en mi casa.</i></p><p>bien / mal go with estar: <i>Estoy bien.</i></p>",
"tener（有）與慣用說法":"tener (to have) and its expressions",
"<table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">tengo</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">tenemos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">tienes</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">tenéis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">tiene</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">tienen</span></td></tr></table><p>中文說「我餓了」，西班牙文說「我<b>有</b>飢餓」：</p><ul><li>tengo hambre 我餓／tengo sed 我渴</li><li>tengo frío 我冷／tengo calor 我熱</li><li>tengo sueño 我想睡／tengo miedo 我怕</li><li>tengo prisa 我趕時間／tengo razón 我是對的</li><li>tengo veinte años 我二十歲（年齡用 tener！）</li></ul>":"<table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">tengo</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">tenemos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">tienes</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">tenéis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">tiene</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">tienen</span></td></tr></table><p>Where English says “I’m hungry”, Spanish says “I <b>have</b> hunger”:</p><ul><li>tengo hambre I’m hungry / tengo sed I’m thirsty</li><li>tengo frío I’m cold / tengo calor I’m hot</li><li>tengo sueño I’m sleepy / tengo miedo I’m scared</li><li>tengo prisa I’m in a hurry / tengo razón I’m right</li><li>tengo veinte años I’m twenty (age uses tener!)</li></ul>",
"句型":"Sentence patterns",
"hay（有……）":"hay (there is / there are)",
"<p><b>hay</b> 表示「某處有某物」，單複數都一樣：</p><ul><li><i>¿Hay una farmacia cerca?</i> 附近有藥局嗎？</li><li><i>Hay muchos turistas.</i> 有很多觀光客。</li></ul><p>hay 後面接<b>不定冠詞、數字或不加冠詞</b>；說「某個特定的東西在哪」要用 estar：<i>La farmacia está a la derecha.</i></p>":"<p><b>hay</b> means “there is something somewhere” and is the same for singular and plural:</p><ul><li><i>¿Hay una farmacia cerca?</i> Is there a pharmacy nearby?</li><li><i>Hay muchos turistas.</i> There are lots of tourists.</li></ul><p>hay is followed by <b>an indefinite article, a number or no article</b>; to say where a particular thing is, use estar: <i>La farmacia está a la derecha.</i></p>",
"現在式：-ar 規則動詞":"Present tense: regular -ar verbs",
"<p>去掉 -ar，加上詞尾（以 hablar 為例）：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">habl<b>o</b></span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">habl<b>amos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">habl<b>as</b></span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">habl<b>áis</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">habl<b>a</b></span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">habl<b>an</b></span></td></tr></table><p>動詞形已經看得出主詞，所以主詞常常省略：<i>Hablo español.</i>（我說西班牙文）</p>":"<p>Drop -ar and add the endings (using hablar):</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">habl<b>o</b></span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">habl<b>amos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">habl<b>as</b></span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">habl<b>áis</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">habl<b>a</b></span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">habl<b>an</b></span></td></tr></table><p>The verb form already shows the subject, so the subject is often left out: <i>Hablo español.</i> (I speak Spanish.)</p>",
"現在式：-er 規則動詞":"Present tense: regular -er verbs",
"<p>以 comer 為例：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">com<b>o</b></span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">com<b>emos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">com<b>es</b></span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">com<b>éis</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">com<b>e</b></span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">com<b>en</b></span></td></tr></table><p>拼字小規則：-cer 前面是母音的，yo 變 <b>-zco</b>：conocer → cono<b>zco</b>；-ger 的 yo 變 <b>-jo</b>：coger → co<b>jo</b>。</p>":"<p>Using comer:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">com<b>o</b></span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">com<b>emos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">com<b>es</b></span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">com<b>éis</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">com<b>e</b></span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">com<b>en</b></span></td></tr></table><p>Spelling tip: verbs in -cer after a vowel change yo to <b>-zco</b>: conocer → cono<b>zco</b>; -ger verbs change yo to <b>-jo</b>: coger → co<b>jo</b>.</p>",
"現在式：-ir 規則動詞":"Present tense: regular -ir verbs",
"<p>以 vivir 為例：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">viv<b>o</b></span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">viv<b>imos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">viv<b>es</b></span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">viv<b>ís</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">viv<b>e</b></span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">viv<b>en</b></span></td></tr></table><p>和 -er 只差 nosotros（-imos）和 vosotros（-ís）。</p>":"<p>Using vivir:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">viv<b>o</b></span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">viv<b>imos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">viv<b>es</b></span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">viv<b>ís</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">viv<b>e</b></span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">viv<b>en</b></span></td></tr></table><p>The only differences from -er are nosotros (-imos) and vosotros (-ís).</p>",
"詞幹變化 e → ie（pensar → pienso）":"Stem change e → ie (pensar → pienso)",
"<p>有些動詞在<b>重音落在詞幹</b>時，e 變成 ie。nosotros、vosotros 重音在詞尾，所以不變——畫出來像一隻「靴子」：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">p<b>ie</b>nso</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">pensamos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">p<b>ie</b>nsas</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">pensáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">p<b>ie</b>nsa</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">p<b>ie</b>nsan</span></td></tr></table><p>常見：pensar、empezar、cerrar、querer、entender、perder、preferir、sentir、despertarse。哪些動詞會變要一個一個記，App 的變化表都有標。</p>":"<p>In some verbs, e becomes ie <b>when the stress falls on the stem</b>. In nosotros and vosotros the stress is on the ending, so they don’t change — drawn out, it looks like a “boot”:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">p<b>ie</b>nso</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">pensamos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">p<b>ie</b>nsas</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">pensáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">p<b>ie</b>nsa</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">p<b>ie</b>nsan</span></td></tr></table><p>Common ones: pensar, empezar, cerrar, querer, entender, perder, preferir, sentir, despertarse. Which verbs change has to be learned one by one; the app’s forms tables mark them.</p>",
"詞幹變化 o → ue（poder → puedo）":"Stem change o → ue (poder → puedo)",
"<p>規則和 e → ie 一樣，只有 nosotros、vosotros 不變：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">v<b>ue</b>lvo</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">volvemos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">v<b>ue</b>lves</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">volvéis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">v<b>ue</b>lve</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">v<b>ue</b>lven</span></td></tr></table><p>常見：poder、volver、dormir、encontrar、costar、recordar、acostarse、llover、doler。</p><p>特例 <b>jugar</b> 是 u → ue：j<b>ue</b>go, j<b>ue</b>gas, j<b>ue</b>ga, jugamos, jugáis, j<b>ue</b>gan。</p>":"<p>Same rule as e → ie — only nosotros and vosotros stay the same:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">v<b>ue</b>lvo</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">volvemos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">v<b>ue</b>lves</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">volvéis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">v<b>ue</b>lve</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">v<b>ue</b>lven</span></td></tr></table><p>Common ones: poder, volver, dormir, encontrar, costar, recordar, acostarse, llover, doler.</p><p>Special case: <b>jugar</b> changes u → ue: j<b>ue</b>go, j<b>ue</b>gas, j<b>ue</b>ga, jugamos, jugáis, j<b>ue</b>gan.</p>",
"詞幹變化 e → i（pedir → pido）":"Stem change e → i (pedir → pido)",
"<p>只出現在 -ir 動詞：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">p<b>i</b>do</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">pedimos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">p<b>i</b>des</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">pedís</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">p<b>i</b>de</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">p<b>i</b>den</span></td></tr></table><p>常見：pedir、repetir、vestirse、seguir（sigo）。</p>":"<p>Only happens in -ir verbs:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">p<b>i</b>do</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">pedimos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">p<b>i</b>des</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">pedís</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">p<b>i</b>de</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">p<b>i</b>den</span></td></tr></table><p>Common ones: pedir, repetir, vestirse, seguir (sigo).</p>",
"yo 形不規則：hago、pongo、salgo、conozco":"Irregular yo forms: hago, pongo, salgo, conozco",
"<p>有一群動詞只有 yo 的形特別，其他照規則：</p><table><tr><td>hacer → <b>hago</b></td><td>poner → <b>pongo</b></td></tr><tr><td>salir → <b>salgo</b></td><td>traer → <b>traigo</b></td></tr><tr><td>conocer → <b>conozco</b></td><td>conducir → <b>conduzco</b></td></tr><tr><td>ver → <b>veo</b></td><td>saber → <b>sé</b>、dar → <b>doy</b></td></tr></table><p>tener、venir、decir 是 yo 加 -go <b>而且</b>詞幹也會變：tengo／tienes、vengo／vienes、digo／dices。</p>":"<p>A group of verbs is irregular only in the yo form; the rest follows the rules:</p><table><tr><td>hacer → <b>hago</b></td><td>poner → <b>pongo</b></td></tr><tr><td>salir → <b>salgo</b></td><td>traer → <b>traigo</b></td></tr><tr><td>conocer → <b>conozco</b></td><td>conducir → <b>conduzco</b></td></tr><tr><td>ver → <b>veo</b></td><td>saber → <b>sé</b>, dar → <b>doy</b></td></tr></table><p>tener, venir and decir add -go in the yo form <b>and</b> change the stem: tengo / tienes, vengo / vienes, digo / dices.</p>",
"ir a ＋ 原形（未來：我要去做…）":"ir a + infinitive (future: I’m going to…)",
"<p>ir 的現在式（voy, vas, va, vamos, vais, van）＋ <b>a</b> ＋ 原形，表示「打算、等一下要做」，口語最常用的未來說法：</p><ul><li><i>Voy a comer.</i> 我要去吃飯。</li><li><i>Vamos a ver.</i> 我們看看吧。</li><li><i>Va a llover.</i> 快要下雨了。</li></ul>":"<p>The present of ir (voy, vas, va, vamos, vais, van) + <b>a</b> + infinitive means “plan to, be about to do” — the most common way to talk about the future in everyday speech:</p><ul><li><i>Voy a comer.</i> I’m going to eat.</li><li><i>Vamos a ver.</i> Let’s see.</li><li><i>Va a llover.</i> It’s going to rain.</li></ul>",
"poder、querer、deber、tener que ＋ 原形":"poder, querer, deber, tener que + infinitive",
"<table><tr><th></th><th>poder 能</th><th>querer 想要</th><th>deber 應該</th></tr><tr><td>yo<span class=\"zg\">我</span></td><td>puedo</td><td>quiero</td><td>debo</td></tr><tr><td>tú<span class=\"zg\">你</span></td><td>puedes</td><td>quieres</td><td>debes</td></tr><tr><td>él/ella</td><td>puede</td><td>quiere</td><td>debe</td></tr><tr><td>nosotros<span class=\"zg\">我們</span></td><td>podemos</td><td>queremos</td><td>debemos</td></tr><tr><td>vosotros<span class=\"zg\">你們</span></td><td>podéis</td><td>queréis</td><td>debéis</td></tr><tr><td>ellos</td><td>pueden</td><td>quieren</td><td>deben</td></tr></table><p>後面直接接<b>原形動詞</b>：<i>¿Puedo entrar?</i> <i>Quiero aprender español.</i></p><p>「必須」常說 <b>tener que</b> ＋ 原形：<i>Tengo que trabajar.</i></p>":"<table><tr><th></th><th>poder can</th><th>querer want</th><th>deber should</th></tr><tr><td>yo<span class=\"zg\">I</span></td><td>puedo</td><td>quiero</td><td>debo</td></tr><tr><td>tú<span class=\"zg\">you</span></td><td>puedes</td><td>quieres</td><td>debes</td></tr><tr><td>él/ella</td><td>puede</td><td>quiere</td><td>debe</td></tr><tr><td>nosotros<span class=\"zg\">we</span></td><td>podemos</td><td>queremos</td><td>debemos</td></tr><tr><td>vosotros<span class=\"zg\">you (pl.)</span></td><td>podéis</td><td>queréis</td><td>debéis</td></tr><tr><td>ellos</td><td>pueden</td><td>quieren</td><td>deben</td></tr></table><p>Followed directly by an <b>infinitive</b>: <i>¿Puedo entrar?</i> <i>Quiero aprender español.</i></p><p>“Have to” is usually <b>tener que</b> + infinitive: <i>Tengo que trabajar.</i></p>",
"saber 和 conocer 的差別":"saber vs. conocer",
"<ul><li><b>saber</b>：知道（一件事）、會（技能＋原形）：<i>¿Sabes nadar?</i> <i>No sé.</i></li><li><b>conocer</b>：認識（人）、去過（地方）：<i>¿Conoces a Pablo?</i> <i>No conozco Madrid.</i></li></ul><p>注意 <b>sé</b>（我知道）有重音，<b>se</b>（反身代名詞）沒有。</p>":"<ul><li><b>saber</b>: to know (a fact), to know how to (a skill + infinitive): <i>¿Sabes nadar?</i> <i>No sé.</i></li><li><b>conocer</b>: to know (a person), to have been to (a place): <i>¿Conoces a Pablo?</i> <i>No conozco Madrid.</i></li></ul><p>Note: <b>sé</b> (I know) has an accent; <b>se</b> (reflexive pronoun) doesn’t.</p>",
"me gusta／me gustan（我喜歡）":"me gusta / me gustan (I like)",
"<p>西班牙文說「某物<b>讓我喜歡</b>」：喜歡的東西是主詞。</p><ul><li>單數或動詞原形 → <b>gusta</b>：<i>Me gusta el café.</i> <i>Me gusta viajar.</i></li><li>複數 → <b>gustan</b>：<i>Me gustan los gatos.</i></li></ul><table><tr><td>me 我</td><td>te 你</td><td>le 他／她／您</td></tr><tr><td>nos 我們</td><td>os 你們</td><td>les 他們／您們</td></tr></table><p>encantar（超愛）、doler（痛）用法一樣：<i>Me encanta el chocolate.</i> <i>Me duelen los pies.</i></p><p>強調或說清楚是誰：<i>A mí me gusta…</i>、<i>A Ana le gusta…</i></p>":"<p>Spanish says “something <b>pleases me</b>”: the thing you like is the subject.</p><ul><li>Singular or an infinitive → <b>gusta</b>: <i>Me gusta el café.</i> <i>Me gusta viajar.</i></li><li>Plural → <b>gustan</b>: <i>Me gustan los gatos.</i></li></ul><table><tr><td>me me</td><td>te you</td><td>le him / her / you (formal)</td></tr><tr><td>nos us</td><td>os you (pl.)</td><td>les them / you (pl. formal)</td></tr></table><p>encantar (to love) and doler (to hurt) work the same way: <i>Me encanta el chocolate.</i> <i>Me duelen los pies.</i></p><p>To stress or make clear who: <i>A mí me gusta…</i>, <i>A Ana le gusta…</i></p>",
"反身動詞（me llamo、me levanto）":"Reflexive verbs (me llamo, me levanto)",
"<p>原形以 <b>-se</b> 結尾的動詞（llamarse、levantarse、ducharse），動詞前要加反身代名詞：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\"><b>me</b> levanto</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\"><b>nos</b> levantamos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\"><b>te</b> levantas</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\"><b>os</b> levantáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">él/ella <b>se</b> levanta</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">ellos <b>se</b> levantan</span></td></tr></table><p>和原形、命令式一起時黏在後面：<i>Voy a ducharme.</i> <i>¡Levántate!</i> <i>Siéntese, por favor.</i>（黏上去後常要加重音符號，維持原本的重音）</p>":"<p>Verbs whose infinitive ends in <b>-se</b> (llamarse, levantarse, ducharse) need a reflexive pronoun before the verb:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\"><b>me</b> levanto</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\"><b>nos</b> levantamos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\"><b>te</b> levantas</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\"><b>os</b> levantáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">él/ella <b>se</b> levanta</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">ellos <b>se</b> levantan</span></td></tr></table><p>With an infinitive or imperative the pronoun attaches to the end: <i>Voy a ducharme.</i> <i>¡Levántate!</i> <i>Siéntese, por favor.</i> (An accent is often added to keep the original stress.)</p>",
"否定句 no、no…nunca、no…nada":"Negation no, no…nunca, no…nada",
"<p><b>no</b> 放在動詞前面：<i>No hablo alemán.</i></p><p>雙重否定在西班牙文是正常的：</p><ul><li>no … nunca 從不：<i>No bebo nunca café.</i>（也可以說 <i>Nunca bebo café.</i>）</li><li>no … nada 什麼都不：<i>No como nada.</i></li><li>no … nadie 沒有人：<i>No conozco a nadie.</i></li><li>no … todavía 還沒：<i>Todavía no he comido.</i></li></ul>":"<p><b>no</b> goes before the verb: <i>No hablo alemán.</i></p><p>Double negatives are normal in Spanish:</p><ul><li>no … nunca never: <i>No bebo nunca café.</i> (or <i>Nunca bebo café.</i>)</li><li>no … nada nothing: <i>No como nada.</i></li><li>no … nadie nobody: <i>No conozco a nadie.</i></li><li>no … todavía not yet: <i>Todavía no he comido.</i></li></ul>",
"疑問詞 qué、quién、dónde、cómo、cuándo、cuánto、cuál、por qué":"Question words qué, quién, dónde, cómo, cuándo, cuánto, cuál, por qué",
"<table><tr><td>qué 什麼</td><td>quién 誰</td></tr><tr><td>dónde 哪裡（adónde 去哪裡）</td><td>cómo 怎麼、如何</td></tr><tr><td>cuándo 什麼時候</td><td>cuánto 多少（要配合：cuántos años）</td></tr><tr><td>cuál 哪一個</td><td>por qué 為什麼（回答用 porque）</td></tr></table><p>疑問詞<b>一定有重音符號</b>。句子前面要放倒過來的 <b>¿</b>，驚嘆句放 <b>¡</b>：<i>¿Dónde vives?</i> <i>¡Qué bonito!</i></p>":"<table><tr><td>qué what</td><td>quién who</td></tr><tr><td>dónde where (adónde where to)</td><td>cómo how</td></tr><tr><td>cuándo when</td><td>cuánto how much (agrees: cuántos años)</td></tr><tr><td>cuál which</td><td>por qué why (answer with porque)</td></tr></table><p>Question words <b>always have an accent</b>. Questions start with an upside-down <b>¿</b>, exclamations with <b>¡</b>: <i>¿Dónde vives?</i> <i>¡Qué bonito!</i></p>",
"介係詞":"Prepositions",
"介係詞 a、de、en、con、para、por":"Prepositions a, de, en, con, para, por",
"<table><tr><td><b>a</b></td><td>到（方向）、幾點</td><td>voy a Madrid、a las ocho</td></tr><tr><td><b>de</b></td><td>…的；來自；材料</td><td>el libro de Ana、soy de Taiwán</td></tr><tr><td><b>en</b></td><td>在（地點）、搭（交通）</td><td>en casa、en tren</td></tr><tr><td><b>con</b></td><td>和…一起</td><td>con mis amigos（conmigo 和我、contigo 和你）</td></tr><tr><td><b>para</b></td><td>為了、給、往</td><td>para ti、el tren para Sevilla</td></tr><tr><td><b>por</b></td><td>經過、因為、在（時段）</td><td>por la mañana、gracias por todo</td></tr><tr><td><b>desde／hasta</b></td><td>從／到</td><td>desde las nueve hasta las cinco</td></tr></table>":"<table><tr><td><b>a</b></td><td>to (direction), at (a time)</td><td>voy a Madrid, a las ocho</td></tr><tr><td><b>de</b></td><td>of; from; made of</td><td>el libro de Ana, soy de Taiwán</td></tr><tr><td><b>en</b></td><td>in / at (a place), by (transport)</td><td>en casa, en tren</td></tr><tr><td><b>con</b></td><td>with</td><td>con mis amigos (conmigo with me, contigo with you)</td></tr><tr><td><b>para</b></td><td>for, to, bound for</td><td>para ti, el tren para Sevilla</td></tr><tr><td><b>por</b></td><td>through, because of, in (a part of the day)</td><td>por la mañana, gracias por todo</td></tr><tr><td><b>desde / hasta</b></td><td>from / until</td><td>desde las nueve hasta las cinco</td></tr></table>",
"<p>西班牙文只有兩個合併形，而且<b>一定要合</b>：</p><ul><li>a ＋ el → <b>al</b>：<i>Voy al cine.</i></li><li>de ＋ el → <b>del</b>：<i>la casa del profesor</i></li></ul><p>其他不合：<i>a la playa</i>、<i>de los niños</i>。代名詞 él（他，有重音）也不合：<i>el libro de él</i>。</p>":"<p>Spanish has only two contractions, and they’re <b>compulsory</b>:</p><ul><li>a + el → <b>al</b>: <i>Voy al cine.</i></li><li>de + el → <b>del</b>: <i>la casa del profesor</i></li></ul><p>Nothing else contracts: <i>a la playa</i>, <i>de los niños</i>. The pronoun él (he, with an accent) doesn’t either: <i>el libro de él</i>.</p>",
"「人」當受詞要加 a":"“Personal a” before people",
"<p>受詞是<b>特定的人</b>（或寵物）時，前面要加 <b>a</b>，中文和英文都沒有這個字：</p><ul><li><i>Conozco <b>a</b> Pablo.</i> 我認識巴勃羅。</li><li><i>Visito <b>a</b> mis abuelos.</i> 我去看爺爺奶奶。</li><li><i>No conozco <b>a</b> nadie.</i> 我誰都不認識。</li></ul><p>東西、地方不加：<i>Visito el museo.</i> <i>Conozco Madrid.</i></p>":"<p>When the object is <b>a specific person</b> (or pet), put <b>a</b> in front — English has no equivalent:</p><ul><li><i>Conozco <b>a</b> Pablo.</i> I know Pablo.</li><li><i>Visito <b>a</b> mis abuelos.</i> I visit my grandparents.</li><li><i>No conozco <b>a</b> nadie.</i> I don’t know anyone.</li></ul><p>Not for things or places: <i>Visito el museo.</i> <i>Conozco Madrid.</i></p>",
"交通方式：en tren、a pie":"Transport: en tren, a pie",
"<p>搭交通工具用 <b>en</b>（不加冠詞）：en tren、en coche、en avión、en bicicleta、en autobús、en metro。</p><p>走路是 <b>a pie</b> 或 <b>andando</b>。</p><p>「搭」也可以用 tomar（拉丁美洲常用）或 coger（西班牙）：<i>Cojo el autobús.</i></p>":"<p>For means of transport use <b>en</b> (no article): en tren, en coche, en avión, en bicicleta, en autobús, en metro.</p><p>On foot is <b>a pie</b> or <b>andando</b>.</p><p>“Take” can also be tomar (common in Latin America) or coger (Spain): <i>Cojo el autobús.</i></p>",
"限定詞":"Determiners",
"所有格 mi、tu、su、nuestro、vuestro":"Possessives mi, tu, su, nuestro, vuestro",
"<table><tr><th></th><th>單數</th><th>複數</th></tr><tr><td>我的</td><td>mi</td><td>mis</td></tr><tr><td>你的</td><td>tu</td><td>tus</td></tr><tr><td>他／她／您／他們的</td><td>su</td><td>sus</td></tr><tr><td>我們的</td><td>nuestro／nuestra</td><td>nuestros／nuestras</td></tr><tr><td>你們的</td><td>vuestro／vuestra</td><td>vuestros／vuestras</td></tr></table><p>所有格配合<b>被擁有的東西</b>：<i>mis padres</i>（我的父母）。前面<b>不加冠詞</b>：<i>mi casa</i>（不說 la mi casa）。</p><p>tu（你的）沒有重音，tú（你）有。su 有很多意思，不清楚時說 <i>la casa de él／de usted</i>。</p>":"<table><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>my</td><td>mi</td><td>mis</td></tr><tr><td>your</td><td>tu</td><td>tus</td></tr><tr><td>his / her / your (formal) / their</td><td>su</td><td>sus</td></tr><tr><td>our</td><td>nuestro / nuestra</td><td>nuestros / nuestras</td></tr><tr><td>your (pl.)</td><td>vuestro / vuestra</td><td>vuestros / vuestras</td></tr></table><p>The possessive agrees with <b>the thing owned</b>: <i>mis padres</i> (my parents). <b>No article</b> in front: <i>mi casa</i> (not la mi casa).</p><p>tu (your) has no accent; tú (you) does. su has many meanings — if it’s unclear, say <i>la casa de él / de usted</i>.</p>",
"指示詞 este、ese、aquel":"Demonstratives este, ese, aquel",
"<table><tr><th></th><th>這（近我）</th><th>那（近你）</th><th>那（遠）</th></tr><tr><td>陽單</td><td>este</td><td>ese</td><td>aquel</td></tr><tr><td>陰單</td><td>esta</td><td>esa</td><td>aquella</td></tr><tr><td>陽複</td><td>estos</td><td>esos</td><td>aquellos</td></tr><tr><td>陰複</td><td>estas</td><td>esas</td><td>aquellas</td></tr></table><p>不知道是什麼東西時用中性 <b>esto</b>、<b>eso</b>：<i>¿Qué es esto?</i></p>":"<table><tr><th></th><th>this (near me)</th><th>that (near you)</th><th>that (far away)</th></tr><tr><td>m. sg.</td><td>este</td><td>ese</td><td>aquel</td></tr><tr><td>f. sg.</td><td>esta</td><td>esa</td><td>aquella</td></tr><tr><td>m. pl.</td><td>estos</td><td>esos</td><td>aquellos</td></tr><tr><td>f. pl.</td><td>estas</td><td>esas</td><td>aquellas</td></tr></table><p>When you don’t know what something is, use the neuter <b>esto</b>, <b>eso</b>: <i>¿Qué es esto?</i></p>",
"數字時間":"Numbers & time",
"數字 0–1000":"Numbers 0–1000",
"<p>1–10：uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez</p><p>11–15：once, doce, trece, catorce, quince；16–29 寫成一個字：dieciséis, veinte, veintiuno, veintidós…</p><p>30 以上用 y 連接：treinta y uno、cuarenta y cinco；cien（100）、ciento uno（101）、doscientos（200）、mil（1000）。</p><p>uno 在陽性名詞前變 <b>un</b>：<i>veintiún años</i>；陰性用 una：<i>una hora</i>。</p>":"<p>1–10: uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez</p><p>11–15: once, doce, trece, catorce, quince; 16–29 are written as one word: dieciséis, veinte, veintiuno, veintidós…</p><p>From 30 up, join with y: treinta y uno, cuarenta y cinco; cien (100), ciento uno (101), doscientos (200), mil (1000).</p><p>uno becomes <b>un</b> before a masculine noun: <i>veintiún años</i>; feminine uses una: <i>una hora</i>.</p>",
"幾點了？¿Qué hora es?":"What time is it? ¿Qué hora es?",
"<ul><li><i>¿Qué hora es?</i> 現在幾點？</li><li><i>Es la una.</i> 一點（單數）；<i>Son las tres.</i> 三點（複數，因為是 las horas）</li><li>3:30 <i>las tres y media</i>；2:15 <i>las dos y cuarto</i>；4:45 <i>las cinco menos cuarto</i></li><li>在幾點：<b>a las</b> ocho、<b>a la</b> una</li></ul>":"<ul><li><i>¿Qué hora es?</i> What time is it?</li><li><i>Es la una.</i> one o’clock (singular); <i>Son las tres.</i> three o’clock (plural, because it’s las horas)</li><li>3:30 <i>las tres y media</i>; 2:15 <i>las dos y cuarto</i>; 4:45 <i>las cinco menos cuarto</i></li><li>At a time: <b>a las</b> ocho, <b>a la</b> una</li></ul>",
"星期、月份、季節":"Days, months, seasons",
"<p>星期、月份都<b>小寫</b>，星期都是陽性。</p><ul><li>「在星期幾」用 <b>el</b>：<i>el lunes</i>（這個星期一）；「每個星期幾」用 <b>los</b>：<i>los lunes</i></li><li>月份用 <b>en</b>：<i>en mayo</i>；日期：<i>el 5 de mayo</i></li><li>季節用 <b>en</b>：<i>en verano</i>、<i>en invierno</i></li></ul>":"<p>Days and months are <b>lowercase</b>, and all days are masculine.</p><ul><li>“On a day” uses <b>el</b>: <i>el lunes</i> (this Monday); “every …day” uses <b>los</b>: <i>los lunes</i></li><li>Months use <b>en</b>: <i>en mayo</i>; dates: <i>el 5 de mayo</i></li><li>Seasons use <b>en</b>: <i>en verano</i>, <i>en invierno</i></li></ul>",
"天氣怎麼說":"Talking about the weather",
"<ul><li><i>¿Qué tiempo hace?</i> 天氣怎麼樣？</li><li>用 <b>hacer</b>：hace calor、hace frío、hace sol、hace viento、hace buen／mal tiempo</li><li>動詞本身：llueve（下雨）、nieva（下雪）</li><li>其他：está nublado（陰天）、hay niebla（有霧）</li></ul><p>人覺得冷熱用 tener：<i>Tengo frío.</i>；東西摸起來用 estar：<i>El café está caliente.</i></p>":"<ul><li><i>¿Qué tiempo hace?</i> What’s the weather like?</li><li>With <b>hacer</b>: hace calor, hace frío, hace sol, hace viento, hace buen / mal tiempo</li><li>Verbs on their own: llueve (it’s raining), nieva (it’s snowing)</li><li>Others: está nublado (it’s cloudy), hay niebla (it’s foggy)</li></ul><p>For a person feeling hot or cold use tener: <i>Tengo frío.</i>; for how something feels to the touch use estar: <i>El café está caliente.</i></p>",
"過去式":"Past tense",
"現在完成式：haber ＋ 過去分詞":"Present perfect: haber + past participle",
"<p>表示「做過、已經做了」，在西班牙常用來說<b>今天、這週、到目前為止</b>的事：<b>haber 現在式＋過去分詞</b>。</p><p>過去分詞：-ar → <b>-ado</b>、-er／-ir → <b>-ido</b>（hablado、comido、vivido）。分詞<b>不用配合主詞</b>。</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">he comido</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">hemos comido</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">has comido</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">habéis comido</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">ha comido</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">han comido</span></td></tr></table><p>常見不規則分詞：hecho（hacer）、dicho（decir）、visto（ver）、escrito、abierto、puesto、vuelto、roto。</p><p>拉丁美洲比較常用簡單過去式（comí、fui），A1 先學這個完成式。</p>":"<p>To say “did / have done”. In Spain it’s used a lot for things <b>today, this week, so far</b>: <b>present of haber + past participle</b>.</p><p>Past participles: -ar → <b>-ado</b>, -er / -ir → <b>-ido</b> (hablado, comido, vivido). The participle <b>doesn’t agree</b> with the subject.</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">he comido</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">hemos comido</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">has comido</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">habéis comido</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">ha comido</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">han comido</span></td></tr></table><p>Common irregular participles: hecho (hacer), dicho (decir), visto (ver), escrito, abierto, puesto, vuelto, roto.</p><p>Latin America uses the simple past (comí, fui) more often; at A1 learn this perfect first.</p>",
"estar ＋ 副動詞（正在做…）":"estar + gerund (be doing…)",
"<p>強調「此刻正在」：<b>estar ＋ 副動詞</b>。</p><p>副動詞：-ar → <b>-ando</b>、-er／-ir → <b>-iendo</b>（hablando、comiendo、viviendo）。</p><ul><li>母音後面變 -yendo：leer → leyendo、oír → oyendo</li><li>-ir 的詞幹變化動詞：dormir → durmiendo、pedir → pidiendo</li></ul><p><i>Está lloviendo.</i> 正在下雨。</p>":"<p>To stress “right now”: <b>estar + gerund</b>.</p><p>Gerunds: -ar → <b>-ando</b>, -er / -ir → <b>-iendo</b> (hablando, comiendo, viviendo).</p><ul><li>After a vowel it becomes -yendo: leer → leyendo, oír → oyendo</li><li>Stem-changing -ir verbs: dormir → durmiendo, pedir → pidiendo</li></ul><p><i>Está lloviendo.</i> It’s raining.</p>",
"命令式（¡Abre la ventana!）":"Imperative (¡Abre la ventana!)",
"<table><tr><th></th><th>-ar（hablar）</th><th>-er（comer）</th><th>-ir（abrir）</th></tr><tr><td>tú<span class=\"zg\">你</span></td><td>habla</td><td>come</td><td>abre</td></tr><tr><td>usted<span class=\"zg\">您</span></td><td>hable</td><td>coma</td><td>abra</td></tr><tr><td>nosotros<span class=\"zg\">我們</span></td><td>hablemos</td><td>comamos</td><td>abramos</td></tr><tr><td>vosotros<span class=\"zg\">你們</span></td><td>hablad</td><td>comed</td><td>abrid</td></tr></table><p>tú 的形＝現在式 él 的形；usted 的形「母音交換」（-ar 用 e，-er／-ir 用 a）。</p><p>不規則 tú：ven、haz、pon、sal、ten、di、ve（ir）、sé（ser）。</p><p>對 usted 問路、點餐很好用：<i>Siga todo recto. Gire a la derecha.</i></p>":"<table><tr><th></th><th>-ar (hablar)</th><th>-er (comer)</th><th>-ir (abrir)</th></tr><tr><td>tú<span class=\"zg\">you</span></td><td>habla</td><td>come</td><td>abre</td></tr><tr><td>usted<span class=\"zg\">you (formal)</span></td><td>hable</td><td>coma</td><td>abra</td></tr><tr><td>nosotros<span class=\"zg\">we</span></td><td>hablemos</td><td>comamos</td><td>abramos</td></tr><tr><td>vosotros<span class=\"zg\">you (pl.)</span></td><td>hablad</td><td>comed</td><td>abrid</td></tr></table><p>The tú form = the present-tense él form; the usted form “swaps the vowel” (-ar uses e, -er / -ir use a).</p><p>Irregular tú forms: ven, haz, pon, sal, ten, di, ve (ir), sé (ser).</p><p>Very handy with usted for directions and ordering: <i>Siga todo recto. Gire a la derecha.</i></p>",
"敬稱 usted（您）":"Formal usted (you)",
"<p>對陌生人、店員、長輩用 <b>usted</b>（您），動詞用<b>第三人稱單數</b>：</p><ul><li><i>¿Cómo está usted?</i>（您好嗎）↔ <i>¿Cómo estás?</i>（你好嗎）</li><li><i>Perdone</i>（對您）↔ <i>Perdona</i>（對你）</li><li><i>¿Puede repetir?</i> 您可以再說一次嗎？</li></ul><p>複數 <b>ustedes</b>（您們）。在拉丁美洲 ustedes 也是一般的「你們」，不用 vosotros。西班牙年輕人之間很快就改用 tú。</p>":"<p>With strangers, shop staff and older people use <b>usted</b> (formal “you”), with the verb in the <b>third person singular</b>:</p><ul><li><i>¿Cómo está usted?</i> (How are you? – formal) ↔ <i>¿Cómo estás?</i> (How are you? – informal)</li><li><i>Perdone</i> (to usted) ↔ <i>Perdona</i> (to tú)</li><li><i>¿Puede repetir?</i> Could you say that again?</li></ul><p>The plural is <b>ustedes</b>. In Latin America ustedes is also the everyday “you (pl.)” and vosotros isn’t used. Among young people in Spain, people switch to tú very quickly.</p>",
"比較 más／menos … que":"Comparisons más / menos … que",
"<ul><li>A es <b>más</b> + 形容詞 + <b>que</b> B：<i>Él es más alto que yo.</i>（他比我高）</li><li>A es <b>menos</b> + 形容詞 + <b>que</b> B</li><li>一樣：<b>tan</b> + 形容詞 + <b>como</b>：<i>Es tan alto como su padre.</i></li></ul><p>特別形：bueno → <b>mejor</b>、malo → <b>peor</b>、年紀大 → <b>mayor</b>、年紀小 → <b>menor</b>。</p>":"<ul><li>A es <b>más</b> + adjective + <b>que</b> B: <i>Él es más alto que yo.</i> (He’s taller than me.)</li><li>A es <b>menos</b> + adjective + <b>que</b> B</li><li>As … as: <b>tan</b> + adjective + <b>como</b>: <i>Es tan alto como su padre.</i></li></ul><p>Special forms: bueno → <b>mejor</b>, malo → <b>peor</b>, older → <b>mayor</b>, younger → <b>menor</b>.</p>",
"muy 和 mucho":"muy and mucho",
"<ul><li><b>muy</b>（很）修飾形容詞、副詞，不變化：<i>Es muy bonito.</i> <i>Muy bien.</i></li><li><b>mucho</b> 修飾動詞時不變化：<i>Trabajo mucho.</i></li><li><b>mucho</b> 修飾名詞時要配合：<i>mucha gente</i>、<i>muchos turistas</i>、<i>muchas gracias</i></li><li><i>un poco (de)</i> 一點點：<i>Hablo un poco de español.</i></li></ul><p>常見錯誤：「非常多」不說 muy mucho，說 <i>muchísimo</i>。</p>":"<ul><li><b>muy</b> (very) describes adjectives and adverbs and doesn’t change: <i>Es muy bonito.</i> <i>Muy bien.</i></li><li><b>mucho</b> doesn’t change when it describes a verb: <i>Trabajo mucho.</i></li><li><b>mucho</b> agrees when it describes a noun: <i>mucha gente</i>, <i>muchos turistas</i>, <i>muchas gracias</i></li><li><i>un poco (de)</i> a little: <i>Hablo un poco de español.</i></li></ul><p>Common mistake: “very much” isn’t muy mucho — it’s <i>muchísimo</i>.</p>",
"禮貌請求 quisiera、me gustaría、¿me pone…?":"Polite requests quisiera, me gustaría, ¿me pone…?",
"<p>點餐、購物時比 quiero 客氣的說法：</p><ul><li><i>Quisiera una mesa para dos.</i> 我想要一張兩人桌。</li><li><i>Me gustaría reservar una habitación.</i> 我想訂一間房。</li><li><i>¿Podría repetir, por favor?</i> 您可以再說一次嗎？</li></ul><p>在西班牙的酒吧也常聽到 <i>¿Me pone un café?</i>（給我一杯咖啡好嗎）。A1 先當成固定說法記住。</p>":"<p>More polite than quiero when ordering or shopping:</p><ul><li><i>Quisiera una mesa para dos.</i> I’d like a table for two.</li><li><i>Me gustaría reservar una habitación.</i> I’d like to book a room.</li><li><i>¿Podría repetir, por favor?</i> Could you say that again, please?</li></ul><p>In bars in Spain you’ll also often hear <i>¿Me pone un café?</i> (Could I have a coffee?). At A1 just learn these as set phrases.</p>",
"連接詞 y、o、pero、porque、cuando、si":"Conjunctions y, o, pero, porque, cuando, si",
"<table><tr><td>y 和</td><td>o 或</td><td>pero 但是</td></tr><tr><td>porque 因為</td><td>cuando 當…的時候</td><td>si 如果</td></tr><tr><td>entonces 那麼、所以</td><td>también 也</td><td>tampoco 也不</td></tr></table><p>y 在 i、hi 開頭的字前變 <b>e</b>：<i>español e inglés</i>；o 在 o、ho 開頭的字前變 <b>u</b>：<i>siete u ocho</i>。</p><p>si（如果）沒有重音；sí（是的）有。</p>":"<table><tr><td>y and</td><td>o or</td><td>pero but</td></tr><tr><td>porque because</td><td>cuando when</td><td>si if</td></tr><tr><td>entonces then, so</td><td>también also</td><td>tampoco neither</td></tr></table><p>y becomes <b>e</b> before words starting with i or hi: <i>español e inglés</i>; o becomes <b>u</b> before words starting with o or ho: <i>siete u ocho</i>.</p><p>si (if) has no accent; sí (yes) does.</p>",
"頻率：siempre、a menudo、a veces、nunca":"Frequency: siempre, a menudo, a veces, nunca",
"<p>從多到少：<b>siempre</b>（總是）→ <b>normalmente</b>（通常）→ <b>a menudo</b>（常常）→ <b>a veces</b>（有時）→ <b>nunca</b>（從不）</p><p>每天：<i>cada día</i>／<i>todos los días</i>；一週兩次：<i>dos veces a la semana</i></p>":"<p>From most to least: <b>siempre</b> (always) → <b>normalmente</b> (usually) → <b>a menudo</b> (often) → <b>a veces</b> (sometimes) → <b>nunca</b> (never)</p><p>Every day: <i>cada día</i> / <i>todos los días</i>; twice a week: <i>dos veces a la semana</i></p>",
"「一般人」的 se：¿Cómo se dice?":"Impersonal se: ¿Cómo se dice?",
"<p><b>se</b> ＋ 第三人稱動詞，表示「一般人、大家」或「被…」：</p><ul><li><i>¿Cómo se dice «gracias» en español?</i> 「謝謝」用西班牙文怎麼說？</li><li><i>Aquí no se puede fumar.</i> 這裡不能抽菸。</li><li><i>Se habla español.</i> 這裡說西班牙文。</li></ul>":"<p><b>se</b> + third-person verb means “people, one, you (in general)” or a passive “is …ed”:</p><ul><li><i>¿Cómo se dice «gracias» en español?</i> How do you say “thank you” in Spanish?</li><li><i>Aquí no se puede fumar.</i> You can’t smoke here.</li><li><i>Se habla español.</i> Spanish is spoken here.</li></ul>",
"代名詞":"Pronouns",
"受詞代名詞 me、te、lo、la（Te llamo.）":"Object pronouns me, te, lo, la (Te llamo.)",
"<p>代名詞放在<b>變化過的動詞前面</b>：</p><ul><li><i>Te llamo esta noche.</i> 我今晚打給你。</li><li><i>¿Me ayudas?</i> 你可以幫我嗎？</li><li><i>Lo compro.</i> 我買它（陽性東西）／<i>La compro.</i>（陰性東西）</li></ul><p>和原形、命令式一起時黏在後面：<i>Quiero comprarlo.</i> <i>¡Dímelo!</i></p>":"<p>The pronoun goes <b>before the conjugated verb</b>:</p><ul><li><i>Te llamo esta noche.</i> I’ll call you tonight.</li><li><i>¿Me ayudas?</i> Can you help me?</li><li><i>Lo compro.</i> I’ll buy it (a masculine thing) / <i>La compro.</i> (a feminine thing)</li></ul><p>With an infinitive or imperative it attaches to the end: <i>Quiero comprarlo.</i> <i>¡Dímelo!</i></p>",

"g 的兩種唸法":"Two ways to say g",
"g 在 a、o、u 前面是 [g]；在 e、i 前面是喉嚨的 [x]（和 j 一樣）。想在 e、i 前保留 [g]，就寫 gue、gui（u 不唸）。":"g is [g] before a, o, u; before e, i it’s a throaty [x] (same as j). To keep [g] before e or i, write gue, gui (the u is silent).",

"z 與 ce、ci（西班牙 vs 拉丁美洲）":"z and ce, ci (Spain vs. Latin America)",
"西班牙本土：z、ce、ci 唸咬舌的 [θ]，s 唸 [s]，所以 casa（房子）和 caza（打獵）不同。拉丁美洲和加那利群島：都唸 [s]（seseo）。兩種都是標準發音。":"In Spain: z, ce, ci are a lisped [θ] and s is [s], so casa (house) and caza (hunting) are different. In Latin America and the Canary Islands both are [s] (seseo). Both are standard pronunciations.",
"重音的位置":"Where the stress falls",
"母音、n、s 結尾的字，重音在<b>倒數第二音節</b>：ca-sa、jo-ven、lu-nes。其他子音結尾的，重音在<b>最後一音節</b>：ha-blar、ciu-dad、es-pa-ñol。不符合這兩條的，就寫重音符號：café、canción、árbol、música。":"Words ending in a vowel, n or s are stressed on the <b>second-to-last syllable</b>: ca-sa, jo-ven, lu-nes. Words ending in any other consonant are stressed on the <b>last syllable</b>: ha-blar, ciu-dad, es-pa-ñol. Anything that breaks these two rules gets an accent mark: café, canción, árbol, música.",

"<h3 class=\"gb-h\">名詞的性別</h3><p>每個名詞都有性別：陽性（m）或陰性（f）。大部分可以從字尾猜：</p><ul><li><b>-o</b> 通常是陽性：el libro、el niño</li><li><b>-a</b> 通常是陰性：la casa、la niña</li><li><b>-ción、-sión、-dad、-tad、-tud</b> 是陰性：la canción、la ciudad</li><li><b>-e</b> 和子音結尾兩種都有，要一起背：el coche、la noche、el sol、la flor</li></ul><p>常見例外：<b>la mano</b>、<b>la foto</b>、<b>la moto</b>、<b>la radio</b>（陰性）；<b>el día</b>、<b>el mapa</b>、<b>el problema</b>、<b>el idioma</b>、<b>el programa</b>（陽性，很多 -ma 結尾的字來自希臘文）。</p><h3 class=\"gb-h\">名詞的複數</h3><table><tr><th>單數</th><th>複數</th><th>例子</th></tr><tr><td>母音結尾</td><td>加 -s</td><td>libro → libros、café → cafés</td></tr><tr><td>子音結尾</td><td>加 -es</td><td>ciudad → ciudades、flor → flores</td></tr><tr><td>-z</td><td>-ces</td><td>lápiz → lápices、vez → veces</td></tr><tr><td>-s（重音不在最後）</td><td>不變</td><td>el lunes → los lunes</td></tr></table><p><b>重音符號會跑掉或冒出來</b>，因為重音位置不能變：canción → canc<b>io</b>nes（拿掉）、examen → ex<b>á</b>menes（加上）、joven → j<b>ó</b>venes。</p><p>陽性複數可以包含男女：<i>los padres</i>＝父母、<i>los hermanos</i>＝兄弟姊妹。</p>":"<h3 class=\"gb-h\">Noun gender</h3><p>Every noun has a gender: masculine (m) or feminine (f). You can usually guess from the ending:</p><ul><li><b>-o</b> is usually masculine: el libro, el niño</li><li><b>-a</b> is usually feminine: la casa, la niña</li><li><b>-ción, -sión, -dad, -tad, -tud</b> are feminine: la canción, la ciudad</li><li><b>-e</b> and consonant endings can be either — learn them with the noun: el coche, la noche, el sol, la flor</li></ul><p>Common exceptions: <b>la mano</b>, <b>la foto</b>, <b>la moto</b>, <b>la radio</b> (feminine); <b>el día</b>, <b>el mapa</b>, <b>el problema</b>, <b>el idioma</b>, <b>el programa</b> (masculine — many -ma words come from Greek).</p><h3 class=\"gb-h\">Noun plurals</h3><table><tr><th>Singular</th><th>Plural</th><th>Example</th></tr><tr><td>Ends in a vowel</td><td>add -s</td><td>libro → libros, café → cafés</td></tr><tr><td>Ends in a consonant</td><td>add -es</td><td>ciudad → ciudades, flor → flores</td></tr><tr><td>-z</td><td>-ces</td><td>lápiz → lápices, vez → veces</td></tr><tr><td>-s (stress not on the last syllable)</td><td>no change</td><td>el lunes → los lunes</td></tr></table><p><b>Accent marks can disappear or appear</b>, because the stress has to stay in the same place: canción → canc<b>io</b>nes (dropped), examen → ex<b>á</b>menes (added), joven → j<b>ó</b>venes.</p><p>A masculine plural can include both sexes: <i>los padres</i> = parents, <i>los hermanos</i> = brothers and sisters.</p>",
"<h3 class=\"gb-h\">定冠詞 el, la, los, las</h3><p>西班牙文的名詞前面常常要加冠詞。定冠詞（＝英文 the）只看<b>性別</b>和<b>單複數</b>，比義大利文簡單：</p><table><tr><th></th><th>單數</th><th>複數</th></tr><tr><td>陽性</td><td>el libro</td><td>los libros</td></tr><tr><td>陰性</td><td>la casa</td><td>las casas</td></tr></table><p>特例：重音落在開頭 a／ha 的陰性單數字，用 <b>el</b> 比較好唸：<i>el agua</i>、<i>el aula</i>（但複數還是 <i>las aguas</i>，形容詞也照陰性：<i>el agua fría</i>）。</p><p>和英文不同，說「一般的、整體的」也要加冠詞：<i>Me gusta <b>el</b> café.</i>（我喜歡咖啡）</p><h3 class=\"gb-h\">不定冠詞 un, una, unos, unas</h3><p>不定冠詞＝英文 a／an，表示「一個」；複數 unos／unas 是「一些、幾個」。</p><table><tr><th></th><th>單數</th><th>複數</th></tr><tr><td>陽性</td><td>un libro</td><td>unos libros</td></tr><tr><td>陰性</td><td>una casa</td><td>unas casas</td></tr></table><p>說職業、國籍時通常不加：<i>Soy estudiante.</i>（我是學生）</p>":"<h3 class=\"gb-h\">Definite articles el, la, los, las</h3><p>Spanish nouns often need an article in front. The definite article (= English “the”) depends only on <b>gender</b> and <b>number</b> — simpler than Italian:</p><table><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>Masculine</td><td>el libro</td><td>los libros</td></tr><tr><td>Feminine</td><td>la casa</td><td>las casas</td></tr></table><p>Special case: feminine singular words starting with a stressed a / ha take <b>el</b> because it’s easier to say: <i>el agua</i>, <i>el aula</i> (but the plural is still <i>las aguas</i>, and adjectives stay feminine: <i>el agua fría</i>).</p><p>Unlike English, you also use the article to talk about something in general: <i>Me gusta <b>el</b> café.</i> (I like coffee.)</p><h3 class=\"gb-h\">Indefinite articles un, una, unos, unas</h3><p>The indefinite article = English “a / an”, meaning “one”; the plural unos / unas means “some, a few”.</p><table><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>Masculine</td><td>un libro</td><td>unos libros</td></tr><tr><td>Feminine</td><td>una casa</td><td>unas casas</td></tr></table><p>It’s usually left out with jobs and nationalities: <i>Soy estudiante.</i> (I’m a student.)</p>",
"<h3 class=\"gb-h\">形容詞的位置與配合</h3><p>形容詞要跟名詞的<b>性別和單複數一致</b>，通常放在名詞<b>後面</b>。</p><table><tr><th></th><th>-o 型</th><th>-e／子音型</th></tr><tr><td>陽性單數</td><td>un chico alto</td><td>un libro interesante</td></tr><tr><td>陰性單數</td><td>una chica alta</td><td>una ciudad interesante</td></tr><tr><td>陽性複數</td><td>chicos altos</td><td>libros fáciles</td></tr><tr><td>陰性複數</td><td>chicas altas</td><td>ciudades fáciles</td></tr></table><p>國籍形容詞子音結尾也有陰性：español → española、alemán → alemana。</p><p>bueno、malo 在陽性單數名詞前變 <b>buen</b>、<b>mal</b>：<i>un buen día</i>；grande 在單數名詞前變 <b>gran</b>：<i>una gran ciudad</i>（＝很棒的城市）。</p><p>-z 結尾複數變 -ces：feliz → felices。重音符號跟名詞一樣會變：alemán → alemanes、joven → jóvenes。</p>":"<h3 class=\"gb-h\">Adjective position and agreement</h3><p>Adjectives must <b>agree in gender and number</b> with the noun, and usually go <b>after</b> it.</p><table><tr><th></th><th>-o type</th><th>-e / consonant type</th></tr><tr><td>Masculine singular</td><td>un chico alto</td><td>un libro interesante</td></tr><tr><td>Feminine singular</td><td>una chica alta</td><td>una ciudad interesante</td></tr><tr><td>Masculine plural</td><td>chicos altos</td><td>libros fáciles</td></tr><tr><td>Feminine plural</td><td>chicas altas</td><td>ciudades fáciles</td></tr></table><p>Nationality adjectives ending in a consonant also have a feminine form: español → española, alemán → alemana.</p><p>bueno and malo become <b>buen</b> and <b>mal</b> before a masculine singular noun: <i>un buen día</i>; grande becomes <b>gran</b> before any singular noun: <i>una gran ciudad</i> (= a great city).</p><p>Adjectives ending in -z change to -ces in the plural: feliz → felices. Accent marks shift just as with nouns: alemán → alemanes, joven → jóvenes.</p>",
"<h3 class=\"gb-h\">現在式：-ar 規則動詞</h3><p>去掉 -ar，加上詞尾（以 hablar 為例）：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">habl<b>o</b></span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">habl<b>amos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">habl<b>as</b></span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">habl<b>áis</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">habl<b>a</b></span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">habl<b>an</b></span></td></tr></table><p>動詞形已經看得出主詞，所以主詞常常省略：<i>Hablo español.</i>（我說西班牙文）</p>":"<h3 class=\"gb-h\">Present tense: regular -ar verbs</h3><p>Drop -ar and add the endings (using hablar):</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">habl<b>o</b></span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">habl<b>amos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">habl<b>as</b></span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">habl<b>áis</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">habl<b>a</b></span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">habl<b>an</b></span></td></tr></table><p>The verb form already shows the subject, so the subject is often left out: <i>Hablo español.</i> (I speak Spanish.)</p>",
"<h3 class=\"gb-h\">現在式：-er 規則動詞</h3><p>以 comer 為例：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">com<b>o</b></span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">com<b>emos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">com<b>es</b></span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">com<b>éis</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">com<b>e</b></span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">com<b>en</b></span></td></tr></table><p>拼字小規則：-cer 前面是母音的，yo 變 <b>-zco</b>：conocer → cono<b>zco</b>；-ger 的 yo 變 <b>-jo</b>：coger → co<b>jo</b>。</p><h3 class=\"gb-h\">現在式：-ir 規則動詞</h3><p>以 vivir 為例：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">viv<b>o</b></span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">viv<b>imos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">viv<b>es</b></span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">viv<b>ís</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">viv<b>e</b></span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">viv<b>en</b></span></td></tr></table><p>和 -er 只差 nosotros（-imos）和 vosotros（-ís）。</p>":"<h3 class=\"gb-h\">Present tense: regular -er verbs</h3><p>Using comer:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">com<b>o</b></span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">com<b>emos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">com<b>es</b></span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">com<b>éis</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">com<b>e</b></span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">com<b>en</b></span></td></tr></table><p>Spelling tip: verbs in -cer after a vowel change yo to <b>-zco</b>: conocer → cono<b>zco</b>; -ger verbs change yo to <b>-jo</b>: coger → co<b>jo</b>.</p><h3 class=\"gb-h\">Present tense: regular -ir verbs</h3><p>Using vivir:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">viv<b>o</b></span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">viv<b>imos</b></span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">viv<b>es</b></span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">viv<b>ís</b></span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">viv<b>e</b></span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">viv<b>en</b></span></td></tr></table><p>The only differences from -er are nosotros (-imos) and vosotros (-ís).</p>",
"<h3 class=\"gb-h\">詞幹變化 e → ie（pensar → pienso）</h3><p>有些動詞在<b>重音落在詞幹</b>時，e 變成 ie。nosotros、vosotros 重音在詞尾，所以不變——畫出來像一隻「靴子」：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">p<b>ie</b>nso</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">pensamos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">p<b>ie</b>nsas</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">pensáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">p<b>ie</b>nsa</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">p<b>ie</b>nsan</span></td></tr></table><p>常見：pensar、empezar、cerrar、querer、entender、perder、preferir、sentir、despertarse。哪些動詞會變要一個一個記，App 的變化表都有標。</p><h3 class=\"gb-h\">詞幹變化 o → ue（poder → puedo）</h3><p>規則和 e → ie 一樣，只有 nosotros、vosotros 不變：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">v<b>ue</b>lvo</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">volvemos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">v<b>ue</b>lves</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">volvéis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">v<b>ue</b>lve</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">v<b>ue</b>lven</span></td></tr></table><p>常見：poder、volver、dormir、encontrar、costar、recordar、acostarse、llover、doler。</p><p>特例 <b>jugar</b> 是 u → ue：j<b>ue</b>go, j<b>ue</b>gas, j<b>ue</b>ga, jugamos, jugáis, j<b>ue</b>gan。</p><h3 class=\"gb-h\">詞幹變化 e → i（pedir → pido）</h3><p>只出現在 -ir 動詞：</p><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">p<b>i</b>do</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">pedimos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">p<b>i</b>des</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">pedís</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">p<b>i</b>de</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">p<b>i</b>den</span></td></tr></table><p>常見：pedir、repetir、vestirse、seguir（sigo）。</p>":"<h3 class=\"gb-h\">Stem change e → ie (pensar → pienso)</h3><p>In some verbs, e becomes ie <b>when the stress falls on the stem</b>. In nosotros and vosotros the stress is on the ending, so they don’t change — drawn out, it looks like a “boot”:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">p<b>ie</b>nso</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">pensamos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">p<b>ie</b>nsas</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">pensáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">p<b>ie</b>nsa</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">p<b>ie</b>nsan</span></td></tr></table><p>Common ones: pensar, empezar, cerrar, querer, entender, perder, preferir, sentir, despertarse. Which verbs change has to be learned one by one; the app’s forms tables mark them.</p><h3 class=\"gb-h\">Stem change o → ue (poder → puedo)</h3><p>Same rule as e → ie — only nosotros and vosotros stay the same:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">v<b>ue</b>lvo</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">volvemos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">v<b>ue</b>lves</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">volvéis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">v<b>ue</b>lve</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">v<b>ue</b>lven</span></td></tr></table><p>Common ones: poder, volver, dormir, encontrar, costar, recordar, acostarse, llover, doler.</p><p>Special case: <b>jugar</b> changes u → ue: j<b>ue</b>go, j<b>ue</b>gas, j<b>ue</b>ga, jugamos, jugáis, j<b>ue</b>gan.</p><h3 class=\"gb-h\">Stem change e → i (pedir → pido)</h3><p>Only happens in -ir verbs:</p><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">p<b>i</b>do</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">pedimos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">p<b>i</b>des</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">pedís</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">p<b>i</b>de</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">p<b>i</b>den</span></td></tr></table><p>Common ones: pedir, repetir, vestirse, seguir (sigo).</p>",
"<h3 class=\"gb-h\">動詞 ser（是）</h3><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">soy</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">somos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">eres</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">sois</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">es</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">son</span></td></tr></table><p>用來說<b>本質、不太會變的事</b>：身分、職業、國籍、來源、個性、外表、時間、價錢總額。</p><p><i>Soy taiwanés.</i>（我是台灣人）<i>Es profesora.</i>（她是老師）<i>Son las tres.</i>（三點了）</p><h3 class=\"gb-h\">動詞 estar（在、處於…狀態）</h3><table class=\"conj\"><tr><th>一個人</th><th>好幾個人</th></tr><tr><td><span class=\"pn\">yo<i>我</i></span><span class=\"vf\">estoy</span></td><td><span class=\"pn\">nosotros<i>我們</i></span><span class=\"vf\">estamos</span></td></tr><tr><td><span class=\"pn\">tú<i>你</i></span><span class=\"vf\">estás</span></td><td><span class=\"pn\">vosotros<i>你們</i></span><span class=\"vf\">estáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>他／她／您</i></span><span class=\"vf\">está</span></td><td><span class=\"pn\">ellos/ustedes<i>他們／您們</i></span><span class=\"vf\">están</span></td></tr></table><p>用來說<b>位置</b>和<b>暫時的狀態、心情</b>：</p><p><i>¿Dónde está el baño?</i>（廁所在哪）<i>Estoy cansado.</i>（我累了）<i>¿Cómo estás?</i>（你好嗎）</p><h3 class=\"gb-h\">ser 和 estar 怎麼分</h3><table><tr><th>ser</th><th>estar</th></tr><tr><td>是什麼、什麼樣的人／東西</td><td>在哪裡、現在怎麼樣</td></tr><tr><td><i>Es alto.</i> 他個子高</td><td><i>Está cansado.</i> 他累了</td></tr><tr><td><i>Es aburrido.</i> 他很無聊（個性）</td><td><i>Está aburrido.</i> 他覺得無聊</td></tr><tr><td><i>La sopa es rica.</i>（少用）</td><td><i>La sopa está rica.</i> 湯（現在吃起來）很好喝</td></tr></table><p>位置一律用 estar：<i>Madrid está en España.</i> 但「活動在哪裡舉行」用 ser：<i>La fiesta es en mi casa.</i></p><p>bien／mal 配 estar：<i>Estoy bien.</i></p>":"<h3 class=\"gb-h\">The verb ser (to be)</h3><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">soy</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">somos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">eres</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">sois</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">es</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">son</span></td></tr></table><p>Used for <b>what something is, things that don’t really change</b>: identity, job, nationality, origin, personality, looks, time, total price.</p><p><i>Soy taiwanés.</i> (I’m Taiwanese.) <i>Es profesora.</i> (She’s a teacher.) <i>Son las tres.</i> (It’s three o’clock.)</p><h3 class=\"gb-h\">The verb estar (to be — location, state)</h3><table class=\"conj\"><tr><th>One person</th><th>Several people</th></tr><tr><td><span class=\"pn\">yo<i>I</i></span><span class=\"vf\">estoy</span></td><td><span class=\"pn\">nosotros<i>we</i></span><span class=\"vf\">estamos</span></td></tr><tr><td><span class=\"pn\">tú<i>you</i></span><span class=\"vf\">estás</span></td><td><span class=\"pn\">vosotros<i>you (pl.)</i></span><span class=\"vf\">estáis</span></td></tr><tr><td><span class=\"pn\">él/ella/usted<i>he / she / you (formal)</i></span><span class=\"vf\">está</span></td><td><span class=\"pn\">ellos/ustedes<i>they / you (pl. formal)</i></span><span class=\"vf\">están</span></td></tr></table><p>Used for <b>location</b> and <b>temporary states and moods</b>:</p><p><i>¿Dónde está el baño?</i> (Where’s the bathroom?) <i>Estoy cansado.</i> (I’m tired.) <i>¿Cómo estás?</i> (How are you?)</p><h3 class=\"gb-h\">ser vs. estar</h3><table><tr><th>ser</th><th>estar</th></tr><tr><td>What it is, what kind of person / thing</td><td>Where it is, how it is right now</td></tr><tr><td><i>Es alto.</i> He’s tall</td><td><i>Está cansado.</i> He’s tired</td></tr><tr><td><i>Es aburrido.</i> He’s boring (personality)</td><td><i>Está aburrido.</i> He’s bored</td></tr><tr><td><i>La sopa es rica.</i> (less common)</td><td><i>La sopa está rica.</i> The soup tastes good (right now)</td></tr></table><p>Location always uses estar: <i>Madrid está en España.</i> But “where an event takes place” uses ser: <i>La fiesta es en mi casa.</i></p><p>bien / mal go with estar: <i>Estoy bien.</i></p>",
"<h3 class=\"gb-h\">yo 形不規則：hago、pongo、salgo、conozco</h3><p>有一群動詞只有 yo 的形特別，其他照規則：</p><table><tr><td>hacer → <b>hago</b></td><td>poner → <b>pongo</b></td></tr><tr><td>salir → <b>salgo</b></td><td>traer → <b>traigo</b></td></tr><tr><td>conocer → <b>conozco</b></td><td>conducir → <b>conduzco</b></td></tr><tr><td>ver → <b>veo</b></td><td>saber → <b>sé</b>、dar → <b>doy</b></td></tr></table><p>tener、venir、decir 是 yo 加 -go <b>而且</b>詞幹也會變：tengo／tienes、vengo／vienes、digo／dices。</p><h3 class=\"gb-h\">poder、querer、deber、tener que ＋ 原形</h3><table><tr><th></th><th>poder 能</th><th>querer 想要</th><th>deber 應該</th></tr><tr><td>yo<span class=\"zg\">我</span></td><td>puedo</td><td>quiero</td><td>debo</td></tr><tr><td>tú<span class=\"zg\">你</span></td><td>puedes</td><td>quieres</td><td>debes</td></tr><tr><td>él/ella</td><td>puede</td><td>quiere</td><td>debe</td></tr><tr><td>nosotros<span class=\"zg\">我們</span></td><td>podemos</td><td>queremos</td><td>debemos</td></tr><tr><td>vosotros<span class=\"zg\">你們</span></td><td>podéis</td><td>queréis</td><td>debéis</td></tr><tr><td>ellos</td><td>pueden</td><td>quieren</td><td>deben</td></tr></table><p>後面直接接<b>原形動詞</b>：<i>¿Puedo entrar?</i> <i>Quiero aprender español.</i></p><p>「必須」常說 <b>tener que</b> ＋ 原形：<i>Tengo que trabajar.</i></p><p>ir（去）完全不規則：voy, vas, va, vamos, vais, van。</p>":"<h3 class=\"gb-h\">Irregular yo forms: hago, pongo, salgo, conozco</h3><p>A group of verbs is irregular only in the yo form; the rest follows the rules:</p><table><tr><td>hacer → <b>hago</b></td><td>poner → <b>pongo</b></td></tr><tr><td>salir → <b>salgo</b></td><td>traer → <b>traigo</b></td></tr><tr><td>conocer → <b>conozco</b></td><td>conducir → <b>conduzco</b></td></tr><tr><td>ver → <b>veo</b></td><td>saber → <b>sé</b>, dar → <b>doy</b></td></tr></table><p>tener, venir and decir add -go in the yo form <b>and</b> change the stem: tengo / tienes, vengo / vienes, digo / dices.</p><h3 class=\"gb-h\">poder, querer, deber, tener que + infinitive</h3><table><tr><th></t // 讓 WORDS 跟 S 裡的「我的單字」一致（啟動、存檔、從雲端或別的分頁合併進來之後都要跑）；有變動回傳 true
function syncMine() {
  const want = {};

  let changed = false;
  const drop = (arr, id) => { const i = arr.findIndex(x => (x.id || x) === id); if (i >= 0) arr.splice(i, 1); };
  for (const w of WORDS.filter(w => w.custom && !want[w.id])) { drop(WORDS, w.id); drop(ORDER, w.id); drop(ALL_IDS, w.id); delete WMAP[w.id]; changed = true; }
  for (const id in want) {
    const nw = myWord(id, want[id]), old = WMAP[id];
    if (!old) { WORDS.push(nw); ORDER.unshift(nw); ALL_IDS.push(id); WMAP[id] = nw; changed = true; }

const ORDER = (() => {

  WORDS.forEach(w => (w.pos === 'expr' ? g.expr : g[w.pg]).push(w));
  const out = g.expr.slice(), lists = [g.n, g.v, g.adj, g.o, g.n, g.v], idx = lists.map(() => 0), used = new Set();
  let added = true;
  while (added) {

    lists.forEach((L, i) => {
      while (idx[i] < L.length && used.has(L[idx[i]].id)) idx[i]++;

})();

// ================= 語音（日文頁和語言頁共用：n5src/shared/voice.js） =================
// build.js 會把這個檔複製進兩邊的頁面（見 lib-tab.js 開頭的說明）。
// 用瀏覽器內建的語音（speechSynthesis）念單字和句子。各語言怎麼挑聲音由 PAGE.voice 提供：
//   GOOD 比較自然的語音名稱、match(v) 這個語言的語音、score(v) 越高越好、robotic(v) 聽起來很機械（可省略）、
//   saved()／save(uri) 使用者選的語音、text(t) 念之前整理文字（可省略）、uLang(v) 要念的語言代碼、
//   label 設定裡的標題、none 沒有語音時的說明、help(opts) 語音不好時的建議、note 設定說明、sample 試聽的句子
const Voice = {
  list: [], ok: 'speechSynthesis' in window,
  get GOOD() { return PAGE.voice.GOOD; },
  score(v) { return PAGE.voice.score(v); },
  refresh() { if (!this.ok) return; try { this.list = speechSynthesis.getVoices().filter(v => PAGE.voice.match(v)); } catch (e) { this.list = []; } },
  init() {
    if (!this.ok) return;
    const load = () => { this.refresh(); if (UI.tab === 'lib') renderVoiceBox(); };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  best() {
    if (!this.list.length) this.refresh();
    const saved = PAGE.voice.saved();
    if (saved) { const v = this.list.find(x => x.voiceURI === saved || x.name === saved); if (v) return v; }
    return this.list.slice().sort((a, b) => this.score(b) - this.score(a))[0] || null;
  },
  allRobotic() { const R = PAGE.voice.robotic; return !!R && this.list.length > 0 && this.list.every(R); },
  // voiceOverride：指定用哪個聲音；rate：指定速度（例如慢速播放），沒給就用設定
  speak(text, voiceOverride, rate) {
    if (!this.ok || !text) { if (!this.ok) toast('這個瀏覽器不支援語音播放'); return; }
    const P = PAGE.voice;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(P.text ? P.text(text) : text);
      const v = voiceOverride || this.best();
      if (v) u.voice = v;
      u.lang = P.uLang(v);
      u.rate = rate || Number(SET.rate) || 0.9;
      speechSynthesis.speak(u);
    } catch (e) { toast('無法播放聲音'); }
  }
};
// 設定裡的「發音」區：選語音、速度、試聽
function renderVoiceBox() {
  const P = PAGE.voice;
  const box = $('#voiceBox'); if (!box) return;
  if (!Voice.ok) { box.innerHTML = '<div class="warn">這個瀏覽器不支援語音播放。建議改用 Safari、Chrome 或 Edge。</div>'; return; }
  Voice.refresh();
  const best = Voice.best();
  const opts = Voice.list.slice().sort((a, b) => Voice.score(b) - Voice.score(a));
  box.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    <label class="label" for="vsel">${P.label}</label>
    ${opts.length ? `<select id="vsel">${opts.map(v => `<option value="${esc(v.voiceURI)}"${best && v.voiceURI === best.voiceURI ? ' selected' : ''}>${esc(v.name)}${Voice.GOOD.test(v.name) ? '（較自然）' : ''}</option>`).join('')}</select>` : `<div class="meta">${P.none}</div>`}
    <div class="range"><label class="label" for="vrate">速度</label><input id="vrate" type="range" min="0.6" max="1.2" step="0.1" value="${SET.rate}"><span class="meta" id="vrateV">${Number(SET.rate).toFixed(1)} 倍</span></div>

}

// Sheet.open(標題 HTML, 內容 HTML, 給螢幕閱讀器的名稱) 回傳面板元素；Sheet.close()；Sheet.isOpen()。外觀用 base.css 的 .pk、.sheet-body
const Sheet = {

  open(title, body, label) {

    this.el.innerHTML = `<div class="pk-grab" aria-hidden="true"></div><div class="pk-top"><b>${title}</b><button class="pk-x" aria-label="關閉">${ICON.ng}</button></div><div class="sheet-body">${body}</div>`;

};
