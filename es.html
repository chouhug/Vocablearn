// 過關紀錄存在 items 的 prefix+id（跟著同步）：{ s:'gx', b:最佳分數, n:題數, p:1 }
const ICON_LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const gxKey = id => PAGE.gram.prefix + id;
const gxNeed = n => n >= 5 ? Math.ceil(n * 0.8) : n;   // 6 題要對 5 題
const gxTotal = id => (PAGE.gram.gx(id) || { q: [] }).q.length;
const gxPassed = id => !!(S.items[gxKey(id)] || {}).p;
function gxStages() {
  let prevDone = true;
  return (PAGE.gram.path || []).map(([title, desc, ids], i) => {
    const done = ids.filter(gxPassed).length;
    const st = done === ids.length ? 'done' : prevDone ? 'open' : 'locked';
    prevDone = prevDone && done === ids.length;
    return { i, title, desc, ids, done, st };
  });
}
const gxStageOf = id => gxStages().find(x => x.ids.includes(id));
function gxNext(after) {
  const flat = (PAGE.gram.path || []).flatMap(x => x[2]);
  const k = after ? flat.indexOf(after) : -1;
  return flat.slice(k + 1).find(id => !gxPassed(id)) || flat.find(id => !gxPassed(id) && id !== after) || '';
}
function gxRecord(id, right, total) {
  reloadShared();
  const old = S.items[gxKey(id)] || {};
  const r = { s: 'gx', b: Math.max(old.b || 0, right), n: total, t: Date.now() };
  if (old.p || right >= gxNeed(total)) r.p = 1;
  putRec(gxKey(id), r);
}
function gxPathHTML() {
  const T = PAGE.gram.title;
  const sts = gxStages();
  const total = sts.reduce((a, x) => a + x.ids.length, 0), passed = sts.reduce((a, x) => a + x.done, 0);
  const nx = gxNext(null), nt = nx && T(nx);
  return `<div class="card gp-top"><div class="gp-tt"><b>文法關卡</b><span>已過關 ${passed} / ${total}</span></div><div class="gp-bar"><i style="width:${(passed / total * 100).toFixed(1)}%"></i></div>
      <p class="meta">照順序學，後面的文法會用到前面的。每個文法點看完說明和範例，練習題答對八成就過關（6 題要對 5 題）；一關全部過關，下一關就會打開。</p>
      ${nt ? `<button class="btn solid block" data-gram="${nx}">繼續學：${esc(nt)}</button>` : '<p class="gp-all">全部過關了！</p>'}</div>` +
    sts.map(x => `<section class="gp-stage ${x.st}">
      <div class="gp-sh"><span class="gp-no">${x.st === 'done' ? ICON.ok : x.st === 'locked' ? ICON_LOCK : x.i + 1}</span><div class="gp-st"><b>第 ${x.i + 1} 關・${esc(x.title)}</b><span>${esc(x.desc)}</span></div><span class="gp-cnt">${x.done}/${x.ids.length}</span></div>
      ${x.st === 'locked' ? `<details class="gp-peek"><summary>完成上一關就會打開・先偷看這關的 ${x.ids.length} 個文法</summary>` : ''}
      ${x.ids.map(id => `<button class="gr-row gp-row${gxPassed(id) ? ' ok' : ''}${id === nx ? ' now' : ''}" data-gram="${id}"><b>${gxPassed(id) ? `<span class="gp-ck">${ICON.ok}</span>` : ''}${esc(T(id))}</b><span class="gn">${id === nx ? '<span class="gp-nowt">下一個</span>' : ''}›</span></button>`).join('')}${x.st === 'locked' ? '</details>' : ''}
    </section>`).join('');
}
function gxWhere(id) {
  const x = gxStageOf(id); if (!x) return '';
  const need = x.st === 'locked' ? gxStages().find(y => y.st !== 'done') : null;
  return `<div class="gp-where ${x.st}"><span>第 ${x.i + 1} 關・${esc(x.title)}</span>${gxPassed(id) ? `<b class="gp-pass">${ICON.ok}已過關</b>` : `<span class="gp-need">練習題答對 ${gxNeed(gxTotal(id))} 題就過關</span>`}${need ? `<p>這關還沒打開，建議先完成第 ${need.i + 1} 關「${esc(need.title)}」，內容一樣可以先看。</p>` : ''}</div>`;
}
// 練習題：四選一，答完一定顯示整句和「為什麼」，不自動跳下一題；算進今日題數，不進錯題和複習
function startGxQuiz(box, gx, id) {
  if (!box) return;
  const P = PAGE.gram;
  const qs = shuffle(gx.q); let i = 0, right = 0;
  const next = () => {
    if (!box.isConnected) return;
    if (i >= qs.length) {
      const all = right >= gxNeed(qs.length), perfect = right === qs.length;
      let nx = '', nt = '';
      if (id && P.path) {
        const before = gxStageOf(id);
        gxRecord(id, right, qs.length);
        const after = gxStageOf(id);
        if (before && after && before.st !== 'done' && after.st === 'done') toast(`第 ${after.i + 1} 關完成！${P.path[after.i + 1] ? `第 ${after.i + 2} 關打開了` : '全部關卡都過了'}`, true);
        nx = gxNext(id); nt = nx ? P.title(nx) : '';
      }
      const msg = all ? (perfect ? '全對，' : '') + (P.path ? '過關！' : '這個文法你會了。') : (P.path ? `答對 ${gxNeed(qs.length)} 題才算過關。` : '') + (right ? '差一點，看一下範例再練一次。' : '先看範例拆解，再回來試試。');
      box.innerHTML = `<div class="gx-done"><div class="gx-score">${right} / ${qs.length}</div><p>${msg}</p><div class="btnrow">${all && nx ? `<button class="btn solid" data-gram="${nx}">下一個：${esc(nt)}</button><button class="btn quiet" id="gxAgain">再練一次</button>` : `<button class="btn solid" id="gxAgain">再練一次</button><button class="btn quiet" data-gpane="ex">看範例</button>`}</div></div>`;
      $('#gxAgain', box).onclick = () => startGxQuiz(box, gx, id);
      $$('[data-gpane]', box).forEach(b => b.onclick = () => { gramPane = b.dataset.gpane; renderGram(); });
      const wh = $('.gp-where', box.closest('.card')); if (wh) wh.outerHTML = gxWhere(id);
      return;
    }
    const q = P.quizQ(qs[i++], id);
    renderChoice(box, {
      head: `<div class="qhead"><span class="meta">文法練習 ${i} / ${qs.length}</span></div>${q.head || ''}`,
      promptHTML: q.prompt,
      options: q.options,
      onAnswer: ok => { if (ok) right++; bumpDay(); const b = $('#blank', box); if (b) { b.textContent = q.ans; b.classList.add(ok ? 'ok' : 'ng'); } },
      explain: q.explain,
      noAuto: true
    }, next);
    if (P.quizBound) P.quizBound(box);
  };
  next();
}
// 文法點頁：說明／看範例／練習題三個分頁，說明下面是 App 裡用到這個文法的例句
function renderGramPoint(host, p, exs) {
  const P = PAGE.gram;
  const gx = P.gx(p.id);
  if (gramPaneId !== p.id) { gramPane = 'body'; gramPaneId = p.id; }
  if (!gx) gramPane = 'body';
  const seg = gx ? `<div class="seg gx-seg" role="group" aria-label="文法分頁">${[['body', '說明'], ['ex', '看範例'], ['q', '練習題']].map(([k, l]) => `<button data-gpane="${k}" aria-pressed="${gramPane === k}">${l}</button>`).join('')}</div>` : '';
  const pane = gramPane === 'ex' ? gxExamplesHTML(gx) : gramPane === 'q' ? '<div id="gxQuiz" class="gx-quiz"></div>' : `${P.body(p)}${gx ? `<div class="btnrow gx-cta"><button class="btn quiet" data-gpane="ex">看範例拆解</button><button class="btn solid" data-gpane="q">練習題（${gx.q.length} 題）</button></div>` : ''}`;
  const [title, lv] = P.head(p);
  host.innerHTML = `<button class="gr-back" id="grBack">‹ 文法列表</button>
    <div class="card">
      <div class="gr-head"><h2>${esc(title)}</h2><span class="lv">${lv}</span></div>
      ${gxWhere(p.id)}${seg}${pane}
    </div>
    ${gramPane !== 'body' ? '' : P.exCard(p, exs)}`;
  $('#grBack', host).onclick = () => { UI.gramSel = ''; saveUI(); renderGram(); window.scrollTo(0, 0); };
  const m = $('#grMore', host); if (m) m.onclick = () => { gramShow += 8; renderGram(); };
  $$('[data-gpane]', host).forEach(b => b.onclick = () => { gramPane = b.dataset.gpane; renderGram(); const c = $('.gr-head', host); if (c && c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: 'start' }); });
  if (gramPane === 'q') startGxQuiz($('#gxQuiz', host), gx, p.id);
}
// 點任何 data-gram 的東西（文法列表、字卡的文法標籤、練習題的「下一個」）就打開那個文法點
function openGram(id) {
  UI.gramSel = id; gramShow = 8; saveUI();

document.addEventListener('click', e => {

function fillList(d) {
  const key = libList;

  if (key === 'learned') arr = arr.slice().sort((a, b) => (getRec(a.id).due || '').localeCompare(getRec(b.id).due || ''));
  const box = $('.lrows', d);
  if (!arr.length) { box.innerHTML = '<div class="lrow"><span class="z">目前是空的</span></div>'; return; }
  const act = { queued: '移除', learned: '移回未學', mcWrong: '移除', mcReview: '移除', fillWrong: '移除', fillReview: '移除', excluded: '恢復', mine: '編輯' }[key];
  box.innerHTML = arr.map(w => {
    const r = getRec(w.id);
    const dd = key === 'learned' ? `<span class="d">${r.due ? r.due.slice(5).replace('-', '/') : ''} · 第${(r.lv || 0) + 1}級</span>` : '';
    return `<div class="lrow">${PAGE.lib.wordCell(w)}<span class="z">${meanW(w)}</span>${dd}<button data-id="${esc(w.id)}">${act}</button></div>`;
  }).join('');
  $$('button[data-id]', box).forEach(b => b.onclick = () => {
    const id = b.dataset.id, r = getRec(id);
    if (key === 'mine') return editMine(id);
    if (key === 'queued') touch(id, { s: 'new' });
    else if (key === 'learned') touch(id, { s: 'new', lv: 0, due: '' });
    else if (key === 'excluded') touch(id, { s: 'new' });
    else { const w = Object.assign({}, r.w); delete w[/^mc/.test(key) ? 'mc' : 'fill']; touch(id, { w }); }

// ================= 線上查字典（n5src/shared/dict.js） =================
// 給「我的單字」表單用：查英文解釋（英文版 Wiktionary 的 REST API，依語言分好）和中文翻譯（MyMemory，機器翻譯）。
// 兩個服務都不用金鑰、允許網頁直接連（CORS）；sw.js 不會快取這些連線，沒網路就查不到。
// 這個檔不用頁面的變數（只用 fetch），所以 n5src/dict-test.js 可以直接測。
const DICT_POS = { Noun: ['名詞', 'n'], 'Proper noun': ['專有名詞', 'n'], Verb: ['動詞', 'v'], Adjective: ['形容詞', 'adj'], Adverb: ['副詞', 'o'], Preposition: ['介係詞', 'o'], Pronoun: ['代名詞', 'o'], Conjunction: ['連接詞', 'o'], Interjection: ['感嘆詞', 'o'], Determiner: ['限定詞', 'o'], Article: ['冠詞', 'o'], Numeral: ['數詞', 'o'], Particle: ['助詞', 'o'], Phrase: ['片語', 'o'], Idiom: ['慣用語', 'o'], 'Prepositional phrase': ['介係詞片語', 'o'], Proverb: ['諺語', 'o'] };
// Wiktionary 的解釋是 HTML：拿掉標籤，留下文字
const dictText = h => String(h || '').replace(/<style[\s\S]*?<\/style>/gi, '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#0?39;|&apos;/g, "'").replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
// 回傳 JSON；查不到（404 等）回傳 null；連不上或逾時回傳 undefined
async function dictFetch(url, ms = 8000) {
  const ac = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = setTimeout(() => ac && ac.abort(), ms);
  try { const r = await fetch(url, ac ? { signal: ac.signal } : {}); return r.ok ? await r.json() : null; }
  catch (e) { return undefined; }
  finally { clearTimeout(timer); }
}
// 回傳 { defs: [{ pos, zh 詞性中文, p 詞性分組, defs: [英文解釋…] }], zh: [中文翻譯…], offline: 兩個服務都連不上 }
async function dictLookup(word, lang) {
  word = String(word).trim().replace(/\s+/g, ' ');
  // Wiktionary 的條目分大小寫（德文名詞大寫、句首的字小寫），照打的、全小寫、首字大寫各試一次
  const forms = [...new Set([word, word.toLowerCase(), word.charAt(0).toUpperCase() + word.slice(1)])];
  const wik = (async () => {
    for (const f of forms) {
      const j = await dictFetch('https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(f.replace(/ /g, '_')));
      if (j === undefined) return undefined;
      if (j && Array.isArray(j[lang]) && j[lang].length) return j[lang];
    }
    return [];
  })();
  const mm = dictFetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=' + lang + '|zh-TW');
  const [w, m] = await Promise.all([wik, mm]);
  const defs = [];
  for (const e of w || []) {
    const ds = (e.definitions || []).map(d => dictText(d.definition)).filter(Boolean).slice(0, 3);
    const info = DICT_POS[e.partOfSpeech] || [e.partOfSpeech || '', 'o'];
    if (ds.length) defs.push({ pos: e.partOfSpeech || '', zh: info[0], p: info[1], defs: ds });
  }
  // 中文：只留真的有中文字、不太長的；同一個字的翻譯記憶先看品質分數，最後才是整句的機器翻譯
  const zh = [], han = s => /[一-鿿]/.test(s) && s.length <= 20;
  const add = s => { s = String(s || '').trim().replace(/\s+/g, ''); if (han(s) && !zh.includes(s)) zh.push(s); };
  if (m && Array.isArray(m.matches)) {
    m.matches.filter(x => String(x.segment || '').trim().toLowerCase() === word.toLowerCase())
      .sort((a, b) => (Number(b.quality) || 0) - (Number(a.quality) || 0) || (b.match || 0) - (a.match || 0))
      .forEach(x => add(x.translation));
  }
  if (m && m.responseData) add(m.responseData.translatedText);
  return { defs: defs.slice(0, 4), zh: zh.slice(0, 3), offline: w === undefined && m === undefined };
}
// 日文的讀音：從 Wiktionary 條目原始碼的 {{ja-pos|noun|ひげ}}、{{ja-noun|ひげ}}、{{ja-verb|type=1|そる}} 這類標籤找假名。
// 回傳候選讀音（可能是空陣列）；連不上回傳 undefined。這裡不檢查對不對得上，由頁面用 align() 確認後才填。
async function dictReading(word) {
  const j = await dictFetch('https://en.wiktionary.org/w/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&format=json&formatversion=2&redirects=1&origin=*&titles=' + encodeURIComponent(String(word).trim()));
  if (j === undefined) return undefined;
  const pg = j && j.query && j.query.pages && j.query.pages[0];
  const txt = pg && pg.revisions && pg.revisions[0] && pg.revisions[0].slots && pg.revisions[0].slots.main;
  const src = txt ? String(txt.content != null ? txt.content : txt['*'] || '') : '';
  const at = src.indexOf('==Japanese==');
  if (at < 0) return [];
  const rest = src.slice(at + 12), end = rest.search(/\n==[^=]/);
  const ja = end < 0 ? rest : rest.slice(0, end);
  const out = [], kana = /^[ぁ-ゖァ-ヺー]+$/;
  for (const m of ja.matchAll(/\{\{ja-(?:pos|noun|verb|verb-suru|adj|phrase|adv|see)\|([^{}]*)\}\}/g)) {
    for (const a of m[1].split('|')) {
      if (a.includes('=')) continue;
      const k = a.replace(/[\s.\-^%']/g, '');
      if (kana.test(k) && !out.includes(k)) out.push(k);
    }
  }
  return out;
}
// ================= 我的單字：新增／編輯自己的單字（n5src/shared/mine.js） =================
// 自己新增的字存在進度紀錄的 c 欄位（S.items[id].c），所以會跟著合併和 Google 同步；頁面的 syncMine() 把它們放進 WORDS。
// 各頁不一樣的地方在 PAGE.mine：
//   prefix 紀錄 id 的開頭、lang 輸入框的語言代碼、name 語言名稱、posOpts 詞性選項（沒有就不顯示詞性）、
//   readings（日文）：多兩個欄位「讀音」c.r 和「例句的讀法」c.sr、
//   dict（有才顯示「查字典」，程式在 shared/dict.js）：線上字典用的語言代碼、
//   needReading(word)（日文）：這個字要不要填讀音、autoReading(word)（日文）：查讀音，回傳對得上的假名或 ''、
//   meanEn：介面是英文，自動填意思時先用英文解釋、
//   guessForm(例句, 單字)：沒填「例句裡的寫法」時猜例句裡的樣子（找不到回傳 ''）、
//   builtin(word) 單字庫裡原本就有的同一個字、check(c) 檢查內容（回傳錯誤訊息或 ''）、changed() 存檔或刪除後更新畫面
// 表單只露出「單字、（讀音）、意思」三欄：打完單字會自動查字典，把第一個中文翻譯（日文連讀音）填好；
// 例句、詞性這些放在「更多」裡，可以不填
// look：打開就先查一次字典（從「查字典並加到我的單字」進來）
function editMine(id, preset, look_) {
  const M = PAGE.mine;
  const old = id && S.items[id] && S.items[id].c;
  const c = old || { w: preset || '', zh: '', p: 'o' };
  const field = (k, label, val, lang) => `<label class="label" for="my-${k}">${label}</label><input id="my-${k}" type="text" value="${esc(val || '')}"${lang ? ` lang="${lang}"` : ''} autocapitalize="off" autocorrect="off" spellcheck="false"${k === 'w' && M.dict ? ' enterkeyhint="search"' : ''}>`;
  const hasMore = !!(c.s || (c.p && c.p !== 'o'));
  const el = Sheet.open(old ? '編輯我的單字' : '新增自己的單字', `<form id="myForm" class="myform" autocomplete="off" novalidate>
    ${field('w', `單字或片語（${esc(M.name)}）`, c.w, M.lang)}
    ${M.readings ? `<div id="myRBox"${M.needReading(c.w || '') || c.r ? '' : ' hidden'}>${field('r', '讀音（假名）', c.r, M.lang)}</div>` : ''}
    ${field('zh', '意思', c.zh)}
    ${M.dict ? '<div class="dictbox" id="myDict" hidden></div>' : ''}
    <details class="mymore" id="myMore"${hasMore ? ' open' : ''}><summary>更多：例句${M.posOpts ? '、詞性' : ''}（可以不填）</summary><div class="myform">
    ${M.posOpts ? `<label class="label" for="my-p">詞性（只用來篩選）</label>
    <select id="my-p">${M.posOpts.map(([k, l]) => `<option value="${k}"${(c.p || 'o') === k ? ' selected' : ''}>${l}</option>`).join('')}</select>` : ''}
    <label class="label" for="my-s">例句</label>
    <textarea id="my-s" lang="${M.lang}" rows="2" autocapitalize="off" autocorrect="off" spellcheck="false">${esc(c.s || '')}</textarea>
    ${field('sz', '例句的中文', c.sz)}
    ${M.readings ? field('sr', '例句的讀法（整句用平假名；填了例句的漢字才有振り仮名）', c.sr, M.lang) : ''}
    ${field('a', '例句裡的寫法（通常不用填，App 會自己找；找錯了再填）', c.a, M.lang)}
    </div></details>
    <div class="hl-warn" id="myMsg" role="alert" hidden></div>
    <div class="btnrow${old ? '' : ' one'}">${old ? '<button class="btn quiet" type="button" id="myDel">刪除</button>' : ''}<button class="btn solid" type="submit">儲存</button></div>
    <p class="meta" style="margin:0">存好就列入考題。${M.dict ? '打完單字會自動查字典（Wiktionary、MyMemory），填好的意思可以自己改。' : ''}</p>
  </form>`);
  const val = k => { const x = $('#my-' + k, el); return x ? x.value.trim().replace(/\s+/g, ' ') : ''; };
  const more = $('#myMore', el);
  const msg = t => { const m = $('#myMsg', el); m.textContent = t; m.hidden = !t; if (t) m.scrollIntoView({ block: 'nearest' }); };
  const done = text => { saveLocal(); Cloud.schedule(); Sheet.close(); M.changed(); toast(text); };
  const rbox = $('#myRBox', el);
  const showR = () => { if (rbox) rbox.hidden = !(M.needReading(val('w')) || val('r')); };
  $('#myForm', el).onsubmit = e => {
    e.preventDefault();
    let n = { w: val('w'), zh: val('zh') };
    if (M.posOpts) n.p = $('#my-p', el).value;
    if (M.readings && val('r')) n.r = val('r');
    if (val('s')) { n.s = val('s'); if (val('sz')) n.sz = val('sz'); if (val('a') && val('a') !== n.w) n.a = val('a'); if (M.readings && val('sr')) n.sr = val('sr'); }
    const nid = M.prefix + n.w;
    reloadShared();
    let err = !n.w ? '請輸入單字。' : !n.zh ? '請輸入意思（也可以等字典查完自動填）。' : '';
    if (!err && nid !== id) err = M.builtin(n.w) ? `單字庫裡本來就有「${n.w}」，用上面的搜尋就找得到。` : S.items[nid] && S.items[nid].c ? `你已經新增過「${n.w}」了。` : '';
    if (!err) err = M.check(n);
    // 例句裡找不到原形：猜例句裡的寫法（whisker → whiskers、食べる → 食べました）
    if (err && n.s && !n.a && M.guessForm) {
      const g = M.guessForm(n.s, n.w), n2 = g && g !== n.w ? Object.assign({}, n, { a: g }) : null;
      if (n2 && !M.check(n2)) { n = n2; err = ''; }
    }
    if (err) { Sfx.ng(); if (/例句/.test(err)) more.open = true; return msg(err); }
    const now = Date.now(), prev = id && S.items[id];
    const r = Object.assign(prev ? JSON.parse(JSON.stringify(prev)) : blankRec(), { c: n, t: now });
    if (!prev) { r.s = 'queued'; r.q = now; }
    if (prev && nid !== id) S.items[id] = Object.assign(blankRec(), { t: now });   // 改了單字本身：進度帶到新的，舊的刪掉
    S.items[nid] = r;
    done(old ? '已儲存' : '已加到我的單字，並列入考題');
  };
  // ---- 自動查字典：打完單字（離開欄位或按 Enter）就查，第一個中文翻譯直接填進「意思」----
  const dbox = $('#myDict', el), wIn = $('#my-w', el);
  let seq = 0, lastWord = old ? c.w : '';
  const runLook = async force => {
    const word = val('w');
    if (!dbox || !word || (!force && word === lastWord)) return;
    lastWord = word;
    const my = ++seq, zhIn = $('#my-zh', el), rIn = $('#my-r', el);
    dbox.hidden = false; dbox.innerHTML = '<p class="meta" style="margin:0">正在查「' + esc(word) + '」…</p>';
    const needR = M.readings && M.autoReading && M.needReading(word) && !val('r');
    const [r, rd] = await Promise.all([dictLookup(word, M.dict), needR ? M.autoReading(word) : '']);
    if (my !== seq || !document.contains(dbox)) return;   // 查的時候又改了單字，或面板已經關了
    const notes = [];
    if (rd && rIn && !val('r')) { rIn.value = rd; showR(); notes.push('讀音'); }
    if (r.offline) { dbox.innerHTML = '<p class="meta" style="margin:0">連不上字典，意思請自己填。</p><button type="button" class="linkbtn" id="myRe" style="align-self:flex-start">再查一次</button>'; }
    else if (!r.defs.length && !r.zh.length) { dbox.innerHTML = '<p class="meta" style="margin:0">字典裡查不到「' + esc(word) + '」（可以檢查拼字，或改查原形）。意思請自己填。</p>'; }
    else {
      const enFirst = r.defs[0] && r.defs[0].defs[0];
      const first = (M.meanEn ? enFirst || r.zh[0] : r.zh[0] || enFirst) || '';
      if (first && !zhIn.value.trim()) { zhIn.value = first; notes.push('意思'); }
      dbox.innerHTML = (notes.length ? `<p class="meta dict-auto" style="margin:0">已自動填入${notes.join('和')}，不對可以直接改，或點下面其他的意思。</p>` : '') +
        (r.zh.length ? `<div class="label">中文（機器翻譯，可能不準）</div><div class="chips dict-zh">${r.zh.map(z => `<button type="button" class="chip" data-fill="${esc(z)}"${z === zhIn.value.trim() ? ' aria-pressed="true"' : ''}>${esc(z)}</button>`).join('')}</div>` : '') +
        (r.defs.length ? `<details class="dict-en"${r.zh.length && !M.meanEn ? '' : ' open'}><summary>英文解釋（Wiktionary）</summary>${r.defs.map(d => `<div class="dict-pos">${esc(d.zh)}${d.zh !== d.pos && d.pos ? ` <span lang="en">${esc(d.pos)}</span>` : ''}</div>${d.defs.map(x => `<button type="button" class="dict-def" lang="en" data-fill="${esc(x)}">${esc(x)}</button>`).join('')}`).join('')}</details>` : '');
      // 點一下：換成這個意思；按住已經填好的再點別的，會接在後面
      $$('[data-fill]', dbox).forEach(b => b.onclick = () => {
        const t = b.dataset.fill, cur = zhIn.value.trim(), auto = notes.includes('意思') && cur === first;
        if (!cur || auto) zhIn.value = t; else if (!cur.split('；').includes(t)) zhIn.value = cur + '；' + t;
        notes.length = 0;
        $$('[data-fill]', dbox).forEach(x => x.setAttribute('aria-pressed', String(zhIn.value.split('；').includes(x.dataset.fill))));
        msg('');
      });
      const sel = $('#my-p', el);
      if (sel && r.defs.length && sel.value === 'o' && M.posOpts.some(o => o[0] === r.defs[0].p)) sel.value = r.defs[0].p;
    }
    const re = $('#myRe', dbox); if (re) re.onclick = () => runLook(true);
  };
  wIn.addEventListener('input', showR);
  wIn.addEventListener('change', () => runLook());
  wIn.addEventListener('keydown', e => { if (e.key === 'Enter' && dbox) { e.preventDefault(); runLook(); $('#my-zh', el).focus(); } });
  if (dbox && look_ && !old && c.w) runLook();
  const del = $('#myDel', el);
  if (del) del.onclick = () => {
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = '確定刪除？'; return; }
    reloadShared();
    S.items[id] = Object.assign(blankRec(), { t: Date.now() });   // 留下空白紀錄（帶時間），同步時其他裝置也會刪掉
    done('已刪除');
  };
  if (!c.w) setTimeout(() => wIn.focus(), 250);
}
// 切換語言選單裡的進度條（lang.js）
if (window.AppLangs && AppLangs.stats) AppLangs.stats(() => { const c = libCounts(); return { l: c.learned, t: Math.max(1, c.total - c.excluded) }; });
function doSearch(qs) {
  const box = $('#results');
  const q = qs.trim().toLowerCase();
  if (!q) { box.innerHTML = ''; return; }
  const qa = IT.stripAccents(q);
  let hits = WORDS.filter(w => IT.stripAccents((w.word + ' ' + w.title + ' ' + w.e[3]).toLowerCase()).includes(qa) || w.zh.includes(qs.trim()) || (q.length > 1 && /^[a-z ]+$/.test(q) && w.en.toLowerCase().includes(q)));
  hits.sort((a, b) => (IT.stripAccents(a.word.toLowerCase()).startsWith(qa) ? 0 : 1) - (IT.stripAccents(b.word.toLowerCase()).startsWith(qa) ? 0 : 1));
  hits = hits.slice(0, 30);
  if (!hits.length) { box.innerHTML = `<div class="meta">找不到符合的字。</div><button class="btn quiet" data-addmine="${esc(qs.trim())}" style="align-self:flex-start">查字典並把「${esc(qs.trim())}」加到我的單字</button>`; return; }
  box.innerHTML = hits.map(w => {
    const r = getRec(w.id);
    const canQ = r.s === 'new' || r.s === 'excluded';
    return `<div class="res">
      <div class="hd"><span class="w" lang="${LC.id}" style="font-family:var(--font-ui);font-weight:700">${esc(w.title)}</span><span>${meanW(w)}</span>${posBadge(w)}</div>
      <div class="row"><span class="st ${r.s}">${STATUS_TXT[r.s] || '未學'}</span><span class="meta">作答 ${r.n || 0} 次</span></div>
      <div class="sent sm" lang="${LC.id}">${sentHTML(w.sent)}</div>
      <div class="meta" style="color:var(--fg)">${esc(w.sentZh)}</div>
      <div class="row">${playBtn(w.title, '單字')}${playBtn(w.sent, '例句')}${canQ ? `<button class="btn" data-q="${esc(w.id)}" style="min-height:44px">列入考題</button>` : ''}</div>
    </div>`;
  }).join('');
  $$('[data-q]', box).forEach(b => b.onclick = () => { touch(b.dataset.q, { s: 'queued' }); toast('已列入考題'); doSearch($('#q').value); });
}

const Cloud = makeCloud({ getS: () => S, setS: v => { S = v; }, saveLocal, merge: mergeState, refresh: refreshPassive, toast, renderAuth: renderAuthBox, reload: reloadShared });   // 程式在 sync.js（所有語言頁共用）
const GOOGLE_G = '<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
function renderAuthBox() {
  const top = $('#authTop');
  if (top) {
    if (Cloud.mode === 'google' && !Cloud.user) {
      top.innerHTML = `<div class="authcard"><div><b>用 Google 帳號存進度</b><div class="meta">每個語言的進度會一起存到雲端。</div></div><button class="btn solid gbtn-signin" id="gInTop">${GOOGLE_G}登入</button></div>`;
      $('#gInTop', top).onclick = () => Cloud.signIn();

  const box = $('#authBox'); if (!box) return;
  if (Cloud.mode !== 'google') { box.innerHTML = ''; return; }

    $('#gOut', box).onclick = () => Cloud.signOut();
  } else {
    box.innerHTML = `<button class="btn solid block gbtn-signin" id="gIn">${GOOGLE_G}用 Google 登入</button>`;
    $('#gIn', box).onclick = () => Cloud.signIn();
  }
}
// 從雲端或日文頁合併進來後，只更新不會打斷作答的地方
function refreshPassive(force) {
  if (syncMine()) { deck = null; force = true; }   // 別的裝置新增、改了、刪了自己的單字
  renderGoal();
  if (UI.tab === 'lib' && (force || (!$('#bk')?.innerHTML && !document.activeElement?.matches?.('#q')))) renderLib();
  if (force && UI.tab === 'card') renderCard();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { reloadShared(); refreshPassive(); Cloud.schedule(500); } });
// 同一台裝置在別的分頁改了進度（例如日文頁）
window.addEventListener('storage', e => { if (e.key === 'n5:progress') { reloadShared(); refreshPassive(); } if (e.key === 'n5:settings') { const nl = (store.get('n5:settings', {}) || {}).lang === 'en' ? 'en' : 'zh'; if (nl !== LANG && typeof I18N !== 'undefined') return location.reload(); Object.assign(SET, store.get('n5:settings', {})); applyTheme(); applyGen(); } });

// 換介面語言（所有頁共用 n5:settings 的 lang）：單字意思跟著換，再重新載入
function setLang(lang) {
  if (lang === LANG) return;
  SET.lang = lang;
  if (lang === 'en' && SET.mean === 'zh') SET.mean = 'en';
  if (lang === 'zh' && SET.mean === 'en') SET.mean = 'zh';
  saveSet();
  location.reload();
}
// ================= 首次使用導覽（各語言的文字可以在 config.js 用 tourIntro、tourPron、tourFill 覆寫） =================
PAGE.tour = {
  key: LP + 'toured',
  get art() {
    const g = esc(LC.glyph), fs = [...LC.glyph].length > 1 ? 22 : 28;
    return `<svg class="tour-art" viewBox="0 0 320 110" aria-hidden="true"><rect width="320" height="110" rx="12" fill="var(--surface2)"/><circle cx="252" cy="34" r="16" fill="var(--c2)"/><path d="M0 110 L70 46 L120 82 L170 30 L240 110Z" fill="var(--c1)"/><path d="M150 50 L170 30 L190 50 L180 46 L170 54 L160 46Z" fill="var(--surface)"/><path d="M120 110 L210 62 L320 104 L320 110Z" fill="var(--c3)"/><path d="M0 98 C60 88 110 104 170 96 S280 86 320 96 L320 110 L0 110Z" fill="var(--pri-soft)"/><rect x="26" y="20" width="44" height="44" rx="10" fill="var(--fill)"/><text x="48" y="51" text-anchor="middle" font-size="${fs}" font-weight="700" fill="var(--fill-ink)" font-family="var(--font-ui)">${g}</text></svg>`;
  },
  steps: () => [
    { t: `歡迎使用${LC.name} ${LC.level}`, d: LC.tourIntro || `從字母和發音開始，學${LC.name} ${LC.level} 的單字和文法。用 30 秒認識每個分頁。` },
    { el: '.brand', t: '切換語言', d: '點左上角的語言名稱可以換到別的語言；也可以鎖定只學其中幾個語言，避免一次學太多。' },
    { el: '[data-tab="pron"]', tab: 'pron', t: '發音', d: LC.tourPron || '字母表點一下可以聽發音、看例字；「規則」整理拼字怎麼唸，「練習」有聽音選拼字、看拼字選讀法。' },
    { el: '[data-tab="card"]', tab: 'card', t: '字卡：挑要學的字', d: '新字一張一張看：已經會的按「已經會了」，想練的按「列入考題」，之後單選和填空就會出這些字。' },
    { el: '[data-tab="mc"]', tab: 'mc', t: '單選', d: `${MC_MODES.map(m => m[1]).join('、')}，左上角可以換題型和題目來源。` },
    { el: '[data-tab="fill"]', tab: 'fill', t: '填空', d: '看例句打出空格裡的字，答對才算「已學會」，之後照時間排到期複習。' + (LC.tourFill || '') },
    { el: '[data-tab="gram"]', tab: 'gram', t: '文法', d: '文法分成好幾關，照順序學：每個文法點有說明、拆開的範例和練習題，答對八成就過關。下面還有詞性變化規則。' },
    { el: '[data-tab="lib"]', tab: 'lib', t: '單字庫・設定', d: '看進度、搜尋單字、進入錯題和到期複習。下面的「設定」可以調音效、選語音、用 Google 登入同步進度。' },
    { el: ['#genBtn', '#themeBtn'], t: '上方的小按鈕', d: $('#genBtn') ? '「名」切換名詞上方的性別標示，最右邊切換淺色／深色。' : '最右邊的按鈕切換淺色／深色。' },
    { t: '小提示', d: '例句裡的單字都可以點，會跳出意思和詳細資料。準備好就開始吧！', last: true }
  ],
  fresh: () => !Object.keys(S.items).some(id => id.startsWith(LP))
};
// ================= 首次使用導覽（日文頁和語言頁共用） =================
// 各頁不同的地方放在 PAGE.tour：
//   key      記錄「看過導覽」的 localStorage 鍵（日文 n5:toured、語言頁 it:toured…）
//   steps()  步驟陣列 [{ t 標題, d 說明, el 要框起來的元素（選擇器或陣列）, tab 要切到的分頁, last 最後一步 }]
//            el 找不到的步驟會自動跳過（例如英文頁沒有「名」按鈕）
//   art      第一步上方的插畫（HTML）
//   extra(st)、bind(card, Tour)  步驟裡額外的內容和按鈕（日文頁用來選介面語言）
//   fresh()  還沒有這個語言的學習紀錄（有紀錄的人不會自動跳出導覽）
const Tour = {
  i: 0, ring: null, card: null, back: null, list: [],
  start(i) {
    const T = PAGE.tour;
    this.list = T.steps().filter(st => !st.el || [].concat(st.el).some(s => $(s)));
    this.i = Math.max(0, Math.min(this.list.length - 1, i || 0));
    if (!this.ring) {
      this.ring = document.createElement('div'); this.ring.className = 'tour-ring';
      this.card = document.createElement('div'); this.card.className = 'tour-card'; this.card.setAttribute('role', 'dialog'); this.card.setAttribute('aria-modal', 'true');
      this.back = document.createElement('div'); this.back.style.cssText = 'position:fixed;inset:0;z-index:69';
      document.body.append(this.back, this.ring, this.card);
      window.addEventListener('resize', () => this.place());
    }
    this.back.hidden = this.ring.hidden = this.card.hidden = false;
    this.show();
  },
  show() {
    const T = PAGE.tour, st = this.list[this.i];
    if (st.tab && UI.tab !== st.tab) showTab(st.tab);
    const dots = this.list.map((_, j) => `<i class="${j === this.i ? 'on' : ''}"></i>`).join('');
    this.card.setAttribute('aria-label', st.t);
    this.card.innerHTML = `${this.i === 0 && T.art ? T.art : ''}<h3>${esc(st.t)}</h3><p>${esc(st.d)}</p>
      ${T.extra ? T.extra(st) : ''}
      <div class="tour-dots" aria-hidden="true">${dots}</div>
      <div class="row">${st.last ? '' : '<button class="btn quiet" data-tour="skip">略過</button>'}${this.i > 0 && !st.last ? '<button class="btn quiet" data-tour="prev">上一步</button>' : ''}<button class="btn solid" data-tour="${st.last ? 'end' : 'next'}">${st.last ? '開始學習' : '下一步'}</button></div>`;
    if (T.bind) T.bind(this.card, this);
    $$('[data-tour]', this.card).forEach(b => b.onclick = () => { const a = b.dataset.tour; if (a === 'next') this.go(this.i + 1); else if (a === 'prev') this.go(this.i - 1); else this.end(); });
    this.place();
    requestAnimationFrame(() => { const f = $('[data-tour="next"],[data-tour="end"]', this.card); if (f) f.focus({ preventScroll: true }); });
  },
  go(i) { this.i = Math.max(0, Math.min(this.list.length - 1, i)); this.show(); },
  place() {
    if (!this.card || this.card.hidden) return;
    const st = this.list[this.i], vh = window.innerHeight;
    const els = st.el ? [].concat(st.el).map(s => $(s)).filter(Boolean) : [];
    this.card.style.top = this.card.style.bottom = '';
    if (!els.length) {
      this.ring.classList.add('none');
      this.card.style.top = Math.max(16, (vh - this.card.offsetHeight) / 2) + 'px';
      return;
    }
    this.ring.classList.remove('none');
    const rs = els.map(e => e.getBoundingClientRect());
    const r = { l: Math.min(...rs.map(x => x.left)), t: Math.min(...rs.map(x => x.top)), r: Math.max(...rs.map(x => x.right)), b: Math.max(...rs.map(x => x.bottom)) };
    const pad = 4;
    Object.assign(this.ring.style, { left: (r.l - pad) + 'px', top: (r.t - pad) + 'px', width: (r.r - r.l + pad * 2) + 'px', height: (r.b - r.t + pad * 2) + 'px' });
    if (r.t > vh / 2) this.card.style.bottom = (vh - r.t + 14) + 'px';
    else this.card.style.top = (r.b + 14) + 'px';
  },
  end() {
    store.set(PAGE.tour.key, 1);
    this.back.hidden = this.ring.hidden = this.card.hidden = true;
    showTab('card');
  },
  // 啟動時呼叫：沒看過導覽、也還沒有這個語言的紀錄才自動開始。
  // 第一次使用要先選語言（lang.js 的「你想學哪個語言？」），選完留在這一頁才開始
  auto() {
    if (window.AppLangs && AppLangs.welcome) return AppLangs.afterWelcome(() => this.auto());
    if (!store.get(PAGE.tour.key, 0) && PAGE.tour.fresh()) this.start(0);
  }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Tour.card && !Tour.card.hidden) Tour.end(); });

// ================= 啟動 =================
syncMine();
applyTheme();
renderGoal();
Voice.init();
showTab(UI.tab);
Cloud.init();
Tour.auto();
window.ITApp = { showTab, Tour, openWord, openToken, getRec, record, touch, S: () => S, UI, SET, WORDS };
})();

</script>
